<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="420" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — le châssis commun des écrans du RPG (EX-IHM-090)</text>

  <rect x="20" y="40" width="560" height="315" fill="#6a6152"/>
  <text x="30" y="58" font-size="10" fill="#fbf8f0">scène en arrière-plan, assombrie</text>

  <rect x="60" y="66" width="480" height="270" fill="#ece4d1" stroke="#9a7420" stroke-width="3"/>
  <rect x="60" y="66" width="480" height="30" fill="#25201a"/>
  <text x="76" y="86" font-size="14" fill="#9a7420" font-weight="600">FICHE DE PERSONNAGE</text>
  <text x="440" y="86" font-size="10" fill="#d6c9a8">Échap / B : fermer</text>
  <g font-size="11">
    <rect x="60" y="96" width="480" height="22" fill="#d6c9a8"/>
    <rect x="68" y="98" width="70" height="20" fill="#ece4d1" stroke="#9a7420"/><text x="82" y="112" fill="#25201a" font-weight="600">Fiche</text>
    <text x="156" y="112" fill="#6a6152">Sac</text><text x="200" y="112" fill="#6a6152">Équipe</text><text x="258" y="112" fill="#6a6152">Journal</text><text x="322" y="112" fill="#6a6152">Carte</text>
    <text x="440" y="112" fill="#6a6152">LB / RB : écran voisin</text>
  </g>
  <rect x="76" y="132" width="180" height="150" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="84" y="150" font-size="11" fill="#25201a" font-weight="600">Grom Tranche-Écaille</text>
  <text x="84" y="166" font-size="10" fill="#6a6152">Humaine · Guerrière niv. 3</text>
  <g font-size="10" fill="#25201a"><text x="84" y="190">For 16 (+3)</text><text x="84" y="206">Dex 12 (+1)</text><text x="84" y="222">Con 14 (+2)</text><text x="170" y="190">Int 10 (+0)</text><text x="170" y="206">Sag 11 (+0)</text><text x="170" y="222">Cha 9 (−1)</text></g>
  <text x="84" y="250" font-size="10" fill="#25201a">CA 16 · PV 32 · Vitesse 6 cases</text>
  <text x="84" y="266" font-size="10" fill="#6a6152">valeurs calculées (EX-RPG-001)</text>
  <rect x="272" y="132" width="252" height="150" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="280" y="150" font-size="11" fill="#25201a" font-weight="600">Maîtrises et traits</text>
  <g font-size="10" fill="#25201a"><text x="280" y="170">Athlétisme · Perception</text><text x="280" y="186">Armures lourdes · Boucliers</text><text x="280" y="202">Second souffle : 1/1 (repos court)</text></g>
  <rect x="280" y="214" width="236" height="16" fill="none" stroke="#8a2233" stroke-width="2"/>
  <text x="286" y="226" font-size="10" fill="#8a2233">◀ élément focalisé : marque explicite (EX-IHM-071)</text>
  <rect x="60" y="306" width="480" height="30" fill="#25201a"/>
  <g font-size="10" fill="#fbf8f0"><text x="76" y="325">A : détail</text><text x="160" y="325">X : équiper</text><text x="250" y="325">Y : comparer</text><text x="380" y="325">Suspend la simulation : oui</text></g>

  <g fill="#25201a" font-size="12">
    <text x="600" y="80" font-weight="600">Le même cadre pour huit écrans</text>
    <text x="600" y="102">— un titre, une zone de contenu,</text>
    <text x="600" y="118">un pied d'actions ;</text>
    <text x="600" y="142">— la même ouverture, la même</text>
    <text x="600" y="158">fermeture, le passage d'un écran</text>
    <text x="600" y="174">à l'autre sans repasser par le menu ;</text>
    <text x="600" y="198">— une règle de superposition</text>
    <text x="600" y="214">déclarée par l'écran (EX-IHM-091) :</text>
    <text x="600" y="230">la fiche suspend, la carte aussi ;</text>
    <text x="600" y="254">— la matière : parchemin pour</text>
    <text x="600" y="270">le personnage, panneaux sombres</text>
    <text x="600" y="286">pour les menus (EX-IHM-070).</text>
  </g>
  <text x="600" y="320" font-size="11" fill="#6a6152">Captures réelles : jeu-charactersheet.jpg,</text>
  <text x="600" y="336" font-size="11" fill="#6a6152">jeu-inventory.jpg, jeu-journal.jpg.</text>

  <text x="20" y="384" font-size="11" fill="#6a6152">La disposition se règle dans Qt Design Studio ; la maquette fixe ce que le châssis garantit, non le pixel. L'ossature d'un écran</text>
  <text x="20" y="400" font-size="11" fill="#6a6152">(ses blocs, leurs libellés) est un formulaire déclaratif (EX-IHM-103), ses textes passent par le catalogue (EX-REN-033).</text>
</svg>
