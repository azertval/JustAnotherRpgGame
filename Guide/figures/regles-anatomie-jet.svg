<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="500" fill="#fbf8f0"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="20" y="30" font-size="15" font-weight="600" fill="#25201a">core::rollCheck(cible, modificateurs, posture, générateur)</text>
  <text x="20" y="50" fill="#6a6152">Un jet de Perception, difficulté « moyenne », avec avantage — ce que CheckResult conserve</text>

  <!-- Étape 1 : la posture -->
  <rect x="20" y="70" width="250" height="150" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="92" font-weight="600" fill="#25201a">1. La posture (rollStance)</text>
  <text x="32" y="114" font-family="Consolas, monospace" font-size="12" fill="#25201a">sources d'avantage    : 2</text>
  <text x="32" y="132" font-family="Consolas, monospace" font-size="12" fill="#25201a">sources de désavantage : 0</text>
  <text x="32" y="158" fill="#3f6b34">→ Advantage : deux d20, le meilleur</text>
  <text x="32" y="180" font-size="12" fill="#6a6152">2 contre 1 donnerait Normal :</text>
  <text x="32" y="196" font-size="12" fill="#6a6152">la règle annule, elle ne compte pas</text>
  <text x="32" y="212" font-size="12" font-family="Consolas, monospace" fill="#6a6152">EX-REG-002</text>

  <!-- Étape 2 : les dés -->
  <rect x="300" y="70" width="250" height="150" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="312" y="92" font-weight="600" fill="#25201a">2. Les dés (tous conservés)</text>
  <g stroke="#25201a" stroke-width="1.5">
    <polygon points="350,150 372,118 394,150 372,182" fill="#fbf8f0"/>
    <polygon points="430,150 452,118 474,150 452,182" fill="#9a7420"/>
  </g>
  <text x="372" y="155" text-anchor="middle" font-size="16" font-weight="600" fill="#6a6152">7</text>
  <text x="452" y="155" text-anchor="middle" font-size="16" font-weight="600" fill="#fbf8f0">14</text>
  <text x="312" y="206" font-family="Consolas, monospace" font-size="12" fill="#25201a">dice = {7, 14}   keptDie = 14</text>

  <!-- Étape 3 : les modificateurs -->
  <rect x="580" y="70" width="280" height="150" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="592" y="92" font-weight="600" fill="#25201a">3. Les modificateurs, avec origine</text>
  <text x="592" y="116" font-family="Consolas, monospace" font-size="12" fill="#25201a">+1  « Sagesse »</text>
  <text x="592" y="134" font-family="Consolas, monospace" font-size="12" fill="#25201a">+2  « maîtrise »</text>
  <text x="592" y="160" font-size="12" fill="#6a6152">Chaque Modifier porte sa source :</text>
  <text x="592" y="176" font-size="12" fill="#6a6152">sans elle, le jet n'est pas restituable</text>
  <text x="592" y="200" font-size="12" font-family="Consolas, monospace" fill="#6a6152">EX-REG-003</text>

  <!-- Flèches vers le total -->
  <g stroke="#6a6152" stroke-width="1.5" fill="none">
    <path d="M145,220 L145,262 L300,262" marker-end="url(#fl)"/>
    <path d="M425,220 L425,262" marker-end="url(#fl)"/>
    <path d="M720,220 L720,262 L560,262" marker-end="url(#fl)"/>
  </g>

  <!-- Étape 4 : le total contre le seuil -->
  <rect x="300" y="264" width="260" height="96" rx="8" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="312" y="286" font-weight="600" fill="#25201a">4. Le total contre le seuil</text>
  <text x="312" y="312" font-family="Consolas, monospace" font-size="14" fill="#25201a">14 + 1 + 2 = 17</text>
  <text x="312" y="336" font-family="Consolas, monospace" font-size="14" fill="#25201a">17 >= 15 : réussite</text>

  <!-- Le seuil vient de la donnée -->
  <rect x="600" y="264" width="260" height="96" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="612" y="286" font-weight="600" fill="#25201a">Le seuil est une donnée</text>
  <text x="612" y="306" font-family="Consolas, monospace" font-size="12" fill="#25201a">rules/difficulty.json</text>
  <text x="612" y="324" font-family="Consolas, monospace" font-size="12" fill="#25201a">"moyenne" → dc: 15</text>
  <text x="612" y="346" font-size="12" fill="#6a6152">jamais un 15 nu dans un if (EX-REG-021)</text>
  <path d="M600,312 L562,312" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>

  <!-- Naturels -->
  <rect x="20" y="264" width="250" height="96" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="286" font-weight="600" fill="#25201a">Ce qui se lit sur le dé retenu</text>
  <text x="32" y="308" font-family="Consolas, monospace" font-size="12" fill="#25201a">isNaturalTwenty : keptDie == 20</text>
  <text x="32" y="326" font-family="Consolas, monospace" font-size="12" fill="#25201a">isNaturalOne    : keptDie == 1</text>
  <text x="32" y="348" font-size="12" fill="#8a2233">jamais sur le total : 8 + 12 n'est pas un 20</text>

  <!-- Restitution -->
  <rect x="20" y="384" width="840" height="96" rx="8" fill="#25201a"/>
  <text x="32" y="408" font-weight="600" fill="#ece4d1">CheckResult::describe()</text>
  <text x="32" y="434" font-family="Consolas, monospace" font-size="13" fill="#fbf8f0">d20 (avantage : 7, 14) = 14 + 1 (Sagesse) + 2 (maitrise) = 17 >= 15 : reussite</text>
  <text x="32" y="462" font-size="12" fill="#d6c9a8">« Vous échouez » n'apprend rien ; cette ligne se comprend, se discute et se diagnostique.</text>
</svg>
