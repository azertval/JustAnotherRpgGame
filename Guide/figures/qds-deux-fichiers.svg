<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="400" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>

  <!-- Le fichier de la conception -->
  <rect x="20" y="20" width="400" height="200" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="44" font-weight="600" fill="#25201a">À la conception : le formulaire</text>
  <text x="32" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Source/Ui/Screens/OptionsForm.ui.qml</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#25201a">
    <text x="32" y="92">ScreenPage {</text>
    <text x="32" y="110">  property int volume: 80        // exemple</text>
    <text x="32" y="128">  signal applyRequested()</text>
    <text x="32" y="146">  OrnateSlider { value: root.volume }</text>
    <text x="32" y="164">  OrnateButton { onClicked: root.applyRequested() }</text>
    <text x="32" y="182">}</text>
  </g>
  <text x="32" y="208" font-size="12" fill="#3f6b34">import QtQuick, QtQuick.Controls, Jadg.Ui — jamais Jadg.Runtime</text>

  <!-- Le jumeau -->
  <rect x="460" y="20" width="400" height="200" rx="8" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="472" y="44" font-weight="600" fill="#25201a">Au développement : le jumeau</text>
  <text x="472" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Source/App/Game/Qml/Screens/Options.qml</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#25201a">
    <text x="472" y="92">OptionsForm {</text>
    <text x="472" y="110">  volume: OptionsModel.volume</text>
    <text x="472" y="128">  onApplyRequested: {</text>
    <text x="472" y="146">    OptionsModel.volume = pendingVolume  // JS</text>
    <text x="472" y="164">  }</text>
    <text x="472" y="182">}</text>
  </g>
  <text x="472" y="208" font-size="12" fill="#3f6b34">import Jadg.Runtime : les types C++ (OptionsModel, ScreenRouter…)</text>

  <path d="M420,120 L458,120" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <text x="380" y="240" fill="#25201a">Le jumeau <tspan font-weight="600">instancie</tspan> le formulaire et lui donne ses valeurs ; le suffixe « Form »</text>
  <text x="380" y="258" fill="#25201a">distingue deux types qui, sinon, porteraient le même nom.</text>

  <!-- Ce que l'atelier perd -->
  <rect x="20" y="240" width="330" height="70" rx="8" fill="#fbf8f0" stroke="#8a2233"/>
  <text x="32" y="262" font-weight="600" fill="#8a2233">Ce que Design Studio détruit en silence</text>
  <text x="32" y="282" font-size="12" fill="#25201a">une fonction, un bloc de code, un gestionnaire impératif</text>
  <text x="32" y="300" font-size="12" fill="#25201a">écrit dans un Form — d'où la règle EX-IHM-103.</text>

  <!-- L'atelier -->
  <rect x="20" y="330" width="840" height="50" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="352" fill="#25201a">Qt Design Studio ouvre JadgUi.qmlproject : « . » résout Jadg.Ui, « Mocks » résout Jadg.Runtime par des doublures</text>
  <text x="32" y="370" fill="#25201a">(Source/Ui/Mocks/Jadg/Runtime/*.qml). Le jeu ne les voit jamais ; scripts/check_qml_designer_compat.py les tient alignées.</text>
  <path d="M660,220 L660,328" stroke="#8a2233" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#fr)"/>
  <text x="668" y="300" font-size="12" fill="#8a2233">ouvert dans l'atelier</text>
  <text x="668" y="316" font-size="12" fill="#8a2233">grâce aux doublures</text>
</svg>
