<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="560" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6b34"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#25201a">D'une donnée à son image : la clé d'asset ne connaît aucun chemin</text>

  <!-- 1. la donnée -->
  <rect x="20" y="56" width="250" height="112" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="34" y="78" font-weight="600" fill="#25201a">1. La donnée</text>
  <text x="34" y="98" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Rpg/creatures/wolf.json</text>
  <text x="34" y="118" font-family="Consolas, monospace" font-size="12" fill="#25201a">"id": "wolf"</text>
  <text x="34" y="138" font-family="Consolas, monospace" font-size="12" fill="#6a6152">"asset": absent (ou dérogation)</text>
  <text x="34" y="158" font-size="12" fill="#6a6152">jamais un chemin (EX-CNT-040)</text>

  <!-- 2. la table des familles -->
  <rect x="315" y="56" width="250" height="112" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="329" y="78" font-weight="600" fill="#25201a">2. La table des familles</text>
  <text x="329" y="98" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Assets/Entities/families.json</text>
  <text x="329" y="118" font-family="Consolas, monospace" font-size="12" fill="#25201a">beast : 96 × 96</text>
  <text x="329" y="138" font-family="Consolas, monospace" font-size="12" fill="#25201a">catalogues : ["creatures"]</text>
  <text x="329" y="158" font-size="12" fill="#6a6152">core::loadAssetFamilies</text>

  <!-- 3. la clé -->
  <rect x="610" y="56" width="250" height="112" rx="8" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="624" y="78" font-weight="600" fill="#25201a">3. La clé, déduite</text>
  <text x="624" y="98" font-size="12" fill="#6a6152">core::defaultAssetKeyFor</text>
  <text x="624" y="122" font-family="Consolas, monospace" font-size="14" fill="#9a7420" font-weight="600">beast/wolf</text>
  <text x="624" y="142" font-size="12" fill="#6a6152">core::isValidAssetKey : deux</text>
  <text x="624" y="158" font-size="12" fill="#6a6152">segments, minuscules, tirets simples</text>

  <line x1="270" y1="112" x2="313" y2="112" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="565" y1="112" x2="608" y2="112" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- 4. le fichier existe ? -->
  <path d="M735,168 L735,206" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="560" y="208" width="300" height="70" rx="8" fill="#fbf8f0" stroke="#25201a"/>
  <text x="574" y="230" font-weight="600" fill="#25201a">4. Une image porte-t-elle cette clé ?</text>
  <text x="574" y="250" font-family="Consolas, monospace" font-size="12" fill="#25201a">Assets/Entities/beast/wolf.png</text>
  <text x="574" y="268" font-size="12" fill="#6a6152">aux dimensions que la famille attend</text>

  <!-- oui -->
  <path d="M640,278 L640,330" stroke="#3f6b34" stroke-width="1.5" marker-end="url(#fv)"/>
  <text x="600" y="308" font-size="12" fill="#3f6b34">oui</text>
  <rect x="470" y="332" width="200" height="86" rx="8" fill="#fbf8f0" stroke="#3f6b34" stroke-width="1.5"/>
  <text x="484" y="354" font-weight="600" fill="#3f6b34">L'illustration</text>
  <text x="484" y="374" font-size="12" fill="#25201a">décodée et envoyée au GPU</text>
  <text x="484" y="392" font-size="12" fill="#25201a">par hmi::TextureLoader</text>
  <text x="484" y="410" font-size="12" fill="#6a6152">(HMI, jamais Core)</text>

  <!-- non -->
  <path d="M800,278 L800,330" stroke="#8a2233" stroke-width="1.5" marker-end="url(#fr)"/>
  <text x="808" y="308" font-size="12" fill="#8a2233">non</text>
  <rect x="690" y="332" width="176" height="86" rx="8" fill="#fbf8f0" stroke="#8a2233" stroke-width="1.5"/>
  <text x="704" y="354" font-weight="600" fill="#8a2233">Le marqueur</text>
  <text x="704" y="374" font-size="12" fill="#25201a">core::assetMarker</text>
  <text x="704" y="392" font-size="12" fill="#25201a">teinte = FNV-1a(clé) % 360</text>
  <text x="704" y="410" font-size="12" fill="#25201a">deux diagonales</text>

  <!-- vignette du marqueur -->
  <g transform="translate(700,430)">
    <rect x="0" y="0" width="56" height="56" fill="#ece4d1" stroke="#25201a"/>
    <path d="M0,0 L56,56 M56,0 L0,56" stroke="#9a7420" stroke-width="4"/>
  </g>
  <text x="768" y="452" font-size="12" fill="#6a6152">la même clé donne</text>
  <text x="768" y="468" font-size="12" fill="#6a6152">toujours le même</text>
  <text x="768" y="484" font-size="12" fill="#6a6152">marqueur (EX-CNT-041)</text>

  <!-- vers l'écran -->
  <path d="M570,418 L570,470 L620,470" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <rect x="622" y="446" width="60" height="48" rx="6" fill="#25201a"/>
  <text x="652" y="475" font-size="12" fill="#fbf8f0" text-anchor="middle">écran</text>
  <path d="M700,458 L684,458" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- le contrôle en CI -->
  <rect x="20" y="208" width="420" height="210" rx="8" fill="none" stroke="#3f6b34" stroke-dasharray="6 4"/>
  <text x="34" y="230" font-weight="600" fill="#3f6b34">Le manifeste est dérivé, jamais tenu à la main</text>
  <text x="34" y="254" font-size="12" fill="#25201a">core::expectedAssetKeys balaie les dossiers de catalogue que</text>
  <text x="34" y="272" font-size="12" fill="#25201a">la table nomme et rend une clé par entrée (ExpectedAssetKey).</text>
  <text x="34" y="300" font-size="12" fill="#25201a">scripts/check_asset_keys.py, en CI, sur la même règle :</text>
  <text x="48" y="322" font-size="12" fill="#8a2233">échoue — dérogation malformée, famille inconnue,</text>
  <text x="48" y="338" font-size="12" fill="#8a2233">image livrée qu'aucune donnée n'attend ;</text>
  <text x="48" y="362" font-size="12" fill="#3f6b34">liste sans échouer — les clés encore servies par</text>
  <text x="48" y="378" font-size="12" fill="#3f6b34">un marqueur : un état d'avancement, pas un défaut.</text>
  <text x="34" y="404" font-size="12" fill="#6a6152">Une clé malformée ne reçoit aucun marqueur : c'est une faute de donnée.</text>

  <text x="20" y="470" font-size="12" fill="#6a6152">Déplacer Assets/Entities/ ne casse aucune créature : seule la résolution (étape 4) connaît le disque.</text>
  <text x="20" y="490" font-size="12" fill="#6a6152">Le champ « asset » d'une donnée sert à déroger (deux entrées, une image), pas à répéter la clé déduite.</text>
  <text x="20" y="530" font-size="12" fill="#6a6152">Source : Source/Core/Resources/AssetKey.h, AssetMarker.h ; Source/HMI/Graphics/TextureCache.cpp (LOT-39).</text>
</svg>
