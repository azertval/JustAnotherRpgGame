<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, serif" font-size="13">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#fbf8f0"/>
  <text x="20" y="34" font-size="19" font-weight="600" fill="#25201a">Le circuit d'une Pull Request</text>

  <!-- 1. Le commit -->
  <g>
    <rect x="20" y="60" width="196" height="150" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="118" y="84" font-weight="600" fill="#25201a" text-anchor="middle">1. git commit</text>
    <text x="32" y="110" fill="#25201a">hooks pre-commit :</text>
    <text x="32" y="128" fill="#6a6152">clang-format, ruff, actionlint,</text>
    <text x="32" y="146" fill="#6a6152">zizmor, gitleaks, JSON, binaires</text>
    <text x="32" y="170" fill="#25201a">hook commit-msg :</text>
    <text x="32" y="188" fill="#6a6152">type(portée): … ou LOT-NN —</text>
  </g>
  <line x1="216" y1="135" x2="240" y2="135" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="228" y="126" fill="#6a6152" text-anchor="middle" font-size="13">push</text>

  <!-- 2. La PR -->
  <g>
    <rect x="244" y="60" width="236" height="150" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
    <text x="362" y="84" font-weight="600" fill="#25201a" text-anchor="middle">2. PR ouverte vers main</text>
    <text x="256" y="110" fill="#25201a" font-family="Consolas, monospace">ci.yml</text>
    <text x="322" y="110" fill="#6a6152">contrôle requis, 10 jobs</text>
    <text x="256" y="132" fill="#25201a" font-family="Consolas, monospace">changelog.yml</text>
    <text x="376" y="132" fill="#6a6152">[Non publié]</text>
    <text x="256" y="154" fill="#25201a" font-family="Consolas, monospace">codeql.yml</text>
    <text x="352" y="154" fill="#6a6152">informatif</text>
    <text x="256" y="180" fill="#6a6152">un push de plus annule le run en</text>
    <text x="256" y="198" fill="#6a6152">cours et le label no-changelog exempte</text>
  </g>
  <line x1="480" y1="135" x2="504" y2="135" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- 3. La lecture -->
  <g>
    <rect x="508" y="60" width="196" height="150" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="606" y="84" font-weight="600" fill="#25201a" text-anchor="middle">3. Ce que la PR montre</text>
    <text x="520" y="110" fill="#25201a">commentaire test-report</text>
    <text x="520" y="128" fill="#6a6152">(JUnit des 3 builds + pytest)</text>
    <text x="520" y="150" fill="#25201a">annotations sur le diff</text>
    <text x="520" y="168" fill="#6a6152">(MSVC, gtest, tidy, format)</text>
    <text x="520" y="190" fill="#25201a">résumé par job, Codecov</text>
  </g>
  <line x1="704" y1="135" x2="728" y2="135" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- 4. La fusion -->
  <g>
    <rect x="732" y="60" width="128" height="150" rx="6" fill="#fbf8f0" stroke="#3f6b34" stroke-width="1.5"/>
    <text x="796" y="84" font-weight="600" fill="#3f6b34" text-anchor="middle">4. Fusion</text>
    <text x="796" y="110" fill="#25201a" text-anchor="middle">tout est vert</text>
    <text x="796" y="130" fill="#25201a" text-anchor="middle">et relu</text>
    <text x="796" y="156" fill="#6a6152" text-anchor="middle">un seul commit</text>
    <text x="796" y="174" fill="#6a6152" text-anchor="middle">arrive sur main</text>
  </g>

  <!-- Retour rouge -->
  <path d="M362 210 L362 240 L118 240 L118 214" stroke="#8a2233" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
  <text x="240" y="234" fill="#8a2233" text-anchor="middle">un job rouge : corriger sur le poste, pousser à nouveau</text>

  <!-- Sur main -->
  <path d="M796 210 L796 268" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <text x="20" y="286" font-weight="600" fill="#25201a">5. Ce que déclenche l'arrivée sur main</text>

  <g>
    <rect x="20" y="300" width="270" height="118" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="32" y="324" font-weight="600" fill="#25201a" font-family="Consolas, monospace">release.yml · rolling-debug</text>
    <text x="32" y="348" fill="#25201a">build Debug, package, test de fumée,</text>
    <text x="32" y="366" fill="#25201a">attestation, tag debug-latest déplacé</text>
    <text x="32" y="384" fill="#25201a">par l'API, fichiers remplacés un à un</text>
    <text x="32" y="406" fill="#6a6152">échec : la version précédente reste</text>
  </g>
  <g>
    <rect x="304" y="300" width="270" height="118" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="316" y="324" font-weight="600" fill="#25201a" font-family="Consolas, monospace">docs.yml · doxygen, coverage</text>
    <text x="316" y="348" fill="#25201a">puis publish : pages, référence,</text>
    <text x="316" y="366" fill="#25201a">planification, qualité assemblées,</text>
    <text x="316" y="384" fill="#25201a">gh-pages remplacée en entier</text>
    <text x="316" y="406" fill="#6a6152">rien ne s'édite sur gh-pages</text>
  </g>
  <g>
    <rect x="588" y="300" width="272" height="118" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="600" y="324" font-weight="600" fill="#25201a" font-family="Consolas, monospace">codeql.yml · push sur main</text>
    <text x="600" y="348" fill="#25201a">la référence contre laquelle chaque</text>
    <text x="600" y="366" fill="#25201a">PR suivante est comparée</text>
    <text x="600" y="390" fill="#6a6152">et, la nuit venue, nightly.yml sur</text>
    <text x="600" y="408" fill="#6a6152">ce même commit</text>
  </g>

  <rect x="20" y="440" width="840" height="58" rx="6" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="34" y="464" fill="#25201a">Un tag vX.Y.Z posé sur le commit de fusion ajoute test-tag (Debug et Release testés sur ce commit exact),</text>
  <text x="34" y="484" fill="#25201a">puis versioned-release : deux archives, deux zips de symboles, SHA256SUMS et les notes du CHANGELOG.</text>
</svg>
