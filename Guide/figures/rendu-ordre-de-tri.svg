<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Georgia, serif" font-size="14">
  <rect width="880" height="500" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#25201a">L'ordre de dessin d'une scène composée : la clé de ComposedScene::sort</text>

  <!-- Bandes de calques -->
  <text x="20" y="66" font-weight="600" fill="#6a6152">1. La bande de calque (renderBand)</text>
  <g stroke="#d6c9a8">
    <rect x="20" y="80" width="110" height="44" fill="#ece4d1"/>
    <rect x="130" y="80" width="110" height="44" fill="#ece4d1"/>
    <rect x="240" y="80" width="110" height="44" fill="#ece4d1"/>
    <rect x="350" y="80" width="220" height="44" fill="#fbf8f0" stroke="#9a7420" stroke-width="2"/>
    <rect x="570" y="80" width="110" height="44" fill="#ece4d1"/>
    <rect x="680" y="80" width="180" height="44" fill="#ece4d1"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13" fill="#25201a" text-anchor="middle">
    <text x="75" y="106">Background</text>
    <text x="185" y="106">Shadow</text>
    <text x="295" y="106">Tile</text>
    <text x="405" y="106">Object</text>
    <text x="515" y="106">Player</text>
    <text x="625" y="106">UI</text>
    <text x="770" y="106">EditorOverlay</text>
  </g>
  <text x="350" y="142" font-size="13" fill="#9a7420">une seule bande de profondeur (sortsByDepth)</text>
  <path d="M20,150 L860,150" stroke="#6a6152" stroke-width="1" marker-end="url(#f)"/>
  <text x="20" y="168" font-size="13" fill="#6a6152">dessiné en premier (au fond)</text>
  <text x="700" y="168" font-size="13" fill="#6a6152" text-anchor="end">dessiné en dernier (devant)</text>

  <!-- Deux règles -->
  <text x="20" y="206" font-weight="600" fill="#6a6152">2. À l'intérieur d'une bande</text>
  <rect x="20" y="220" width="400" height="120" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="242" font-weight="600" fill="#25201a">Calques ordinaires (Tile, UI…)</text>
  <text x="32" y="266" font-size="13" fill="#25201a">a. rang de première apparition de la texture</text>
  <text x="32" y="284" font-size="13" fill="#25201a">b. sortOrder (tri fin)</text>
  <text x="32" y="310" font-size="13" fill="#6a6152">Regrouper d'abord : une passe begin/end</text>
  <text x="32" y="328" font-size="13" fill="#6a6152">par texture, le minimum d'appels de dessin.</text>

  <rect x="460" y="220" width="400" height="120" rx="8" fill="#fbf8f0" stroke="#9a7420" stroke-width="2"/>
  <text x="472" y="242" font-weight="600" fill="#25201a">Bande de profondeur (Object + Player)</text>
  <text x="472" y="266" font-size="13" fill="#25201a">a. sortOrder = profondeur du pied × rangs + rang</text>
  <text x="472" y="284" font-size="13" fill="#25201a">b. rang de première apparition de la texture</text>
  <text x="472" y="310" font-size="13" fill="#6a6152">La position tranche avant la texture : un mur</text>
  <text x="472" y="328" font-size="13" fill="#6a6152">plus bas à l'écran passe devant la figurine.</text>

  <!-- Exemple visuel -->
  <text x="20" y="378" font-weight="600" fill="#6a6152">3. Le pied décide, pas le coin haut</text>
  <!-- mur haut (fond) -->
  <rect x="60" y="400" width="60" height="80" fill="#6a6152"/>
  <text x="60" y="496" font-size="12" fill="#6a6152">mur, pied y = 480</text>
  <!-- figurine -->
  <circle cx="150" cy="430" r="12" fill="#9a7420"/>
  <rect x="140" y="442" width="20" height="30" fill="#9a7420"/>
  <text x="130" y="496" font-size="12" fill="#9a7420">héros, pied y = 472</text>
  <!-- mur bas (devant) -->
  <rect x="180" y="420" width="60" height="70" fill="#25201a"/>
  <text x="240" y="496" font-size="12" fill="#25201a" text-anchor="end">mur, pied y = 490</text>

  <text x="300" y="404" font-size="13" fill="#25201a">depthSortOrder lit le bord bas de chaque quad, pas son coin haut.</text>
  <text x="300" y="424" font-size="13" fill="#25201a">Ordre de dessin, par pied croissant : héros (472), puis mur (480),</text>
  <text x="300" y="442" font-size="13" fill="#25201a">puis mur (490). Un mur dont le pied est plus bas que celui du héros</text>
  <text x="300" y="460" font-size="13" fill="#25201a">est dessiné après lui, donc devant, quelle que soit sa hauteur.</text>
  <text x="300" y="484" font-size="13" fill="#6a6152">Quantifié au pixel (DEPTH_SUBDIVISIONS_PER_UNIT) : pas de scintillement à égalité.</text>
</svg>
