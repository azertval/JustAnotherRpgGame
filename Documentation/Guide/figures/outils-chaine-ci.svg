<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="Georgia, serif" font-size="13">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#fbf8f0"/>
  <text x="20" y="34" font-size="19" font-weight="600" fill="#25201a">De la poussée à la publication</text>
  <text x="20" y="56" fill="#6a6152">Ce qui bloque une fusion est à gauche du trait d'or ; ce qui publie ou surveille est à droite.</text>

  <!-- Poste -->
  <rect x="20" y="86" width="190" height="150" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="115" y="110" font-weight="600" fill="#25201a" text-anchor="middle">Le poste</text>
  <text x="32" y="136" fill="#25201a">hooks pre-commit</text>
  <text x="32" y="156" fill="#25201a">hook commit-msg</text>
  <text x="32" y="176" fill="#25201a" font-family="Consolas, monospace">uv run scripts/check.py</text>
  <text x="32" y="196" fill="#25201a" font-family="Consolas, monospace">scripts/build.ps1 -Test</text>
  <text x="32" y="222" fill="#6a6152">mêmes versions que ci.yml</text>

  <line x1="210" y1="160" x2="238" y2="160" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- Les robots -->
  <rect x="20" y="262" width="190" height="126" rx="6" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="115" y="286" font-weight="600" fill="#25201a" text-anchor="middle">Les robots</text>
  <text x="32" y="312" fill="#25201a">Dependabot : actions,</text>
  <text x="32" y="330" fill="#25201a">uv.lock</text>
  <text x="32" y="352" fill="#25201a">Renovate : GIT_TAG de</text>
  <text x="32" y="370" fill="#25201a">FetchContent</text>
  <line x1="210" y1="326" x2="238" y2="326" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="32" y="410" fill="#6a6152">ouvrent des PR le lundi</text>

  <!-- PR -->
  <rect x="240" y="86" width="330" height="500" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="405" y="110" font-weight="600" fill="#25201a" text-anchor="middle">Pull Request vers main</text>

  <text x="254" y="138" font-weight="600" fill="#9a7420">ci.yml, le contrôle requis</text>
  <g fill="#25201a" font-family="Consolas, monospace">
    <text x="254" y="162">build-test-coverage</text>
    <text x="254" y="184">build-test-release</text>
    <text x="254" y="206">build-ninja</text>
    <text x="254" y="228">sanitize</text>
    <text x="254" y="250">clang-tidy</text>
    <text x="254" y="272">format</text>
    <text x="254" y="294">lint-exigences</text>
    <text x="254" y="316">pre-commit</text>
    <text x="254" y="338">docs</text>
    <text x="254" y="360">test-report</text>
  </g>
  <g fill="#6a6152">
    <text x="418" y="162">Debug, seuil 85 %</text>
    <text x="418" y="184">Release, NDEBUG</text>
    <text x="418" y="206">qmllint, .ts, cartes</text>
    <text x="418" y="228">ASan, trois suites</text>
    <text x="418" y="250">diff, bugprone-*</text>
    <text x="418" y="272">clang-format</text>
    <text x="418" y="294">lints et pytest</text>
    <text x="418" y="316">hooks, tout le dépôt</text>
    <text x="418" y="338">Doxygen, pages</text>
    <text x="418" y="360">JUnit en commentaire</text>
  </g>

  <line x1="254" y1="380" x2="556" y2="380" stroke="#d6c9a8"/>
  <text x="254" y="406" font-weight="600" fill="#8a2233">changelog.yml</text>
  <text x="418" y="406" fill="#6a6152">une ligne [Non publié]</text>
  <text x="254" y="432" font-weight="600" fill="#2f7f86">codeql.yml</text>
  <text x="418" y="432" fill="#6a6152">C++, Python, workflows</text>
  <text x="254" y="452" fill="#6a6152">(informatif : alertes dans Code scanning)</text>

  <rect x="254" y="470" width="302" height="100" rx="4" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="266" y="494" fill="#25201a">Annotations sur la ligne du diff :</text>
  <text x="266" y="514" fill="#25201a">MSVC, GoogleTest, clang-format,</text>
  <text x="266" y="534" fill="#25201a">clang-tidy (SARIF), Codecov.</text>
  <text x="266" y="558" fill="#6a6152">Un nouveau push annule le run précédent.</text>

  <!-- trait d'or -->
  <line x1="600" y1="76" x2="600" y2="660" stroke="#9a7420" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="606" y="656" fill="#9a7420">fusion dans main</text>
  <line x1="570" y1="330" x2="626" y2="330" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- main -->
  <rect x="628" y="86" width="232" height="176" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="640" y="110" font-weight="600" fill="#25201a">release.yml</text>
  <text x="640" y="134" fill="#25201a">push sur main : rolling-debug,</text>
  <text x="640" y="152" fill="#25201a">release roulante debug-latest</text>
  <text x="640" y="176" fill="#25201a">tag vX.Y.Z : test-tag, puis</text>
  <text x="640" y="194" fill="#25201a">versioned-release</text>
  <text x="640" y="218" fill="#6a6152">archives, symboles, SHA256SUMS,</text>
  <text x="640" y="236" fill="#6a6152">test de fumée, attestation, notes</text>
  <text x="640" y="254" fill="#6a6152">tirées du CHANGELOG</text>

  <rect x="628" y="282" width="232" height="146" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="640" y="306" font-weight="600" fill="#25201a">docs.yml</text>
  <text x="640" y="330" fill="#25201a">doxygen + coverage, puis publish</text>
  <text x="640" y="348" fill="#25201a">sur la branche gh-pages</text>
  <text x="640" y="372" fill="#6a6152">/ pages · /reference/ code</text>
  <text x="640" y="390" fill="#6a6152">/planning/ · /qualite/ couverture</text>
  <text x="640" y="408" fill="#6a6152">de main et mesures de la nuit</text>
  <text x="640" y="424" fill="#6a6152">rejoué à 05 h 17 UTC</text>

  <rect x="628" y="448" width="232" height="164" rx="6" fill="#fbf8f0" stroke="#3f6b34" stroke-width="1.5"/>
  <text x="640" y="472" font-weight="600" fill="#3f6b34">nightly.yml, 02 h 17 UTC</text>
  <text x="640" y="490" fill="#3f6b34">non bloquant</text>
  <text x="640" y="516" fill="#25201a" font-family="Consolas, monospace">tidy-full  shuffle  fuzz</text>
  <text x="640" y="536" fill="#25201a" font-family="Consolas, monospace">msvc-analyze  cppcheck</text>
  <text x="640" y="556" fill="#25201a" font-family="Consolas, monospace">benchmarks  smoke</text>
  <text x="640" y="576" fill="#25201a" font-family="Consolas, monospace">qt-next  links</text>
  <text x="640" y="600" fill="#6a6152">analyses : Code scanning ;</text>
  <path d="M744 448 L744 430" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
  <text x="752" y="442" fill="#6a6152" font-size="13">mesures</text>

  <text x="20" y="680" fill="#6a6152">Tous les workflows se relancent à la main (workflow_dispatch) ; toutes les actions sont épinglées</text>
  <text x="20" y="700" fill="#6a6152">par SHA de commit ; toutes les versions d'outils sont écrites une fois, dans le bloc env: de ci.yml.</text>
</svg>
