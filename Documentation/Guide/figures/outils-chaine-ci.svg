<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="#fbf8f0"/>
  <text x="30" y="36" font-size="20" font-weight="600" fill="#25201a">De la poussée à la publication</text>
  <text x="30" y="58" font-size="13" fill="#6a6152">Ce qui bloque une fusion est à gauche du trait d'or ; ce qui publie ou surveille est à droite.</text>

  <!-- Poste -->
  <rect x="30" y="90" width="200" height="150" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="130" y="114" font-size="14" font-weight="600" fill="#25201a" text-anchor="middle">Le poste</text>
  <text x="44" y="140" font-size="12" fill="#25201a">hooks pre-commit</text>
  <text x="44" y="160" font-size="12" fill="#25201a">hook commit-msg</text>
  <text x="44" y="180" font-size="12" fill="#25201a" font-family="Consolas, monospace">uv run scripts/check.py</text>
  <text x="44" y="200" font-size="12" fill="#25201a" font-family="Consolas, monospace">scripts/build.ps1 -Test</text>
  <text x="44" y="224" font-size="12" fill="#6a6152">mêmes versions que ci.yml</text>

  <line x1="230" y1="165" x2="268" y2="165" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- PR -->
  <rect x="270" y="90" width="330" height="440" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="435" y="114" font-size="14" font-weight="600" fill="#25201a" text-anchor="middle">Pull Request vers main</text>

  <text x="284" y="140" font-size="12" font-weight="600" fill="#9a7420">ci.yml — contrôle requis</text>
  <g font-size="12" fill="#25201a" font-family="Consolas, monospace">
    <text x="284" y="162">build-test-coverage</text>
    <text x="284" y="182">build-test-release</text>
    <text x="284" y="202">build-ninja</text>
    <text x="284" y="222">sanitize</text>
    <text x="284" y="242">clang-tidy</text>
    <text x="284" y="262">format</text>
    <text x="284" y="282">lint-exigences</text>
    <text x="284" y="302">pre-commit</text>
    <text x="284" y="322">docs</text>
    <text x="284" y="342">test-report</text>
  </g>
  <g font-size="12" fill="#6a6152">
    <text x="440" y="162">Debug, seuil 85 %</text>
    <text x="440" y="182">Release, NDEBUG</text>
    <text x="440" y="202">qmllint, .ts, cartes</text>
    <text x="440" y="222">ASan, trois suites</text>
    <text x="440" y="242">diff, bugprone-*</text>
    <text x="440" y="262">clang-format 20.1.8</text>
    <text x="440" y="282">lints + pytest</text>
    <text x="440" y="302">hooks, tout le dépôt</text>
    <text x="440" y="322">Doxygen sans alerte</text>
    <text x="440" y="342">JUnit en commentaire</text>
  </g>

  <line x1="284" y1="362" x2="586" y2="362" stroke="#d6c9a8"/>
  <text x="284" y="386" font-size="12" font-weight="600" fill="#8a2233">changelog.yml</text>
  <text x="440" y="386" font-size="12" fill="#6a6152">une ligne sous [Non publié]</text>
  <text x="284" y="412" font-size="12" font-weight="600" fill="#2f7f86">codeql.yml</text>
  <text x="440" y="412" font-size="12" fill="#6a6152">C++, Python, workflows</text>
  <text x="284" y="432" font-size="12" fill="#6a6152">(informatif : alertes dans Code scanning)</text>

  <rect x="284" y="452" width="302" height="62" rx="4" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="296" y="474" font-size="12" fill="#25201a">Annotations sur la ligne : MSVC, GoogleTest,</text>
  <text x="296" y="492" font-size="12" fill="#25201a">clang-format, clang-tidy (SARIF), Codecov.</text>
  <text x="296" y="508" font-size="12" fill="#6a6152">Un nouveau push annule le run précédent.</text>

  <!-- trait d'or -->
  <line x1="640" y1="80" x2="640" y2="610" stroke="#9a7420" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="646" y="604" font-size="12" fill="#9a7420">fusion dans main</text>
  <line x1="600" y1="310" x2="676" y2="310" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <!-- main -->
  <rect x="680" y="90" width="390" height="130" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="694" y="114" font-size="14" font-weight="600" fill="#25201a">release.yml</text>
  <text x="694" y="138" font-size="12" fill="#25201a">push sur main → rolling-debug → release debug-latest</text>
  <text x="694" y="158" font-size="12" fill="#25201a">tag vX.Y.Z → test-tag → versioned-release</text>
  <text x="694" y="182" font-size="12" fill="#6a6152">archive + symboles + SHA256SUMS, test de fumée,</text>
  <text x="694" y="200" font-size="12" fill="#6a6152">attestation de provenance, notes tirées du CHANGELOG</text>

  <rect x="680" y="240" width="390" height="130" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="694" y="264" font-size="14" font-weight="600" fill="#25201a">docs.yml</text>
  <text x="694" y="288" font-size="12" fill="#25201a">doxygen + coverage → publish → branche gh-pages</text>
  <text x="694" y="312" font-size="12" fill="#6a6152">/  pages   ·   /reference/  code   ·   /planning/</text>
  <text x="694" y="330" font-size="12" fill="#6a6152">/qualite/  couverture de main et mesures de la nuit</text>
  <text x="694" y="354" font-size="12" fill="#6a6152">rejoué à 05 h 17 UTC pour reprendre les mesures</text>

  <rect x="680" y="390" width="390" height="140" rx="6" fill="#fbf8f0" stroke="#3f6b34" stroke-width="1.5"/>
  <text x="694" y="414" font-size="14" font-weight="600" fill="#3f6b34">nightly.yml — 02 h 17 UTC, non bloquant</text>
  <text x="694" y="438" font-size="12" fill="#25201a" font-family="Consolas, monospace">tidy-full  shuffle  msvc-analyze  cppcheck</text>
  <text x="694" y="458" font-size="12" fill="#25201a" font-family="Consolas, monospace">fuzz  benchmarks  smoke  qt-next  links</text>
  <text x="694" y="484" font-size="12" fill="#6a6152">analyses → Security &gt; Code scanning</text>
  <text x="694" y="502" font-size="12" fill="#6a6152">mesures → branche benchmarks → page qualité</text>

  <path d="M875 390 L875 372" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>

  <!-- robots -->
  <rect x="30" y="270" width="200" height="120" rx="6" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="130" y="294" font-size="14" font-weight="600" fill="#25201a" text-anchor="middle">Les robots</text>
  <text x="44" y="318" font-size="12" fill="#25201a">Dependabot : actions, uv.lock</text>
  <text x="44" y="338" font-size="12" fill="#25201a">Renovate : GIT_TAG de</text>
  <text x="44" y="356" font-size="12" fill="#25201a">FetchContent</text>
  <text x="44" y="378" font-size="12" fill="#6a6152">ouvrent des PR, le lundi</text>
  <line x1="230" y1="330" x2="268" y2="330" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>

  <text x="30" y="570" font-size="12" fill="#6a6152">Tous les workflows se relancent à la main (workflow_dispatch) ; toutes les actions sont épinglées</text>
  <text x="30" y="588" font-size="12" fill="#6a6152">par SHA de commit ; toutes les versions d'outils sont écrites une fois, dans le bloc env: de ci.yml.</text>
</svg>
