<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Georgia, serif" font-size="13">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fbf8f0"/>
  <text x="20" y="34" font-size="19" font-weight="600" fill="#25201a">Les suites de tests, et ce qu'elles engendrent</text>

  <!-- Les cinq exécutables -->
  <g>
    <rect x="20" y="60" width="160" height="96" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="100" y="84" font-weight="600" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">UnitTests</text>
    <text x="100" y="106" fill="#25201a" text-anchor="middle">Core, HmiLib, EditorLogic</text>
    <text x="100" y="126" fill="#25201a" text-anchor="middle">+ rendu hors écran si Qt</text>
    <text x="100" y="146" fill="#6a6152" text-anchor="middle">label unitaire · 300 s</text>
  </g>
  <g>
    <rect x="192" y="60" width="160" height="96" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="272" y="84" font-weight="600" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">RuntimeTests</text>
    <text x="272" y="106" fill="#25201a" text-anchor="middle">vues-modèles Qt Quick</text>
    <text x="272" y="126" fill="#25201a" text-anchor="middle">si JadgRuntime existe</text>
    <text x="272" y="146" fill="#6a6152" text-anchor="middle">label unitaire · 300 s</text>
  </g>
  <g>
    <rect x="364" y="60" width="160" height="96" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="444" y="84" font-weight="600" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">QmlTests</text>
    <text x="444" y="106" fill="#25201a" text-anchor="middle">tst_*.qml, rendu logiciel</text>
    <text x="444" y="126" fill="#25201a" text-anchor="middle">références PNG des écrans</text>
    <text x="444" y="146" fill="#6a6152" text-anchor="middle">label unitaire · offscreen</text>
  </g>
  <g>
    <rect x="536" y="60" width="160" height="96" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="616" y="84" font-weight="600" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">IntegrationTests</text>
    <text x="616" y="106" fill="#25201a" text-anchor="middle">carte, puis scène,</text>
    <text x="616" y="126" fill="#25201a" text-anchor="middle">bout en bout</text>
    <text x="616" y="146" fill="#6a6152" text-anchor="middle">label integration · 300 s</text>
  </g>
  <g>
    <rect x="708" y="60" width="152" height="96" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="784" y="84" font-weight="600" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">SystemTests</text>
    <text x="784" y="106" fill="#25201a" text-anchor="middle">un parcours complet</text>
    <text x="784" y="126" fill="#25201a" text-anchor="middle">sur la racine d'essai</text>
    <text x="784" y="146" fill="#6a6152" text-anchor="middle">label systeme · 900 s</text>
  </g>

  <!-- Bandeau ctest -->
  <rect x="20" y="176" width="840" height="46" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="34" y="196" fill="#25201a">CTest découvre chaque TEST() au moment du ctest (PRE_TEST), un processus par test, un label par étage :</text>
  <text x="34" y="214" fill="#25201a" font-family="Consolas, monospace">ctest --preset ninja -L unitaire        ctest --preset ninja -R AttackTest        --output-junit rapport.xml</text>

  <!-- Deux chaînes dérivées -->
  <text x="20" y="262" font-weight="600" fill="#25201a">Le cahier de test : du commentaire au site</text>
  <g>
    <rect x="20" y="276" width="190" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="115" y="298" fill="#25201a" text-anchor="middle">Au-dessus de chaque test</text>
    <text x="115" y="320" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">\castest{ ... }</text>
    <text x="115" y="340" fill="#6a6152" text-anchor="middle">objet, criticité, étapes,</text>
    <text x="115" y="356" fill="#6a6152" text-anchor="middle">résultat attendu</text>
  </g>
  <line x1="210" y1="319" x2="236" y2="319" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="238" y="276" width="200" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="338" y="298" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">generate_cahier_test.py</text>
    <text x="338" y="320" fill="#25201a" text-anchor="middle">collecte et range par domaine</text>
    <text x="338" y="340" fill="#8a2233" text-anchor="middle">refuse un test sans bloc</text>
    <text x="338" y="356" fill="#6a6152" text-anchor="middle">--check en CI : cahier à jour</text>
  </g>
  <line x1="438" y1="319" x2="464" y2="319" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="466" y="276" width="180" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="556" y="298" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">CahierTest/*.md</text>
    <text x="556" y="320" fill="#25201a" text-anchor="middle">une page par domaine,</text>
    <text x="556" y="340" fill="#25201a" text-anchor="middle">un cas par fiche</text>
    <text x="556" y="356" fill="#6a6152" text-anchor="middle">versionné, jamais édité</text>
  </g>
  <line x1="646" y1="319" x2="672" y2="319" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="674" y="276" width="186" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="767" y="298" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">build_docs_site.py</text>
    <text x="767" y="320" fill="#25201a" text-anchor="middle">le site : filtre par texte</text>
    <text x="767" y="340" fill="#25201a" text-anchor="middle">et par criticité</text>
    <text x="767" y="356" fill="#6a6152" text-anchor="middle">publié par docs.yml</text>
  </g>

  <text x="20" y="404" font-weight="600" fill="#25201a">La couverture : des trois suites au seuil et au site qualité</text>
  <g>
    <rect x="20" y="418" width="230" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="135" y="440" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">scripts/coverage.ps1</text>
    <text x="135" y="462" fill="#25201a" text-anchor="middle">OpenCppCoverage, un passage</text>
    <text x="135" y="482" fill="#25201a" text-anchor="middle">par suite, puis fusion</text>
    <text x="135" y="498" fill="#6a6152" text-anchor="middle">Source/, hors Test et External</text>
  </g>
  <line x1="250" y1="461" x2="276" y2="461" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="278" y="418" width="180" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="368" y="440" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">coverage.xml</text>
    <text x="368" y="462" fill="#25201a" text-anchor="middle">Cobertura</text>
    <text x="368" y="482" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">coverage-html/</text>
    <text x="368" y="498" fill="#6a6152" text-anchor="middle">rapport lisible</text>
  </g>
  <line x1="458" y1="446" x2="484" y2="446" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="458" y1="478" x2="484" y2="478" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="486" y="418" width="180" height="38" rx="6" fill="#fbf8f0" stroke="#8a2233" stroke-width="1.5"/>
    <text x="576" y="442" fill="#8a2233" text-anchor="middle">ci.yml : seuil 85 %, cliquet</text>
  </g>
  <g>
    <rect x="486" y="466" width="180" height="38" rx="6" fill="#fbf8f0" stroke="#3f6b34" stroke-width="1.5"/>
    <text x="576" y="490" fill="#3f6b34" text-anchor="middle">docs.yml : page qualité</text>
  </g>
  <line x1="666" y1="478" x2="692" y2="478" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <g>
    <rect x="694" y="418" width="166" height="86" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="777" y="440" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">/qualite/</text>
    <text x="777" y="462" fill="#25201a" text-anchor="middle">couverture par domaine,</text>
    <text x="777" y="482" fill="#25201a" text-anchor="middle">courbes de la nuit,</text>
    <text x="777" y="498" fill="#6a6152" text-anchor="middle">summary.json</text>
  </g>

  <text x="20" y="544" fill="#6a6152">Hors CTest, la nuit : les mêmes exécutables en ordre aléatoire (shuffle), les trois suites sous</text>
  <text x="20" y="562" fill="#6a6152">AddressSanitizer (sanitize, en PR), les lecteurs de données sous libFuzzer (fuzz), et Benchmarks en Release.</text>
</svg>
