<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#fbf8f0"/>
  <text x="30" y="36" font-size="20" font-weight="600" fill="#25201a">Pourquoi passer par scripts/build.ps1</text>

  <!-- chemin qui échoue -->
  <text x="30" y="78" font-size="13" font-weight="600" fill="#8a2233">cmake seul, depuis un terminal quelconque</text>
  <rect x="30" y="90" width="190" height="64" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="125" y="116" font-size="13" fill="#25201a" text-anchor="middle">Terminal nu, ou</text>
  <text x="125" y="136" font-size="13" fill="#25201a" text-anchor="middle">« Developer PowerShell » x86</text>
  <line x1="220" y1="122" x2="268" y2="122" stroke="#8a2233" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="270" y="90" width="210" height="64" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="375" y="116" font-size="13" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --preset ninja</text>
  <text x="375" y="136" font-size="12" fill="#6a6152" text-anchor="middle">hérite de LIB et INCLUDE</text>
  <line x1="480" y1="122" x2="528" y2="122" stroke="#8a2233" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="530" y="82" width="440" height="80" rx="6" fill="#fbf8f0" stroke="#8a2233" stroke-width="1.5"/>
  <text x="544" y="106" font-size="12" fill="#25201a">FATAL_ERROR à la configuration : « Environnement de compilation</text>
  <text x="544" y="124" font-size="12" fill="#25201a">32 bits » ou « compilateur x64, bibliothèques non x64 ».</text>
  <text x="544" y="148" font-size="12" fill="#6a6152">Sans ce contrôle : en-tête &lt;array&gt; introuvable, ou des centaines de LNK2001.</text>

  <!-- chemin qui marche -->
  <text x="30" y="214" font-size="13" font-weight="600" fill="#3f6b34">scripts/build.ps1, depuis n'importe quel terminal</text>

  <g>
    <rect x="30" y="228" width="170" height="92" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="115" y="252" font-size="13" font-weight="600" fill="#25201a" text-anchor="middle">1. Environnement</text>
    <text x="115" y="274" font-size="12" fill="#25201a" text-anchor="middle">vswhere → DevShell</text>
    <text x="115" y="292" font-size="12" fill="#25201a" text-anchor="middle">-arch=amd64</text>
    <text x="115" y="310" font-size="12" fill="#6a6152" text-anchor="middle">refuse si pas x64</text>
  </g>
  <line x1="200" y1="274" x2="222" y2="274" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="224" y="228" width="170" height="92" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="309" y="252" font-size="13" font-weight="600" fill="#25201a" text-anchor="middle">2. Garde Ninja</text>
    <text x="309" y="274" font-size="12" fill="#25201a" text-anchor="middle">.ninja_log sans</text>
    <text x="309" y="292" font-size="12" fill="#25201a" text-anchor="middle">.ninja_deps → refus</text>
    <text x="309" y="310" font-size="12" fill="#6a6152" text-anchor="middle">sortie : -Clean</text>
  </g>
  <line x1="394" y1="274" x2="416" y2="274" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="418" y="228" width="170" height="92" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="503" y="252" font-size="13" font-weight="600" fill="#25201a" text-anchor="middle">3. Configuration</text>
    <text x="503" y="274" font-size="12" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --preset</text>
    <text x="503" y="292" font-size="12" fill="#25201a" text-anchor="middle">Qt détecté ou -QtPath</text>
    <text x="503" y="310" font-size="12" fill="#6a6152" text-anchor="middle">sccache si trouvé</text>
  </g>
  <line x1="588" y1="274" x2="610" y2="274" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="612" y="228" width="170" height="92" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="697" y="252" font-size="13" font-weight="600" fill="#25201a" text-anchor="middle">4. Construction</text>
    <text x="697" y="274" font-size="12" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --build</text>
    <text x="697" y="292" font-size="12" fill="#25201a" text-anchor="middle">tout, ou -Target</text>
    <text x="697" y="310" font-size="12" fill="#6a6152" text-anchor="middle">/W4 /WX</text>
  </g>
  <line x1="782" y1="274" x2="804" y2="274" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="806" y="228" width="164" height="92" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="888" y="252" font-size="13" font-weight="600" fill="#25201a" text-anchor="middle">5. Tests</text>
    <text x="888" y="274" font-size="12" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">ctest --preset</text>
    <text x="888" y="292" font-size="12" fill="#25201a" text-anchor="middle">-Test ou -Label</text>
    <text x="888" y="310" font-size="12" fill="#6a6152" text-anchor="middle">facultatif</text>
  </g>

  <rect x="30" y="348" width="940" height="56" rx="6" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="44" y="372" font-size="12" fill="#25201a">Sortie : build/ninja/bin/ (Ninja) ou build/vs/bin/Debug et build/vs/bin/Release (Visual Studio, multi-configuration).</text>
  <text x="44" y="392" font-size="12" fill="#6a6152">Le générateur Visual Studio établit lui-même son environnement : le preset vs fonctionne aussi sans le script.</text>
</svg>
