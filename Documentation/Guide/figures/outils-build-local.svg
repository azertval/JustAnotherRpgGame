<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Georgia, serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#fbf8f0"/>
  <text x="20" y="34" font-size="19" font-weight="600" fill="#25201a">Pourquoi passer par scripts/build.ps1</text>

  <!-- chemin qui échoue -->
  <text x="20" y="72" font-weight="600" fill="#8a2233">cmake seul, depuis un terminal quelconque</text>
  <rect x="20" y="84" width="180" height="62" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="110" y="110" fill="#25201a" text-anchor="middle">Terminal nu, ou</text>
  <text x="110" y="130" fill="#25201a" text-anchor="middle">« Developer PowerShell » x86</text>
  <line x1="200" y1="115" x2="238" y2="115" stroke="#8a2233" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="240" y="84" width="196" height="62" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="338" y="110" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --preset ninja</text>
  <text x="338" y="130" fill="#6a6152" text-anchor="middle">hérite de LIB et INCLUDE</text>
  <line x1="436" y1="115" x2="474" y2="115" stroke="#8a2233" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="476" y="76" width="384" height="80" rx="6" fill="#fbf8f0" stroke="#8a2233" stroke-width="1.5"/>
  <text x="490" y="100" fill="#25201a">FATAL_ERROR à la configuration : « environnement</text>
  <text x="490" y="119" fill="#25201a">32 bits » ou « compilateur x64, bibliothèques non x64 ».</text>
  <text x="490" y="143" fill="#6a6152">Sans ce contrôle : &lt;array&gt; introuvable, ou des LNK2001.</text>

  <!-- chemin qui marche -->
  <text x="20" y="206" font-weight="600" fill="#3f6b34">scripts/build.ps1, depuis n'importe quel terminal</text>

  <g>
    <rect x="20" y="220" width="158" height="112" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="99" y="244" font-weight="600" fill="#25201a" text-anchor="middle">1. Environnement</text>
    <text x="99" y="268" fill="#25201a" text-anchor="middle">vswhere, DevShell</text>
    <text x="99" y="288" fill="#25201a" text-anchor="middle">-arch=amd64</text>
    <text x="99" y="312" fill="#6a6152" text-anchor="middle">refuse si pas x64</text>
  </g>
  <line x1="178" y1="276" x2="190" y2="276" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="192" y="220" width="158" height="112" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="271" y="244" font-weight="600" fill="#25201a" text-anchor="middle">2. Garde Ninja</text>
    <text x="271" y="268" fill="#25201a" text-anchor="middle">.ninja_log présent</text>
    <text x="271" y="288" fill="#25201a" text-anchor="middle">sans .ninja_deps : refus</text>
    <text x="271" y="312" fill="#6a6152" text-anchor="middle">sortie : -Clean</text>
  </g>
  <line x1="350" y1="276" x2="362" y2="276" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="364" y="220" width="158" height="112" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="443" y="244" font-weight="600" fill="#25201a" text-anchor="middle">3. Configuration</text>
    <text x="443" y="268" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --preset</text>
    <text x="443" y="288" fill="#25201a" text-anchor="middle">Qt détecté, ou -QtPath</text>
    <text x="443" y="312" fill="#6a6152" text-anchor="middle">sccache s'il est là</text>
  </g>
  <line x1="522" y1="276" x2="534" y2="276" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="536" y="220" width="158" height="112" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="615" y="244" font-weight="600" fill="#25201a" text-anchor="middle">4. Construction</text>
    <text x="615" y="268" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">cmake --build</text>
    <text x="615" y="288" fill="#25201a" text-anchor="middle">tout, ou -Target</text>
    <text x="615" y="312" fill="#6a6152" text-anchor="middle">/W4 /WX, PCH</text>
  </g>
  <line x1="694" y1="276" x2="706" y2="276" stroke="#6a6152" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="708" y="220" width="152" height="112" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="784" y="244" font-weight="600" fill="#25201a" text-anchor="middle">5. Tests</text>
    <text x="784" y="268" fill="#25201a" text-anchor="middle" font-family="Consolas, monospace">ctest --preset</text>
    <text x="784" y="288" fill="#25201a" text-anchor="middle">-Test, ou -Label</text>
    <text x="784" y="312" fill="#6a6152" text-anchor="middle">facultatif</text>
  </g>

  <rect x="20" y="358" width="840" height="120" rx="6" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="34" y="384" font-weight="600" fill="#25201a">Où atterrit le résultat</text>
  <text x="34" y="408" fill="#25201a" font-family="Consolas, monospace">build/ninja/bin/                     Ninja, une configuration (Debug par défaut)</text>
  <text x="34" y="428" fill="#25201a" font-family="Consolas, monospace">build/vs/bin/Debug, bin/Release     Visual Studio, multi-configuration</text>
  <text x="34" y="452" fill="#6a6152">Le générateur Visual Studio établit lui-même son environnement : le préréglage vs</text>
  <text x="34" y="470" fill="#6a6152">fonctionne aussi sans le script ; c'est celui de la CI.</text>
</svg>
