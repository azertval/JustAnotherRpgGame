<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="470" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="600" fill="#25201a">Deux entrées, un seul chemin : la souris et la ligne de commande appellent les mêmes fonctions</text>

  <!-- Entrée fenêtre -->
  <rect x="20" y="60" width="250" height="120" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="84" font-weight="600" fill="#25201a">La fenêtre</text>
  <text x="32" y="102" font-family="Consolas, monospace" font-size="12" fill="#6a6152">LevelEditor (QApplication)</text>
  <g font-size="12" fill="#25201a">
    <text x="32" y="126">clic, glisser, relâchement</text>
    <text x="32" y="142">menus Map / File</text>
    <text x="32" y="158">panneau Problems</text>
  </g>

  <!-- Entrée CLI -->
  <rect x="20" y="210" width="250" height="230" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="234" font-weight="600" fill="#25201a">Sans fenêtre</text>
  <text x="32" y="252" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Main.cpp, avant toute QApplication</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#25201a">
    <text x="32" y="278">runMapCommand</text>
    <text x="44" y="294">--check --migrate --apply</text>
    <text x="32" y="316">runRefactorCommand</text>
    <text x="44" y="332">--rename-* --replace-piece</text>
    <text x="44" y="348">--change-scene --link-maps</text>
    <text x="32" y="370">runPrefabCommand</text>
    <text x="44" y="386">--list-prefabs --save-prefab</text>
    <text x="32" y="408">runRenderCommand (Ui)</text>
    <text x="44" y="424">--render [--plan] [--layers]</text>
  </g>

  <!-- Le noyau pur -->
  <rect x="330" y="60" width="300" height="380" rx="8" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="342" y="84" font-weight="600" fill="#25201a">Editor/Logic — pur, sans Qt, testé</text>
  <g fill="#ece4d1" stroke="#d6c9a8">
    <rect x="342" y="100" width="276" height="56" rx="6"/>
    <rect x="342" y="166" width="276" height="56" rx="6"/>
    <rect x="342" y="232" width="276" height="56" rx="6"/>
    <rect x="342" y="298" width="276" height="56" rx="6"/>
    <rect x="342" y="364" width="276" height="62" rx="6"/>
  </g>
  <g fill="#25201a">
    <text x="352" y="118" font-weight="600">Les gestes</text>
    <text x="352" y="136" font-family="Consolas, monospace" font-size="12">applyStroke applyBucket pasteStamp</text>
    <text x="352" y="150" font-family="Consolas, monospace" font-size="12">resolveEntityPress dragEntities</text>
    <text x="352" y="184" font-weight="600">Le rejeu</text>
    <text x="352" y="202" font-family="Consolas, monospace" font-size="12">applyGestureScript(script, draft)</text>
    <text x="352" y="216" font-size="12" fill="#6a6152">GestureState = ce que la fenêtre arme</text>
    <text x="352" y="250" font-weight="600">Les plans</text>
    <text x="352" y="268" font-family="Consolas, monospace" font-size="12">planRenameMap planLinkMaps …</text>
    <text x="352" y="282" font-family="Consolas, monospace" font-size="12">→ RefactorPlan → applyRefactorPlan</text>
    <text x="352" y="316" font-weight="600">Le contrôle</text>
    <text x="352" y="334" font-family="Consolas, monospace" font-size="12">checkAllMaps = format + contenu</text>
    <text x="352" y="348" font-size="12" fill="#6a6152">MapCheckReport, ok() si zéro erreur</text>
    <text x="352" y="382" font-weight="600">La scène</text>
    <text x="352" y="400" font-family="Consolas, monospace" font-size="12">canvasSnapshot → composeWorldScene</text>
    <text x="352" y="414" font-size="12" fill="#6a6152">peinte par paintComposedScene (Ui)</text>
  </g>

  <!-- Flèches entrées → noyau -->
  <g stroke="#6a6152" stroke-width="1.5" fill="none">
    <path d="M270,120 L340,128" marker-end="url(#f)"/>
    <path d="M270,150 L340,260" marker-end="url(#f)"/>
    <path d="M270,166 L340,326" marker-end="url(#f)"/>
    <path d="M270,286 L340,194" marker-end="url(#f)"/>
    <path d="M270,324 L340,262" marker-end="url(#f)"/>
    <path d="M270,378 L340,264" marker-end="url(#f)"/>
    <path d="M270,416 L340,396" marker-end="url(#f)"/>
  </g>

  <!-- Sorties -->
  <rect x="670" y="60" width="190" height="170" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="682" y="84" font-weight="600" fill="#25201a">Ce qui sort</text>
  <g font-size="12" fill="#25201a">
    <text x="682" y="108">la carte, en JSON canonique</text>
    <text x="682" y="124">(charger puis écrire = même</text>
    <text x="682" y="140">fichier : un diff lisible)</text>
    <text x="682" y="164">un PNG, la même image que</text>
    <text x="682" y="180">le canevas et que le jeu</text>
    <text x="682" y="204">un code de sortie : 0, 1 refus</text>
    <text x="682" y="220">ou erreur, 2 ligne fausse</text>
  </g>
  <path d="M630,200 L668,160" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>

  <rect x="670" y="260" width="190" height="180" rx="8" fill="#ece4d1" stroke="#8a2233"/>
  <text x="682" y="284" font-weight="600" fill="#8a2233">Un geste refusé</text>
  <g font-size="12" fill="#25201a">
    <text x="682" y="308">couche verrouillée, case hors</text>
    <text x="682" y="324">carte, pièce inconnue, entité</text>
    <text x="682" y="340">qui sortirait, nom pris…</text>
    <text x="682" y="364">→ la fenêtre le dit dans la</text>
    <text x="682" y="380">barre d'état, une fois</text>
    <text x="682" y="400">→ --apply arrête tout, nomme</text>
    <text x="682" y="416">le geste, et n'écrit pas le</text>
    <text x="682" y="432">fichier (sortie 1)</text>
  </g>
  <path d="M630,330 L668,330" stroke="#8a2233" stroke-width="1.5" fill="none" marker-end="url(#fr)"/>
</svg>
