<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="600" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#25201a">Le chargement d'un catalogue : de la racine des données aux structures C++</text>

  <!-- Racine des données -->
  <rect x="20" y="52" width="840" height="118" rx="8" fill="none" stroke="#2f7f86" stroke-dasharray="6 4"/>
  <text x="34" y="74" font-weight="600" fill="#2f7f86">La racine des données : une même forme, trois emplacements</text>

  <rect x="34" y="88" width="256" height="70" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="46" y="108" font-weight="600" fill="#25201a">Le jeu</text>
  <text x="46" y="126" font-size="12" fill="#25201a">hmi::executableDirectory()</text>
  <text x="46" y="144" font-size="12" fill="#6a6152">copie faite au build (CopyGameData)</text>

  <rect x="312" y="88" width="256" height="70" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="324" y="108" font-weight="600" fill="#25201a">L'éditeur</text>
  <text x="324" y="126" font-size="12" fill="#25201a">hmi::resolveDataRoot : --data, sinon</text>
  <text x="324" y="144" font-size="12" fill="#6a6152">Source/Elements de l'arbre, sinon la copie</text>

  <rect x="590" y="88" width="256" height="70" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="602" y="108" font-weight="600" fill="#25201a">Les tests</text>
  <text x="602" y="126" font-size="12" fill="#25201a">JADG_TEST_DATA_DIR</text>
  <text x="602" y="144" font-size="12" fill="#6a6152">Source/Test/Fixtures/GameData, sans art du jeu</text>

  <!-- Balayage -->
  <path d="M440,170 L440,196" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="240" y="198" width="400" height="64" rx="8" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="254" y="220" font-weight="600" fill="#25201a">core::loadBestiary(racine / "Rpg" / "creatures")</text>
  <text x="254" y="238" font-size="12" fill="#25201a">le dossier est balayé, ses *.json triés — aucune liste de noms en C++</text>
  <text x="254" y="254" font-size="12" fill="#8a2233">dossier absent : une erreur, jamais « zéro créature »</text>

  <!-- JsonDocument -->
  <path d="M440,262 L440,288" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="240" y="290" width="400" height="98" rx="8" fill="#fbf8f0" stroke="#25201a"/>
  <text x="254" y="312" font-weight="600" fill="#25201a">core::readJsonObjectFromFile(fichier, version gérée)</text>
  <text x="254" y="332" font-size="12" fill="#25201a">JSON bien formé ? racine objet ? « version » absente vaut 1,</text>
  <text x="254" y="348" font-size="12" fill="#25201a">supérieure à la version gérée : refusée (0 désactive la garde).</text>
  <text x="254" y="368" font-family="Consolas, monospace" font-size="12" fill="#25201a">JsonDocument { root | error, message, position }</text>
  <text x="254" y="382" font-size="11" fill="#6a6152">« wolf.json:14:5 : JSON malforme … » — ne lève jamais (EX-NFR-040)</text>

  <!-- Lecture champ par champ -->
  <path d="M440,388 L440,414" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="240" y="416" width="400" height="64" rx="8" fill="#fbf8f0" stroke="#25201a"/>
  <text x="254" y="438" font-weight="600" fill="#25201a">Lecture champ par champ, vers l'agrégat typé</text>
  <text x="254" y="456" font-size="12" fill="#25201a">énumération inconnue du moteur : signalée, jamais ignorée ;</text>
  <text x="254" y="472" font-size="12" fill="#25201a">« mecanismesRequis » recopiés tels quels (EX-CNT-030)</text>

  <!-- Résultat -->
  <path d="M440,480 L440,506" stroke="#6a6152" stroke-width="1.5" marker-end="url(#f)"/>
  <rect x="240" y="508" width="400" height="74" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="254" y="530" font-weight="600" fill="#25201a">core::Bestiary</text>
  <text x="254" y="548" font-family="Consolas, monospace" font-size="12" fill="#25201a">creatures, errors, requiredMechanisms()</text>
  <text x="254" y="566" font-size="12" fill="#6a6152">valeurs + liste d'erreurs : l'appelant journalise et décide (EX-CNT-031)</text>

  <!-- Le schéma, à gauche -->
  <rect x="20" y="290" width="200" height="190" rx="8" fill="none" stroke="#3f6b34" stroke-dasharray="6 4"/>
  <text x="32" y="312" font-weight="600" fill="#3f6b34">Le schéma, en CI</text>
  <text x="32" y="334" font-size="12" fill="#25201a">Rpg/schema/creature.schema.json</text>
  <text x="32" y="352" font-size="12" fill="#25201a">+ common.schema.json</text>
  <text x="32" y="376" font-size="12" fill="#25201a">check_rpg_data.py valide</text>
  <text x="32" y="392" font-size="12" fill="#25201a">chaque fichier avant qu'il</text>
  <text x="32" y="408" font-size="12" fill="#25201a">n'entre dans le dépôt.</text>
  <text x="32" y="432" font-size="12" fill="#6a6152">Le moteur ne revalide pas :</text>
  <text x="32" y="448" font-size="12" fill="#6a6152">pas de validateur JSON</text>
  <text x="32" y="464" font-size="12" fill="#6a6152">Schema embarqué (LOT-32).</text>
  <path d="M220,340 L238,340" stroke="#3f6b34" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#f)"/>

  <!-- Les autres lecteurs, à droite -->
  <rect x="660" y="290" width="200" height="190" rx="8" fill="none" stroke="#9a7420" stroke-dasharray="6 4"/>
  <text x="672" y="312" font-weight="600" fill="#9a7420">Même brique, même forme</text>
  <text x="672" y="336" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadEquipment</text>
  <text x="672" y="352" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadCharacterOptions</text>
  <text x="672" y="368" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadAtlas</text>
  <text x="672" y="384" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadDialogues</text>
  <text x="672" y="400" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadEncounters</text>
  <text x="672" y="416" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::loadAssetFamilies</text>
  <text x="672" y="432" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::ScenePieceManifest</text>
  <text x="672" y="448" font-family="Consolas, monospace" font-size="11" fill="#25201a">core::LevelLoader (garde 0)</text>
  <text x="672" y="470" font-size="11" fill="#6a6152">chacun traduit JsonReadError</text>
  <path d="M658,340 L642,340" stroke="#9a7420" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#f)"/>
</svg>
