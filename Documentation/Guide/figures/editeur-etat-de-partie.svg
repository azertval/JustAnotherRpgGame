<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="540" fill="#fbf8f0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">L'état de partie (LOT-126) : un seul état, du dialogue au canevas et aux deux essais</text>

  <!-- Le dialogue World state… -->
  <rect x="20" y="44" width="300" height="330" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <rect x="20" y="44" width="300" height="26" rx="8" fill="#d6c9a8"/>
  <text x="32" y="62" font-weight="600" fill="#25201a">World state</text>
  <text x="270" y="62" font-size="11" fill="#6a6152">Map › …</text>

  <text x="32" y="92" font-size="11" fill="#6a6152">Drapeaux à valeur des quêtes (declaredFlags)</text>
  <text x="32" y="112" font-family="Consolas, monospace" font-size="11" fill="#25201a">quete.pommes</text>
  <rect x="166" y="99" width="140" height="20" rx="3" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="172" y="113" font-family="Consolas, monospace" font-size="11" fill="#25201a">acceptee</text>
  <text x="290" y="113" font-size="11" fill="#6a6152">▾</text>
  <text x="172" y="134" font-size="10" fill="#6a6152">initiale · acceptee · rendue</text>

  <text x="32" y="156" font-family="Consolas, monospace" font-size="11" fill="#25201a">porte.arene</text>
  <rect x="166" y="143" width="140" height="20" rx="3" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="172" y="157" font-family="Consolas, monospace" font-size="11" fill="#25201a">condamne</text>
  <text x="290" y="157" font-size="11" fill="#6a6152">▾</text>

  <text x="32" y="186" font-size="11" fill="#6a6152">Faits connus des dialogues et zones (flags)</text>
  <rect x="34" y="194" width="11" height="11" fill="#3f6b34" stroke="#25201a"/>
  <text x="52" y="204" font-family="Consolas, monospace" font-size="11" fill="#25201a">garde.parle</text>
  <rect x="34" y="212" width="11" height="11" fill="#fbf8f0" stroke="#25201a"/>
  <text x="52" y="222" font-family="Consolas, monospace" font-size="11" fill="#25201a">enfant.vu</text>

  <text x="32" y="248" font-size="11" fill="#6a6152">Autres faits, à la main</text>
  <rect x="34" y="256" width="272" height="20" rx="3" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="40" y="270" font-family="Consolas, monospace" font-size="11" fill="#25201a">foret.ouverte</text>

  <rect x="34" y="292" width="11" height="11" fill="#3f6b34" stroke="#25201a"/>
  <text x="52" y="302" font-size="11" fill="#25201a">Preview in canvas (choice.preview)</text>

  <rect x="196" y="330" width="52" height="24" rx="4" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="212" y="346" font-size="11" fill="#25201a">OK</text>
  <rect x="254" y="330" width="52" height="24" rx="4" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="261" y="346" font-size="11" fill="#6a6152">Cancel</text>
  <text x="32" y="346" font-family="Consolas, monospace" font-size="10" fill="#6a6152">askWorldState(…)</text>

  <!-- Les entrées -->
  <rect x="20" y="390" width="300" height="76" rx="6" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="32" y="408" font-size="11" font-weight="600" fill="#25201a">entries() : la forme de --flags=</text>
  <text x="32" y="426" font-family="Consolas, monospace" font-size="11" fill="#25201a">quete.pommes=acceptee</text>
  <text x="32" y="441" font-family="Consolas, monospace" font-size="11" fill="#25201a">porte.arene=condamne</text>
  <text x="32" y="456" font-family="Consolas, monospace" font-size="10" fill="#25201a">garde.parle · foret.ouverte</text>
  <text x="196" y="426" font-size="10" fill="#6a6152">drapeau=valeur</text>
  <text x="216" y="456" font-size="10" fill="#6a6152">fait acquis</text>
  <path d="M170,374 L170,388" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Le canevas -->
  <rect x="350" y="44" width="260" height="330" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="362" y="66" font-weight="600" fill="#25201a">Le canevas, sous cet état</text>
  <text x="362" y="82" font-family="Consolas, monospace" font-size="10" fill="#6a6152">setWorldState(entrées, preview)</text>
  <g stroke="#d6c9a8" fill="#fbf8f0">
    <path d="M480,110 L540,140 L480,170 L420,140 z"/>
    <path d="M420,140 L480,170 L420,200 L360,170 z" fill="#fbf8f0"/>
    <path d="M540,140 L600,170 L540,200 L480,170 z"/>
    <path d="M480,170 L540,200 L480,230 L420,200 z"/>
    <path d="M420,200 L480,230 L420,260 L360,230 z"/>
    <path d="M540,200 L600,230 L540,260 L480,230 z"/>
    <path d="M480,230 L540,260 L480,290 L420,260 z"/>
  </g>
  <!-- garde : présent -->
  <circle cx="420" cy="166" r="11" fill="#9a7420" stroke="#25201a"/>
  <text x="415" y="171" font-size="11" fill="#fbf8f0">G</text>
  <text x="362" y="120" font-size="11" fill="#3f6b34">garde : présent</text>
  <text x="362" y="133" font-size="10" fill="#6a6152">quete.pommes = acceptee</text>
  <!-- enfant : grisé -->
  <circle cx="540" cy="226" r="11" fill="#6a6152" fill-opacity="0.35" stroke="#6a6152" stroke-opacity="0.6"/>
  <text x="535" y="231" font-size="11" fill="#6a6152">E</text>
  <text x="500" y="120" font-size="11" fill="#6a6152">enfant : grisé</text>
  <text x="500" y="133" font-size="10" fill="#6a6152">requiert enfant.vu, absent</text>
  <!-- porte : fermée -->
  <rect x="470" y="272" width="20" height="26" fill="#8a2233" stroke="#25201a"/>
  <text x="362" y="318" font-size="11" fill="#8a2233">porte de l'arène : fermée (condamne)</text>
  <text x="362" y="334" font-family="Consolas, monospace" font-size="10" fill="#25201a">presenceUnder(entités, flags)</text>
  <text x="362" y="347" font-size="10" fill="#6a6152">→ un booléen par entité (isEntityPresent)</text>
  <text x="362" y="360" font-size="10" fill="#6a6152">sans preview : rien n'est grisé,</text>
  <text x="362" y="371" font-size="10" fill="#6a6152">l'essai part de l'état quand même</text>

  <!-- Les deux sorties -->
  <rect x="640" y="44" width="220" height="150" rx="8" fill="#ece4d1" stroke="#3f6b34"/>
  <text x="652" y="66" font-weight="600" fill="#3f6b34">P — essai immédiat</text>
  <text x="652" y="84" font-size="11" fill="#25201a">dans la fenêtre, par WorldPlay</text>
  <text x="652" y="104" font-family="Consolas, monospace" font-size="10" fill="#25201a">worldStateFlags(entrées,</text>
  <text x="652" y="117" font-family="Consolas, monospace" font-size="10" fill="#25201a">  declaredFlags)</text>
  <text x="652" y="135" font-size="11" fill="#25201a">→ core::WorldFlags : chaque</text>
  <text x="652" y="150" font-size="11" fill="#25201a">drapeau déclaré à l'initiale,</text>
  <text x="652" y="165" font-size="11" fill="#25201a">puis les entrées, dans l'ordre ;</text>
  <text x="652" y="180" font-size="11" fill="#8a2233">refused : ce qui n'a pas pris</text>

  <rect x="640" y="224" width="220" height="150" rx="8" fill="#ece4d1" stroke="#2f7f86"/>
  <text x="652" y="246" font-weight="600" fill="#2f7f86">F5 — essai complet</text>
  <text x="652" y="264" font-size="11" fill="#25201a">le vrai jeu, lancé à côté</text>
  <text x="652" y="284" font-family="Consolas, monospace" font-size="10" fill="#25201a">gameLaunchArguments →</text>
  <text x="652" y="298" font-family="Consolas, monospace" font-size="10" fill="#25201a">--flags=quete.pommes=acceptee,</text>
  <text x="652" y="311" font-family="Consolas, monospace" font-size="10" fill="#25201a">  porte.arene=condamne,</text>
  <text x="652" y="324" font-family="Consolas, monospace" font-size="10" fill="#25201a">  garde.parle,foret.ouverte</text>
  <text x="652" y="344" font-family="Consolas, monospace" font-size="10" fill="#25201a">hmi::parseWorldFlags</text>
  <text x="652" y="360" font-size="11" fill="#25201a">relit la même écriture</text>

  <!-- Flèches -->
  <g stroke="#9a7420" stroke-width="2" fill="none">
    <path d="M320,300 L348,300" marker-end="url(#a)"/>
    <path d="M610,120 L638,120" marker-end="url(#a)"/>
    <path d="M610,300 L638,300" marker-end="url(#a)"/>
  </g>
  <text x="322" y="292" font-size="9" fill="#6a6152">vaut pour</text>
  <text x="322" y="318" font-size="9" fill="#6a6152">tous les</text>
  <text x="322" y="330" font-size="9" fill="#6a6152">onglets</text>

  <!-- Légende -->
  <g font-size="12" fill="#25201a">
    <text x="20" y="490">Une carte de quête change avec les drapeaux : l'auteur choisit un état dans Map › World state… — une valeur par</text>
    <text x="20" y="508">drapeau déclaré, des faits cochés ou écrits — et le canevas grise ce qui en est absent. L'état s'écrit comme le jeu</text>
    <text x="20" y="526">le lit (--flags=), si bien que ce que le canevas montre est exactement ce que P et F5 reçoivent : un seul état, pas trois.</text>
  </g>
</svg>
