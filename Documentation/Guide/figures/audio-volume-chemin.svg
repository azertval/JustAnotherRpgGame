<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="400" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/>
    </marker>
  </defs>

  <!-- 1. L'écran -->
  <rect x="20" y="20" width="200" height="120" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="44" font-weight="600" fill="#25201a">1. L'écran des options</text>
  <text x="32" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">Options.qml, onglet Audio</text>
  <text x="32" y="88" fill="#25201a">Le curseur tient sa valeur</text>
  <text x="32" y="106" fill="#25201a">en attente ; « Appliquer »</text>
  <text x="32" y="124" font-family="Consolas, monospace" font-size="12" fill="#25201a">OptionsModel.volume = 80</text>

  <!-- 2. La vue-modèle -->
  <rect x="250" y="20" width="200" height="120" rx="8" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="262" y="44" font-weight="600" fill="#25201a">2. hmi::OptionsModel</text>
  <text x="262" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">HMI/Runtime, Qt6::Qml</text>
  <text x="262" y="88" fill="#25201a">persiste (QSettings)</text>
  <text x="262" y="106" fill="#25201a">et prévient :</text>
  <text x="262" y="124" font-family="Consolas, monospace" font-size="12" fill="#25201a">emit volumeChanged()</text>

  <!-- 3. L'application -->
  <rect x="480" y="20" width="200" height="120" rx="8" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="492" y="44" font-weight="600" fill="#25201a">3. connectOptions</text>
  <text x="492" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">App/Game/Main.cpp</text>
  <text x="492" y="88" fill="#25201a">le seul endroit qui connaît</text>
  <text x="492" y="106" fill="#25201a">à la fois le réglage et le son :</text>
  <text x="492" y="124" font-family="Consolas, monospace" font-size="12" fill="#25201a">audio.setVolume(80 / 100.0f)</text>

  <!-- 4. Le moteur -->
  <rect x="710" y="20" width="150" height="120" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="722" y="44" font-weight="600" fill="#25201a">4. hmi::AudioEngine</text>
  <text x="722" y="64" font-family="Consolas, monospace" font-size="12" fill="#6a6152">HMI/Audio</text>
  <text x="722" y="88" fill="#25201a">borne à [0, 1], puis</text>
  <text x="722" y="106" fill="#25201a">l'applique à chaque</text>
  <text x="722" y="124" fill="#25201a">QSoundEffect préchargé</text>

  <g stroke="#6a6152" stroke-width="1.5" fill="none">
    <path d="M220,80 L248,80" marker-end="url(#f)"/>
    <path d="M450,80 L478,80" marker-end="url(#f)"/>
    <path d="M680,80 L708,80" marker-end="url(#f)"/>
  </g>

  <!-- Frontière -->
  <path d="M465,150 L465,170" stroke="#8a2233" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text x="20" y="168" font-size="12" fill="#8a2233">La vue-modèle ignore le moteur audio ; le moteur ignore les réglages. Seul Main.cpp les relie.</text>

  <!-- Le tourniquet -->
  <rect x="20" y="190" width="840" height="190" rx="8" fill="#fbf8f0" stroke="#d6c9a8"/>
  <text x="32" y="214" font-weight="600" fill="#25201a">preload("coup", coup.wav) prépare 3 instances ; play("coup") les consomme en tourniquet</text>
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="40" y="232" width="150" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="52" y="256" fill="#25201a">instance 0</text>
    <rect x="220" y="232" width="150" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="232" y="256" fill="#25201a">instance 1</text>
    <rect x="400" y="232" width="150" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="412" y="256" fill="#25201a">instance 2</text>
  </g>
  <g stroke="#6a6152" stroke-width="1.5" fill="none">
    <path d="M190,252 L218,252" marker-end="url(#f)"/>
    <path d="M370,252 L398,252" marker-end="url(#f)"/>
    <path d="M550,252 L580,252 L580,290 L115,290 L115,274" marker-end="url(#f)"/>
  </g>
  <text x="590" y="256" font-size="12" fill="#6a6152">play ×1, ×2, ×3 : trois lectures se recouvrent</text>
  <text x="590" y="274" font-size="12" fill="#6a6152">play ×4 : réutilise la plus ancienne (instance 0)</text>
  <text x="590" y="292" font-size="12" fill="#6a6152">— jamais d'empilement indéfini</text>
  <text x="32" y="322" fill="#25201a">Précharger au démarrage, jamais au premier déclenchement : QSoundEffect charge son fichier de façon asynchrone,</text>
  <text x="32" y="340" fill="#25201a">et jouer juste après la construction ne produit rien — une première occurrence silencieuse, difficile à attribuer.</text>
  <text x="32" y="366" font-size="12" fill="#8a2233">Périphérique absent, fichier introuvable, identifiant jamais préchargé : muet, un avertissement journalisé une fois, jamais une exception (EX-NFR-040).</text>
</svg>
