<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="560" fill="#fbf8f0"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6152"/>
    </marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6b34"/>
    </marker>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="600" fill="#25201a">Un geste de l'auteur, du panneau au pixel</text>

  <!-- Colonne 1 : les panneaux -->
  <rect x="20" y="50" width="200" height="300" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="32" y="74" font-weight="600" fill="#25201a">Les panneaux (docks)</text>
  <text x="32" y="92" font-size="12" fill="#6a6152">ils demandent, ils ne possèdent rien</text>
  <g fill="#fbf8f0" stroke="#d6c9a8">
    <rect x="32" y="106" width="176" height="40" rx="6"/>
    <rect x="32" y="154" width="176" height="40" rx="6"/>
    <rect x="32" y="202" width="176" height="40" rx="6"/>
    <rect x="32" y="250" width="176" height="40" rx="6"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12" fill="#25201a">
    <text x="42" y="123">PalettePanel</text>
    <text x="42" y="171">LayersPanel</text>
    <text x="42" y="219">EntityPanel</text>
    <text x="42" y="267">LevelBrowserPanel</text>
  </g>
  <g font-size="12" fill="#6a6152">
    <text x="42" y="139">pieceSelected, tileSelected</text>
    <text x="42" y="187">activeLayerRequested…</text>
    <text x="42" y="235">kindToPlaceChanged…</text>
    <text x="42" y="283">levelOpenRequested</text>
  </g>
  <text x="32" y="318" font-size="12" fill="#6a6152">MainWindow relaie chaque</text>
  <text x="32" y="334" font-size="12" fill="#6a6152">signal au canevas actif</text>

  <!-- Colonne 2 : le canevas -->
  <rect x="260" y="50" width="340" height="490" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="272" y="74" font-weight="600" fill="#25201a">Le canevas</text>
  <text x="272" y="92" font-family="Consolas, monospace" font-size="12" fill="#6a6152">hmi::EditorViewport — seul propriétaire du brouillon</text>

  <g fill="#fbf8f0" stroke="#9a7420">
    <rect x="272" y="106" width="316" height="52" rx="6"/>
    <rect x="272" y="182" width="316" height="66" rx="6"/>
    <rect x="272" y="272" width="316" height="66" rx="6"/>
    <rect x="272" y="362" width="316" height="52" rx="6"/>
    <rect x="272" y="438" width="316" height="52" rx="6"/>
  </g>
  <g fill="#25201a">
    <text x="284" y="126" font-weight="600">1. Pointer</text>
    <text x="284" y="146" font-family="Consolas, monospace" font-size="12">pickIsoCell / pickFlatCell → une case</text>

    <text x="284" y="202" font-weight="600">2. Décider le geste (fonctions pures)</text>
    <text x="284" y="222" font-family="Consolas, monospace" font-size="12">applyStroke, applyBucket, pasteStamp,</text>
    <text x="284" y="238" font-family="Consolas, monospace" font-size="12">resolveEntityPress → dragEntities</text>

    <text x="284" y="292" font-weight="600">3. Écrire, en un pas</text>
    <text x="284" y="312" font-family="Consolas, monospace" font-size="12">core::GestureScope { draft.placePiece…, }</text>
    <text x="284" y="328" font-size="12" fill="#6a6152">un geste = un instantané d'annulation</text>

    <text x="284" y="382" font-weight="600">4. Composer comme le jeu</text>
    <text x="284" y="402" font-family="Consolas, monospace" font-size="12">canvasSnapshot → composeWorldScene</text>

    <text x="284" y="458" font-weight="600">5. Peindre, sans GPU</text>
    <text x="284" y="478" font-family="Consolas, monospace" font-size="12">paintComposedScene(QPainter, visible)</text>
  </g>
  <g stroke="#6a6152" stroke-width="1.5" fill="none">
    <path d="M430,158 L430,180" marker-end="url(#f)"/>
    <path d="M430,248 L430,270" marker-end="url(#f)"/>
    <path d="M430,338 L430,360" marker-end="url(#f)"/>
    <path d="M430,414 L430,436" marker-end="url(#f)"/>
  </g>
  <text x="272" y="522" font-size="12" fill="#6a6152">draftChanged → les panneaux relisent (refresh)</text>

  <!-- Flèches panneaux → canevas -->
  <g stroke="#9a7420" stroke-width="1.5" fill="none">
    <path d="M208,126 L262,126" marker-end="url(#fo)"/>
    <path d="M208,174 L262,190" marker-end="url(#fo)"/>
    <path d="M208,222 L262,214" marker-end="url(#fo)"/>
  </g>
  <path d="M262,522 C200,522 140,470 140,400 L140,352" stroke="#6a6152" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#f)"/>

  <!-- Colonne 3 : le brouillon et ses sorties -->
  <rect x="640" y="50" width="220" height="150" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="652" y="74" font-weight="600" fill="#25201a">Le brouillon</text>
  <text x="652" y="92" font-family="Consolas, monospace" font-size="12" fill="#6a6152">core::LevelDraft</text>
  <g font-size="12" fill="#25201a">
    <text x="652" y="116">couches, pièces, entités,</text>
    <text x="652" y="132">collision déduite + forcée,</text>
    <text x="652" y="148">historique (200 pas), révision</text>
  </g>
  <text x="652" y="176" font-size="12" fill="#6a6152">jamais valide par obligation :</text>
  <text x="652" y="192" font-size="12" fill="#6a6152">une carte en cours se montre telle quelle</text>
  <path d="M588,300 L640,300 L640,200" stroke="#6a6152" stroke-width="1.5" fill="none" marker-end="url(#f)"/>

  <!-- Sorties -->
  <g fill="#fbf8f0" stroke="#3f6b34">
    <rect x="640" y="230" width="220" height="60" rx="6"/>
    <rect x="640" y="310" width="220" height="60" rx="6"/>
    <rect x="640" y="390" width="220" height="60" rx="6"/>
    <rect x="640" y="470" width="220" height="70" rx="6"/>
  </g>
  <g fill="#3f6b34" font-weight="600">
    <text x="652" y="250">Ctrl+S — enregistrer</text>
    <text x="652" y="330">P — essai immédiat</text>
    <text x="652" y="410">toutes les 2 s — reprise</text>
    <text x="652" y="490">F5 — essai complet</text>
  </g>
  <g font-family="Consolas, monospace" font-size="12" fill="#25201a">
    <text x="652" y="268">toLevel() → LevelWriter</text>
    <text x="652" y="282">(refus : rien n'est écrit)</text>
    <text x="652" y="348">toLevel() → WorldPlay</text>
    <text x="652" y="362">(le brouillon sert la carte)</text>
    <text x="652" y="428">toJson() → AutosaveStore</text>
    <text x="652" y="442">(%LOCALAPPDATA%, hors dépôt)</text>
    <text x="652" y="508">writeDraftMaps → dossier</text>
    <text x="652" y="522">temporaire → JustAnotherRpgGame</text>
    <text x="652" y="536">(--levels= sert les brouillons)</text>
  </g>
  <g stroke="#3f6b34" stroke-width="1.5" fill="none">
    <path d="M750,200 L750,228" marker-end="url(#fg)"/>
  </g>
</svg>
