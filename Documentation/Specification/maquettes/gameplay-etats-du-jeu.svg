<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" font-family="Georgia, serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2233"/></marker>
  </defs>
  <rect width="880" height="590" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Schéma — la machine à états hmi::ScreenFlow : événements nommés, retours mémorisés (EX-GP-040)</text>

  <g fill="#25201a">
    <rect x="40" y="80" width="150" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="48" y="100" font-weight="600">Menu</text>
    <text x="48" y="118" font-size="10" font-family="Consolas, monospace">OpenMenu → lui-même</text>
    <rect x="330" y="80" width="160" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="338" y="100" font-weight="600">Game — exploration</text>
    <text x="338" y="118" font-size="10">la scène tourne</text>
    <rect x="620" y="80" width="160" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="628" y="100" font-weight="600">Arena — le Colisée</text>
    <text x="628" y="118" font-size="10" font-family="Consolas, monospace">OpenMenu → Menu</text>
    <rect x="40" y="210" width="150" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="48" y="230" font-weight="600">Credits</text>
    <rect x="330" y="210" width="160" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="338" y="230" font-weight="600">Pause</text>
    <text x="338" y="248" font-size="10" font-family="Consolas, monospace">QuitPauseToMenu → Menu</text>
    <rect x="640" y="210" width="160" height="50" fill="#ece4d1" stroke="#25201a"/>
    <text x="648" y="230" font-weight="600">Options</text>
  </g>

  <g stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190,92 L328,92"/>
    <path d="M100,130 L100,208"/>
    <path d="M115,80 L115,56 L790,56 L790,208"/>
    <path d="M160,80 L160,68 L700,68 L700,78"/>
    <path d="M40,118 L24,118 L24,410 L38,410"/>
    <path d="M380,130 L380,208"/>
    <path d="M490,100 L618,100"/>
    <path d="M330,122 L310,122 L310,328"/>
    <path d="M490,235 L638,235"/>
    <path d="M410,260 L410,328"/>
  </g>
  <g stroke="#8a2233" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M330,112 L192,112"/>
    <path d="M130,208 L130,132"/>
    <path d="M440,208 L440,132"/>
    <path d="M700,130 L700,140"/>
    <path d="M720,260 L720,270"/>
  </g>
  <g font-size="10" font-family="Consolas, monospace" fill="#25201a">
    <text x="228" y="88">OpenGame</text>
    <text x="228" y="124" fill="#8a2233">OpenMenu</text>
    <text x="40" y="172">OpenCredits</text>
    <text x="134" y="172" fill="#8a2233">CloseCredits</text>
    <text x="400" y="53">OpenOptions</text>
    <text x="470" y="66">OpenArena · Nouvelle partie (LOT-50)</text>
    <text x="44" y="296">OpenRpgScreen</text>
    <text x="44" y="308" font-family="Georgia, serif">échafaudage (LOT-68)</text>
    <text x="386" y="172">OpenPause</text>
    <text x="444" y="172" fill="#8a2233">ResumePause</text>
    <text x="500" y="96">OpenArena (LOT-09)</text>
    <text x="304" y="300" text-anchor="end">OpenRpgScreen</text>
    <text x="414" y="300">OpenRpgScreen</text>
    <text x="520" y="231">OpenOptions</text>
  </g>
  <rect x="600" y="142" width="200" height="30" fill="#fbf8f0" stroke="#8a2233"/>
  <text x="608" y="154" font-size="10" font-family="Consolas, monospace" fill="#8a2233">CloseArena → arenaReturnTo</text>
  <text x="608" y="167" font-size="10" fill="#8a2233">Menu, ou Game (le héraut, LOT-09)</text>
  <rect x="620" y="272" width="200" height="30" fill="#fbf8f0" stroke="#8a2233"/>
  <text x="628" y="284" font-size="10" font-family="Consolas, monospace" fill="#8a2233">CloseOptions → optionsReturnTo</text>
  <text x="628" y="297" font-size="10" fill="#8a2233">Menu, ou Pause</text>

  <rect x="40" y="330" width="810" height="160" fill="#fbf8f0" stroke="#25201a"/>
  <text x="50" y="350" font-size="12" font-weight="600" fill="#25201a">RpgScreen — la pile d'écrans QML (ScreenStack) : un formulaire par écran ; passer de l'un à l'autre n'est pas une transition</text>
  <text x="50" y="366" font-size="10" fill="#8a2233">CloseRpgScreen → rpgReturnTo : Menu, Game ou Pause (EX-IHM-090). La règle de superposition appartient à la description de l'écran,</text>
  <text x="50" y="380" font-size="10" fill="#25201a">jamais au point d'appel (EX-IHM-091) : bordure pleine = la vue gèle la simulation à la perte du focus ; pointillé = se consulte en marchant.</text>
  <g font-size="10" fill="#25201a">
    <rect x="50" y="392" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="56" y="410"><tspan font-family="Consolas, monospace" font-size="11">CharacterSheet</tspan> · fiche</text>
    <rect x="208" y="392" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="214" y="410"><tspan font-family="Consolas, monospace" font-size="11">Skills</tspan> · compétences</text>
    <rect x="366" y="392" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="372" y="410"><tspan font-family="Consolas, monospace" font-size="11">Inventory</tspan> · sac</text>
    <rect x="524" y="392" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="530" y="410"><tspan font-family="Consolas, monospace" font-size="11">QuestJournal</tspan> · journal</text>
    <rect x="682" y="392" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="688" y="410"><tspan font-family="Consolas, monospace" font-size="11">Dialogue</tspan> · dialogue</text>
    <rect x="50" y="432" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="56" y="450"><tspan font-family="Consolas, monospace" font-size="11">Merchant</tspan> · marchand</text>
    <rect x="208" y="432" width="150" height="28" fill="#ece4d1" stroke="#25201a" stroke-width="2"/><text x="214" y="450"><tspan font-family="Consolas, monospace" font-size="11">Company</tspan> · équipe</text>
    <rect x="366" y="432" width="150" height="28" fill="#fbf8f0" stroke="#6a6152" stroke-dasharray="4 3"/><text x="372" y="450"><tspan font-family="Consolas, monospace" font-size="11">WorldMap</tspan> · carte</text>
    <rect x="524" y="432" width="150" height="28" fill="#fbf8f0" stroke="#6a6152" stroke-dasharray="4 3"/><text x="530" y="450"><tspan font-family="Consolas, monospace" font-size="11">CombatHud</tspan> · ATH de combat</text>
    <text x="682" y="450" fill="#6a6152">pas d'écran de fin, pas</text>
    <text x="682" y="462" fill="#6a6152">d'état de chargement</text>
    <text x="50" y="480" fill="#6a6152">Sept suspendent la simulation, deux se consultent en marchant : c'est GameView.qml qui gèle et dégèle (onActiveFocusChanged).</text>
  </g>

  <g font-size="11" fill="#6a6152">
    <text x="20" y="514">Ce que montre le dessin : les sept hmi::ScreenId et les treize hmi::ScreenEvent tels que resolveTransition les écrit ; tout événement</text>
    <text x="20" y="530">absent de la table rend nullopt et ne change rien (EX-GP-041). Pourquoi trois retours mémorisés plutôt qu'un historique : un écran</text>
    <text x="20" y="546">ne revient qu'à celui qui l'a ouvert, et la machine reste une table pure, testable sans fenêtre. « Nouvelle partie » est OpenGame ;</text>
    <text x="20" y="562">le Colisée, mode de jeu, ne s'ouvre que du menu ou par le héraut de la carte (LOT-09), et revient là d'où il vient.</text>
  </g>
</svg>
