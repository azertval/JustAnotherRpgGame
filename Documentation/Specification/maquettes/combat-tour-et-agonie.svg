<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="600" fill="#fbf8f0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — la bascule exploration ↔ combat, le cycle d'un tour, et l'agonie</text>

  <!-- 1. Bascule -->
  <text x="20" y="46" font-weight="600" fill="#25201a">1. La bascule (EX-CBT-001) et le cycle d'un tour (EX-CBT-010, EX-CBT-011, EX-CBT-012)</text>
  <rect x="30" y="70" width="130" height="44" rx="8" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="95" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#25201a">Exploration</text>
  <rect x="260" y="70" width="130" height="44" rx="8" fill="#8a2233" fill-opacity="0.15" stroke="#8a2233"/>
  <text x="325" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#25201a">Combat</text>
  <path d="M160,80 L258,80" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="209" y="64" text-anchor="middle" font-size="10" fill="#25201a">déclencheur nommé (EncounterTrigger)</text>
  <path d="M260,104 L162,104" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="209" y="128" text-anchor="middle" font-size="10" fill="#25201a">plus aucun camp hostile engagé</text>
  <text x="209" y="140" text-anchor="middle" font-size="10" fill="#6a6152">victoire, fuite (CombatOutcome)</text>

  <!-- la même carte -->
  <g transform="translate(30,150)">
    <rect x="0" y="0" width="360" height="120" fill="#fbf8f0" stroke="#d6c9a8"/>
    <g stroke="#d6c9a8"><path d="M30,0v120M60,0v120M90,0v120M120,0v120M150,0v120M180,0v120M210,0v120M240,0v120M270,0v120M300,0v120M330,0v120M0,30h360M0,60h360M0,90h360"/></g>
    <g fill="#6a6152"><rect x="90" y="0" width="30" height="60"/><rect x="240" y="60" width="30" height="60"/><rect x="270" y="60" width="30" height="30"/></g>
    <g fill="none" stroke="#2f7f86" stroke-width="1" stroke-dasharray="3 2">
      <rect x="120" y="30" width="30" height="30"/><rect x="150" y="30" width="30" height="30"/><rect x="180" y="30" width="30" height="30"/>
      <rect x="120" y="60" width="30" height="30"/><rect x="150" y="60" width="30" height="30"/><rect x="180" y="60" width="30" height="30"/>
      <rect x="150" y="90" width="30" height="30"/><rect x="150" y="0" width="30" height="30"/>
    </g>
    <circle cx="165" cy="75" r="9" fill="#3f6b34"/><text x="165" y="79" text-anchor="middle" font-size="9" fill="#fbf8f0">H</text>
    <circle cx="225" cy="45" r="9" fill="#8a2233"/><text x="225" y="49" text-anchor="middle" font-size="9" fill="#fbf8f0">A</text>
    <text x="4" y="112" font-size="9" fill="#6a6152">collision (exploration)</text>
    <text x="356" y="12" text-anchor="end" font-size="9" fill="#2f7f86">grille tactique (combat)</text>
  </g>
  <g font-size="10" fill="#6a6152">
    <text x="30" y="286">même endroit de la même carte : position, orientation et caméra</text>
    <text x="30" y="298">sont conservées (core::ExplorationSnapshot), les PV non.</text>
    <text x="30" y="314">la grille est dérivée de la couche de collision (EX-LVL-016), jamais</text>
    <text x="30" y="326">dessinée à part : ce qui bloquait bloque encore.</text>
  </g>

  <!-- Le cycle du tour -->
  <rect x="430" y="62" width="430" height="52" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="440" y="80" font-size="12" font-weight="600" fill="#25201a">Initiative jetée une fois ; l'ordre ne bouge plus (EX-CBT-010)</text>
  <text x="440" y="96" font-size="10" fill="#25201a">égalité : total, puis modificateur, Dextérité, alliés d'abord, identifiant</text>
  <text x="440" y="108" font-size="10" fill="#6a6152">(core::actsBefore) — jamais l'ordre d'insertion en mémoire</text>
  <path d="M645,114 L645,128" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="430" y="130" width="430" height="66" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <text x="440" y="148" font-size="12" font-weight="600" fill="#25201a">Début du tour du porteur : les ressources reviennent (refresh)</text>
  <g fill="#ece4d1" stroke="#d6c9a8">
    <rect x="440" y="158" width="70" height="24" rx="12"/><rect x="518" y="158" width="100" height="24" rx="12"/>
    <rect x="626" y="158" width="80" height="24" rx="12"/><rect x="714" y="158" width="100" height="24" rx="12"/>
  </g>
  <g font-size="11" fill="#25201a" text-anchor="middle">
    <text x="475" y="174">action</text><text x="568" y="174">action bonus</text>
    <text x="666" y="174">réaction</text><text x="764" y="174">déplacement</text>
  </g>
  <text x="822" y="174" font-size="10" fill="#6a6152">× 1</text>
  <path d="M645,196 L645,210" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="430" y="212" width="430" height="58" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="440" y="230" font-size="12" font-weight="600" fill="#25201a">Chaque ressource se dépense une seule fois (EX-CBT-011)</text>
  <text x="440" y="246" font-size="10" fill="#8a2233">la réaction se dépense aussi hors de son tour (attaque d'opportunité) et</text>
  <text x="440" y="258" font-size="10" fill="#8a2233">revient au début du tour suivant de son porteur, pas à la fin du tour courant</text>
  <path d="M645,270 L645,284" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="430" y="286" width="430" height="44" rx="6" fill="#25201a"/>
  <text x="440" y="304" font-size="12" font-weight="600" fill="#fbf8f0">Fin de tour explicite : endTurn (EX-CBT-012)</text>
  <text x="440" y="320" font-size="10" fill="#ece4d1">épuiser ses ressources ne termine pas le tour ; ne rien faire est une décision</text>
  <path d="M430,308 L414,308 L414,163 L428,163" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="410" y="236" transform="rotate(-90 410 236)" text-anchor="middle" font-size="10" fill="#6a6152">combattant suivant dans l'ordre</text>

  <!-- 2. Agonie -->
  <text x="20" y="356" font-weight="600" fill="#25201a">2. L'agonie et la mort (EX-CBT-040, EX-CBT-041, EX-CBT-042)</text>
  <text x="30" y="392" font-size="12" font-weight="600" fill="#25201a">PV → 0</text>
  <path d="M84,388 L118,388" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="122" y="374" width="110" height="26" rx="13" fill="#8a2233" fill-opacity="0.15" stroke="#8a2233"/>
  <text x="177" y="391" text-anchor="middle" font-size="12" fill="#25201a">inconscient</text>
  <text x="244" y="391" font-size="10" fill="#6a6152">CombatantStatus::Down : garde sa place, ses tours passent</text>

  <text x="30" y="424" font-size="11" font-weight="600" fill="#25201a">jets de sauvegarde contre la mort, un à chacun de ses tours :</text>
  <g stroke="#3f6b34" fill="#3f6b34" fill-opacity="0.2">
    <rect x="30" y="432" width="24" height="24"/><rect x="58" y="432" width="24" height="24"/><rect x="86" y="432" width="24" height="24"/>
  </g>
  <text x="42" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#3f6b34">✓</text>
  <text x="118" y="449" font-size="12" font-weight="600" fill="#3f6b34">trois ✓ = stabilisé</text>
  <g stroke="#8a2233" fill="#8a2233" fill-opacity="0.2">
    <rect x="260" y="432" width="24" height="24"/><rect x="288" y="432" width="24" height="24"/><rect x="316" y="432" width="24" height="24"/>
  </g>
  <text x="272" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#8a2233">✗</text>
  <text x="348" y="449" font-size="12" font-weight="600" fill="#8a2233">trois ✗ = mort</text>
  <text x="30" y="474" font-size="10" fill="#6a6152">réussites et échecs se comptent chacun de leur côté, dans n'importe quel ordre ; ici 1 ✓ et 1 ✗</text>

  <rect x="30" y="488" width="100" height="24" rx="12" fill="#3f6b34" fill-opacity="0.15" stroke="#3f6b34"/>
  <text x="80" y="504" text-anchor="middle" font-size="11" fill="#25201a">soin &gt; 0 PV</text>
  <path d="M130,500 L158,500" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="164" y="504" font-size="11" fill="#25201a">la piste revient à zéro et le personnage est conscient (EX-CBT-041)</text>
  <text x="30" y="526" font-size="10" fill="#6a6152">aucun échec ne se reporte d'une agonie à la suivante : la seconde chute n'est pas fatale d'avance</text>

  <rect x="580" y="372" width="280" height="160" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="590" y="392" font-size="12" font-weight="600" fill="#25201a">Mort hors combat (EX-CBT-042)</text>
  <g font-size="11" fill="#25201a">
    <text x="590" y="412">un effet défini, un seul, et ce n'est pas</text>
    <text x="590" y="428">« recommencer le niveau » : le monde est</text>
    <text x="590" y="444">ouvert : pas de niveau à recommencer.</text>
  </g>
  <g font-size="10" fill="#6a6152">
    <text x="590" y="468">EX-GP-031 et EX-GP-032 sont retirées ;</text>
    <text x="590" y="482">deux définitions qui coexistent, c'est</text>
    <text x="590" y="496">la plus ancienne qui gagne.</text>
    <text x="590" y="520">agonie et conditions : LOT-137, à venir.</text>
  </g>

  <!-- Légende -->
  <g fill="#6a6152" font-size="12">
    <text x="20" y="556">La bascule ne change que le temps, pas le lieu : même carte, même case, grille tirée de la collision. Le tour tient sur</text>
    <text x="20" y="570">quatre ressources rendues au début du tour de leur porteur, et ne finit que sur décision. L'agonie fait de la chute un</text>
    <text x="20" y="584">compte à rebours lisible, remis à zéro par un soin, pour que relever un allié garde tout son intérêt.</text>
  </g>
</svg>
