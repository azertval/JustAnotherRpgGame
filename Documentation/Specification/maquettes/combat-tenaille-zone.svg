<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="420" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — la prise en tenaille et les zones d'effet sur la grille</text>

  <text x="20" y="56" font-weight="600" fill="#25201a">1. La tenaille (règle optionnelle du Guide du Maître, LOT-23)</text>
  <g transform="translate(20,68)">
    <g stroke="#d6c9a8" fill="#fbf8f0">
      <rect x="0" y="0" width="200" height="200"/>
      <path d="M40,0v200M80,0v200M120,0v200M160,0v200M0,40h200M0,80h200M0,120h200M0,160h200"/>
    </g>
    <circle cx="60" cy="100" r="13" fill="#3f6b34"/><text x="55" y="104" font-size="10" fill="#fbf8f0">H</text>
    <circle cx="140" cy="100" r="13" fill="#3f6b34"/><text x="135" y="104" font-size="10" fill="#fbf8f0">C</text>
    <circle cx="100" cy="100" r="13" fill="#8a2233"/><text x="95" y="104" font-size="10" fill="#fbf8f0">A</text>
    <path d="M60,100 L140,100" stroke="#9a7420" stroke-width="2"/>
    <rect x="80" y="80" width="40" height="40" fill="none" stroke="#9a7420" stroke-width="2"/>
    <text x="8" y="188" font-size="10" fill="#3f6b34">tenaille : la ligne H–C sort de la case d'A par deux côtés opposés → avantage</text>
  </g>
  <g transform="translate(250,68)">
    <g stroke="#d6c9a8" fill="#fbf8f0">
      <rect x="0" y="0" width="200" height="200"/>
      <path d="M40,0v200M80,0v200M120,0v200M160,0v200M0,40h200M0,80h200M0,120h200M0,160h200"/>
    </g>
    <circle cx="60" cy="100" r="13" fill="#3f6b34"/><text x="55" y="104" font-size="10" fill="#fbf8f0">H</text>
    <circle cx="100" cy="60" r="13" fill="#3f6b34"/><text x="95" y="64" font-size="10" fill="#fbf8f0">C</text>
    <circle cx="100" cy="100" r="13" fill="#8a2233"/><text x="95" y="104" font-size="10" fill="#fbf8f0">A</text>
    <path d="M60,100 L100,60" stroke="#6a6152" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="80" y="80" width="40" height="40" fill="none" stroke="#6a6152" stroke-width="2"/>
    <text x="8" y="188" font-size="10" fill="#6a6152">pas de tenaille : la ligne coupe deux côtés adjacents</text>
  </g>
  <g fill="#25201a" font-size="12">
    <text x="480" y="90">Deux alliés de part et d'autre d'une cible</text>
    <text x="480" y="106">lui donnent l'avantage au corps à corps.</text>
    <text x="480" y="122">Le test est géométrique et déterministe :</text>
    <text x="480" y="138">la ligne entre les centres des deux cases</text>
    <text x="480" y="154">alliées traverse la case de la cible par</text>
    <text x="480" y="170">deux côtés (ou coins) opposés.</text>
    <text x="480" y="198" fill="#6a6152" font-size="11">Une créature de grande taille s'évalue sur</text>
    <text x="480" y="214" fill="#6a6152" font-size="11">son emprise entière ; un allié inconscient</text>
    <text x="480" y="230" fill="#6a6152" font-size="11">ne compte pas (core::isFlanking).</text>
    <text x="480" y="254" fill="#6a6152" font-size="11">L'IA en profite comme le joueur : mêmes</text>
    <text x="480" y="270" fill="#6a6152" font-size="11">actions, mêmes informations (EX-CBT-050).</text>
  </g>

  <text x="20" y="300" font-weight="600" fill="#25201a">2. Les zones d'effet : une case est couverte si la forme en prend au moins la moitié (LOT-22)</text>
  <g transform="translate(20,312)">
    <g stroke="#d6c9a8" fill="#fbf8f0">
      <rect x="0" y="0" width="200" height="100"/>
      <path d="M20,0v100M40,0v100M60,0v100M80,0v100M100,0v100M120,0v100M140,0v100M160,0v100M180,0v100M0,20h200M0,40h200M0,60h200M0,80h200"/>
    </g>
    <g fill="#8a2233" fill-opacity="0.3"><rect x="20" y="40" width="20" height="20"/><rect x="40" y="20" width="20" height="60"/><rect x="60" y="20" width="20" height="60"/><rect x="80" y="0" width="20" height="100"/><rect x="100" y="0" width="20" height="100"/></g>
    <path d="M10,50 L120,0 M10,50 L120,100" stroke="#8a2233" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="5" fill="#3f6b34"/>
    <text x="126" y="56" font-size="10" fill="#8a2233">cône (4,5 m = 3 cases)</text>
  </g>
  <g transform="translate(250,312)">
    <g stroke="#d6c9a8" fill="#fbf8f0">
      <rect x="0" y="0" width="200" height="100"/>
      <path d="M20,0v100M40,0v100M60,0v100M80,0v100M100,0v100M120,0v100M140,0v100M160,0v100M180,0v100M0,20h200M0,40h200M0,60h200M0,80h200"/>
    </g>
    <g fill="#2f7f86" fill-opacity="0.3"><rect x="80" y="20" width="60" height="60"/><rect x="60" y="40" width="20" height="20"/><rect x="140" y="40" width="20" height="20"/><rect x="100" y="0" width="20" height="20"/><rect x="100" y="80" width="20" height="20"/></g>
    <circle cx="110" cy="50" r="42" fill="none" stroke="#2f7f86" stroke-width="1.5"/>
    <circle cx="110" cy="50" r="3" fill="#25201a"/>
    <text x="4" y="14" font-size="10" fill="#2f7f86">sphère : origine à un coin ou un centre de case</text>
  </g>
  <g fill="#25201a" font-size="12">
    <text x="480" y="326">Cinq formes du Manuel : cône, cube,</text>
    <text x="480" y="342">cylindre, ligne, sphère (core::AreaShape).</text>
    <text x="480" y="358">Le gabarit se calcule en cases ; puis les</text>
    <text x="480" y="374">cases qu'aucune ligne droite ne relie à</text>
    <text x="480" y="390">l'origine sont retirées : un mur protège</text>
    <text x="480" y="406">de la boule de feu (core::affectedCells).</text>
  </g>
</svg>
