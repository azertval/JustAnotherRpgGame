<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="620" fill="#fbf8f0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — le jet de d20 : son anatomie, l'avantage et le désavantage, trois jets pour un mécanisme</text>

  <!-- 1. Anatomie d'un jet -->
  <text x="20" y="50" font-weight="600" fill="#25201a">1. L'anatomie d'un jet : d20 + modificateurs (avec leur origine) ≥ seuil → réussite (EX-REG-001)</text>
  <g transform="translate(0,0)">
    <polygon points="40,92 62,64 84,92 62,120" fill="#fbf8f0" stroke="#25201a" stroke-width="1.5"/>
    <text x="62" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#25201a">12</text>
    <text x="62" y="134" text-anchor="middle" font-size="10" fill="#6a6152">le dé obtenu</text>

    <text x="96" y="98" font-size="16" fill="#25201a">+</text>
    <rect x="112" y="72" width="96" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="160" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#25201a">+3</text>
    <text x="160" y="105" text-anchor="middle" font-size="11" fill="#25201a">Force</text>
    <text x="160" y="134" text-anchor="middle" font-size="10" fill="#6a6152">caractéristique</text>

    <text x="220" y="98" font-size="16" fill="#25201a">+</text>
    <rect x="236" y="72" width="120" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="296" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#25201a">+2</text>
    <text x="296" y="105" text-anchor="middle" font-size="11" fill="#25201a">maîtrise</text>
    <text x="296" y="134" text-anchor="middle" font-size="10" fill="#6a6152">entière ou nulle</text>
    <text x="296" y="146" text-anchor="middle" font-size="10" fill="#6a6152">(EX-REG-011)</text>

    <text x="368" y="98" font-size="16" fill="#25201a">+</text>
    <rect x="384" y="72" width="120" height="40" rx="6" fill="#fbf8f0" stroke="#d6c9a8" stroke-dasharray="4 3"/>
    <text x="444" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#6a6152">±0</text>
    <text x="444" y="105" text-anchor="middle" font-size="11" fill="#6a6152">situation</text>
    <text x="444" y="134" text-anchor="middle" font-size="10" fill="#6a6152">abri, condition…</text>

    <text x="516" y="98" font-size="16" fill="#25201a">=</text>
    <circle cx="552" cy="92" r="20" fill="#9a7420"/>
    <text x="552" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="#fbf8f0">17</text>
    <text x="552" y="134" text-anchor="middle" font-size="10" fill="#6a6152">total</text>

    <text x="584" y="98" font-size="16" fill="#25201a">≥</text>
    <rect x="604" y="72" width="100" height="40" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="654" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#25201a">15</text>
    <text x="654" y="105" text-anchor="middle" font-size="11" fill="#25201a">CA de la cible</text>
    <text x="654" y="134" text-anchor="middle" font-size="10" fill="#6a6152">seuil : CA ou DD</text>

    <path d="M712,92 L740,92" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="748" y="97" font-size="14" font-weight="600" fill="#3f6b34">touche</text>
    <text x="748" y="134" font-size="10" fill="#6a6152">total ≥ seuil</text>
  </g>
  <rect x="20" y="158" width="840" height="44" rx="6" fill="#25201a"/>
  <text x="32" y="176" font-size="12" font-weight="600" fill="#ece4d1">Restitution en une ligne (EX-REG-003) — le dé, les modificateurs et leur origine, le seuil, l'issue :</text>
  <text x="32" y="194" font-family="Consolas, monospace" font-size="13" fill="#fbf8f0">12 + 3 (Force) + 2 (maîtrise) = 17 contre CA 15 : touche</text>

  <!-- 2. Avantage / désavantage -->
  <text x="20" y="228" font-weight="600" fill="#25201a">2. Avantage et désavantage : deux d20, on garde le meilleur ou le pire ; ils ne se cumulent pas (EX-REG-002)</text>
  <g>
    <text x="20" y="273" font-size="12" font-weight="600" fill="#25201a">Avantage</text>
    <polygon points="102,268 120,246 138,268 120,290" fill="#fbf8f0" stroke="#25201a" stroke-width="1.5"/>
    <text x="120" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#6a6152">7</text>
    <polygon points="152,268 170,246 188,268 170,290" fill="#9a7420" stroke="#25201a" stroke-width="1.5"/>
    <text x="170" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#fbf8f0">14</text>
    <text x="204" y="273" font-size="12" fill="#3f6b34">→ on garde 14, le meilleur</text>

    <text x="20" y="329" font-size="12" font-weight="600" fill="#25201a">Désavantage</text>
    <polygon points="102,324 120,302 138,324 120,346" fill="#9a7420" stroke="#25201a" stroke-width="1.5"/>
    <text x="120" y="329" text-anchor="middle" font-size="14" font-weight="600" fill="#fbf8f0">7</text>
    <polygon points="152,324 170,302 188,324 170,346" fill="#fbf8f0" stroke="#25201a" stroke-width="1.5"/>
    <text x="170" y="329" text-anchor="middle" font-size="14" font-weight="600" fill="#6a6152">14</text>
    <text x="204" y="329" font-size="12" fill="#8a2233">→ on garde 7, le pire</text>

    <text x="20" y="370" font-size="11" fill="#6a6152">Les deux dés restent visibles ; le dé retenu est celui</text>
    <text x="20" y="384" font-size="11" fill="#6a6152">qu'on lit pour le 20 et le 1 naturels, jamais le total.</text>
  </g>
  <g>
    <rect x="420" y="244" width="440" height="22" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="430" y="259" font-size="11" font-weight="600" fill="#25201a">sources d'avantage</text>
    <text x="575" y="259" font-size="11" font-weight="600" fill="#25201a">de désavantage</text>
    <text x="705" y="259" font-size="11" font-weight="600" fill="#25201a">posture appliquée</text>
    <g stroke="#d6c9a8"><path d="M420,290h440M420,314h440M420,338h440M420,362h440"/></g>
    <rect x="420" y="266" width="440" height="96" fill="none" stroke="#d6c9a8"/>
    <g font-size="12" fill="#25201a">
      <text x="480" y="283" text-anchor="middle">2</text><text x="630" y="283" text-anchor="middle">0</text>
      <text x="705" y="283" font-size="11" fill="#3f6b34">avantage, un seul</text>
      <text x="480" y="307" text-anchor="middle">1</text><text x="630" y="307" text-anchor="middle">1</text>
      <text x="705" y="307" font-size="11">normal : annulés</text>
      <text x="480" y="331" text-anchor="middle">3</text><text x="630" y="331" text-anchor="middle">1</text>
      <text x="705" y="331" font-size="11">normal : rien ne reste</text>
      <text x="480" y="355" text-anchor="middle">0</text><text x="630" y="355" text-anchor="middle">2</text>
      <text x="705" y="355" font-size="11" fill="#8a2233">désavantage, un seul</text>
    </g>
    <text x="420" y="380" font-size="11" fill="#6a6152">La règle annule, elle ne compte pas : trois avantages et un</text>
    <text x="420" y="394" font-size="11" fill="#6a6152">désavantage donnent un jet normal, sans pile de bonus à arbitrer.</text>
  </g>

  <!-- 3. Trois jets, une échelle -->
  <text x="20" y="418" font-weight="600" fill="#25201a">3. Trois jets pour un mécanisme (EX-REG-020) ; le seuil vient d'une échelle nommée, en donnée (EX-REG-021)</text>
  <g>
    <rect x="20" y="430" width="176" height="100" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="28" y="448" font-size="12" font-weight="600" fill="#25201a">Test de caractéristique</text>
    <text x="28" y="464" font-size="11" font-style="italic" fill="#6a6152">le personnage tente</text>
    <text x="28" y="484" font-size="11" fill="#25201a">caractéristique</text>
    <text x="28" y="498" font-size="11" fill="#25201a">+ maîtrise de compétence</text>
    <text x="28" y="512" font-size="11" fill="#2f7f86">seuil : degré de difficulté</text>

    <rect x="204" y="430" width="176" height="100" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="212" y="448" font-size="12" font-weight="600" fill="#25201a">Jet de sauvegarde</text>
    <text x="212" y="464" font-size="11" font-style="italic" fill="#6a6152">le personnage subit</text>
    <text x="212" y="484" font-size="11" fill="#25201a">caractéristique</text>
    <text x="212" y="498" font-size="11" fill="#25201a">+ maîtrise de sauvegarde</text>
    <text x="212" y="512" font-size="11" fill="#2f7f86">seuil : DD de l'effet subi</text>

    <rect x="388" y="430" width="176" height="100" rx="6" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="396" y="448" font-size="12" font-weight="600" fill="#25201a">Jet d'attaque</text>
    <text x="396" y="464" font-size="11" font-style="italic" fill="#6a6152">le personnage vise</text>
    <text x="396" y="484" font-size="11" fill="#25201a">caractéristique de l'arme</text>
    <text x="396" y="498" font-size="11" fill="#25201a">+ maîtrise de l'arme</text>
    <text x="396" y="512" font-size="11" fill="#2f7f86">seuil : classe d'armure</text>

    <text x="20" y="550" font-size="11" fill="#3f6b34">partagé : le mécanisme, d20 + modificateurs ≥ seuil (EX-REG-001)</text>
    <text x="20" y="564" font-size="11" fill="#8a2233">distinct : les modificateurs — améliorer les sauvegardes ne touche pas aux attaques</text>
  </g>
  <g>
    <text x="590" y="444" font-size="12" font-weight="600" fill="#25201a">Échelle nommée (<tspan font-family="Consolas, monospace">rules/difficulty.json</tspan>)</text>
    <g font-size="11" fill="#25201a">
      <text x="590" y="461">Très facile</text>
      <text x="590" y="478">Facile</text>
      <text x="590" y="495">Moyenne</text>
      <text x="590" y="512">Difficile</text>
      <text x="590" y="529">Très difficile</text>
      <text x="590" y="546">Quasi impossible</text>
    </g>
    <g fill="#2f7f86" fill-opacity="0.3" stroke="#2f7f86" stroke-width="0.8">
      <rect x="700" y="451" width="20" height="13"/>
      <rect x="700" y="468" width="40" height="13"/>
      <rect x="700" y="485" width="60" height="13"/>
      <rect x="700" y="502" width="80" height="13"/>
      <rect x="700" y="519" width="100" height="13"/>
      <rect x="700" y="536" width="120" height="13"/>
    </g>
    <g font-size="11" font-family="Consolas, monospace" fill="#25201a">
      <text x="726" y="461">5</text>
      <text x="746" y="478">10</text>
      <text x="766" y="495">15</text>
      <text x="786" y="512">20</text>
      <text x="806" y="529">25</text>
      <text x="826" y="546">30</text>
    </g>
    <text x="590" y="564" font-size="10" fill="#6a6152">« moyenne » en donnée, jamais un 15 nu dans le code</text>
  </g>

  <!-- Légende -->
  <g fill="#6a6152" font-size="12">
    <text x="20" y="580">La maquette montre un mécanisme unique, restituable en une ligne, et deux règles qui le tiennent stable : l'annulation</text>
    <text x="20" y="594">de l'avantage, qui évite d'arbitrer une pile de bonus, et le seuil pris dans une échelle nommée, réglable sans recompiler.</text>
    <text x="20" y="608">Les trois jets ne diffèrent que par leurs modificateurs : améliorer les sauvegardes ne doit pas améliorer les attaques.</text>
  </g>
</svg>
