<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="520" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — l'affichage tête haute en exploration (fenêtre 16:9, charte v2)</text>

  <rect x="20" y="36" width="704" height="396" fill="#ece4d1" stroke="#25201a"/>
  <g stroke="#d6c9a8" fill="none">
    <path d="M372,120 l120,74 l-120,74 l-120,-74 z"/><path d="M252,194 l120,74 l-120,74 l-120,-74 z"/><path d="M492,194 l120,74 l-120,74 l-120,-74 z"/>
    <path d="M372,268 l120,74 l-120,74 l-120,-74 z"/><path d="M312,157 l60,37 l-60,37 l-60,-37 z"/><path d="M432,157 l60,37 l-60,37 l-60,-37 z"/>
    <path d="M312,231 l60,37 l-60,37 l-60,-37 z"/><path d="M432,231 l60,37 l-60,37 l-60,-37 z"/><path d="M372,194 l60,37 l-60,37 l-60,-37 z"/>
    <path d="M372,305 l60,37 l-60,37 l-60,-37 z"/><path d="M312,305 l60,37 l-60,37 l-60,-37 z"/><path d="M432,305 l60,37 l-60,37 l-60,-37 z"/>
  </g>
  <circle cx="372" cy="262" r="9" fill="#3f6b34"/>
  <text x="386" y="258" font-size="11" fill="#6a6152">héros (scène : échelle du lieu)</text>

  <circle cx="62" cy="80" r="26" fill="#25201a" stroke="#9a7420" stroke-width="2"/>
  <rect x="96" y="58" width="130" height="14" fill="#25201a" stroke="#9a7420"/>
  <text x="102" y="69" font-size="10" fill="#fbf8f0">Brenna Vaugris · Niv. 3</text>
  <rect x="96" y="78" width="130" height="8" fill="#25201a" stroke="#9a7420"/><rect x="97" y="79" width="96" height="6" fill="#8a2233"/>
  <rect x="96" y="90" width="130" height="8" fill="#25201a" stroke="#9a7420"/><rect x="97" y="91" width="60" height="6" fill="#2f7f86"/>
  <text x="232" y="86" font-size="10" fill="#25201a">PV 32/32</text>
  <text x="232" y="98" font-size="10" fill="#25201a">emplacements</text>

  <rect x="290" y="50" width="164" height="14" fill="#25201a" stroke="#9a7420"/>
  <text x="300" y="61" font-size="10" fill="#fbf8f0">O</text><text x="368" y="61" font-size="10" fill="#9a7420" font-weight="600">N</text><text x="438" y="61" font-size="10" fill="#fbf8f0">E</text>

  <circle cx="660" cy="86" r="34" fill="#25201a" stroke="#9a7420" stroke-width="2"/>
  <circle cx="660" cy="86" r="3" fill="#3f6b34"/>
  <text x="640" y="132" font-size="10" fill="#25201a">mini-carte</text>

  <g fill="#25201a" stroke="#9a7420" opacity="0.45">
    <rect x="36" y="140" width="34" height="34"/><rect x="36" y="184" width="34" height="34"/><rect x="36" y="228" width="34" height="34"/>
  </g>
  <text x="76" y="200" font-size="10" fill="#6a6152">groupe : réservé, rempli à la 0.0.2</text>

  <rect x="580" y="150" width="130" height="90" fill="#25201a" stroke="#9a7420"/>
  <text x="588" y="166" font-size="11" fill="#9a7420" font-weight="600">Quêtes</text>
  <text x="588" y="186" font-size="10" fill="#fbf8f0">◆ Des pommes pour l'arène</text>
  <text x="596" y="202" font-size="10" fill="#d6c9a8">trouver la mère à Martpart</text>

  <rect x="36" y="330" width="220" height="60" fill="#25201a" stroke="#9a7420"/>
  <text x="44" y="346" font-size="10" fill="#fbf8f0">Vous entrez dans Arenarea.</text>
  <text x="44" y="362" font-size="10" fill="#fbf8f0">Le portier vous salue.</text>
  <rect x="36" y="398" width="220" height="16" fill="#25201a" stroke="#9a7420"/>
  <text x="44" y="410" font-size="10" fill="#d6c9a8">E : parler · Échap : pause</text>

  <g fill="#25201a" stroke="#9a7420"><rect x="560" y="352" width="24" height="24"/><rect x="592" y="352" width="24" height="24"/><rect x="624" y="352" width="24" height="24"/><rect x="656" y="352" width="24" height="24"/></g>
  <text x="560" y="392" font-size="10" fill="#25201a">Fiche · Sac · Journal · Options</text>
  <rect x="560" y="402" width="150" height="16" fill="#25201a" stroke="#9a7420"/>
  <text x="572" y="414" font-size="10" fill="#9a7420" font-weight="600">EXPLORATION</text><text x="656" y="414" font-size="10" fill="#6a6152">· Tactique</text>

  <g fill="#8a2233" font-weight="600" font-size="12">
    <text x="24" y="52">1</text><text x="278" y="48">2</text><text x="704" y="52">3</text><text x="24" y="150">4</text><text x="566" y="146">5</text><text x="24" y="326">6</text><text x="548" y="348">7</text>
  </g>

  <g fill="#25201a" font-size="12">
    <text x="740" y="60" font-weight="600">Ce que le joueur lit</text>
    <text x="740" y="80"><tspan fill="#8a2233" font-weight="600">1</tspan> portrait, niveau, points de vie</text>
    <text x="740" y="98"><tspan fill="#8a2233" font-weight="600">2</tspan> orientation du héros</text>
    <text x="740" y="116"><tspan fill="#8a2233" font-weight="600">3</tspan> mini-carte du lieu</text>
    <text x="740" y="134"><tspan fill="#8a2233" font-weight="600">4</tspan> compagnons (0.0.2)</text>
    <text x="740" y="152"><tspan fill="#8a2233" font-weight="600">5</tspan> quête suivie, étape en cours</text>
    <text x="740" y="170"><tspan fill="#8a2233" font-weight="600">6</tspan> journal et aide contextuelle</text>
    <text x="740" y="188"><tspan fill="#8a2233" font-weight="600">7</tspan> écrans du RPG, mode courant</text>
  </g>
  <g fill="#6a6152" font-size="11">
    <text x="740" y="220">Deux échelles (EX-VIS-009) :</text>
    <text x="740" y="236">la scène suit le lieu,</text>
    <text x="740" y="252">l'interface suit la fenêtre.</text>
    <text x="740" y="282">Aucun réglage inopérant</text>
    <text x="740" y="298">(EX-IHM-072) : une case vide</text>
    <text x="740" y="314">est réservée, pas grisée.</text>
    <text x="740" y="344">Barre d'action : absente</text>
    <text x="740" y="360">en exploration, elle paraît</text>
    <text x="740" y="376">avec le combat.</text>
  </g>

  <g fill="#6a6152" font-size="11">
    <text x="20" y="456">Comparer à la capture réelle (jeu-gameview.jpg) : le châssis de la charte v2 est en place, les jauges vides ; le lieu n'est pas</text>
    <text x="20" y="472">encore joué (base vide depuis le LOT-102). La maquette dit ce que chaque cadre doit porter, pas où il est au pixel près :</text>
    <text x="20" y="488">la disposition se règle dans Qt Design Studio (EX-IHM-100), la maquette fixe le contenu et le critère « ce dont le joueur</text>
    <text x="20" y="504">a besoin pour décider » (EX-IHM-003).</text>
  </g>
</svg>
