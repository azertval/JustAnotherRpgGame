  <g fill="#6a6152" font-size="11">
    <text x="20" y="530">Comparer à la capture réelle (editeur-fenetre.jpg) : la fenêtre existe avec ces six panneaux ; elle s'ouvre aujourd'hui sur une carte vierge,</text>
    <text x="20" y="546">sans lieu (base vide, LOT-102), et sa palette « Pieces » attend les planches HD (LOT-105 à LOT-110). La maquette montre l'éditeur avec une</text>
    <text x="20" y="562">carte de quartier ouverte : ce qu'il doit montrer et signaler, pas son style — outil interne, style Fusion, textes anglais (décision D7).</text>
    <text x="20" y="578">Le canevas montre la carte comme le jeu la joue (EX-EDIT-059) ; le losange sous le pointeur désigne la case, pas l'image (EX-EDIT-060).</text>
  </g>
