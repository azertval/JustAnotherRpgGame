<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="500" fill="#fbf8f0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — emplacements typés, inventaire par identifiants, armure et charge dérivées</text>

  <!-- Emplacements typés -->
  <text x="20" y="48" font-size="12" font-weight="600" fill="#25201a">Emplacements typés (EX-INV-010)</text>
  <g font-size="11" fill="#25201a">
    <g fill="#fbf8f0" stroke="#d6c9a8">
      <rect x="20" y="60" width="104" height="20"/><rect x="20" y="84" width="104" height="20"/>
      <rect x="20" y="108" width="104" height="20"/>
      <rect x="20" y="156" width="104" height="20"/><rect x="20" y="180" width="104" height="20"/>
      <rect x="20" y="204" width="104" height="20"/><rect x="20" y="228" width="104" height="20"/>
      <rect x="196" y="108" width="104" height="20"/><rect x="196" y="132" width="104" height="20"/>
      <rect x="196" y="156" width="104" height="20"/><rect x="196" y="180" width="104" height="20"/>
      <rect x="196" y="204" width="104" height="20"/><rect x="196" y="228" width="104" height="20"/>
    </g>
    <rect x="20" y="132" width="104" height="20" fill="#2f7f86" fill-opacity="0.18" stroke="#2f7f86"/>
    <rect x="196" y="60" width="104" height="20" fill="#8a2233" fill-opacity="0.18" stroke="#8a2233"/>
    <rect x="196" y="84" width="104" height="20" fill="#8a2233" fill-opacity="0.18" stroke="#8a2233"/>
    <text x="24" y="74">tête</text><text x="24" y="98">cou</text><text x="24" y="122">cape</text>
    <text x="24" y="146">torse</text><text x="24" y="170">ceinture</text><text x="24" y="194">mains</text>
    <text x="24" y="218">anneau gauche</text><text x="24" y="242">anneau droit</text>
    <text x="200" y="74">main principale</text><text x="200" y="98">main secondaire</text>
    <text x="200" y="122">arme à distance</text><text x="200" y="146">munitions</text>
    <text x="200" y="170">pieds</text><text x="200" y="194">brassards</text>
    <text x="200" y="218">bourse</text><text x="200" y="242">babiole</text>
  </g>
  <!-- silhouette -->
  <g stroke="#6a6152" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="160" cy="76" r="11" fill="#ece4d1"/>
    <rect x="146" y="90" width="28" height="52" rx="6" fill="#ece4d1"/>
    <path d="M146,96 L132,132 M174,96 L188,132"/>
    <path d="M151,142 L149,188 M169,142 L171,188"/>
  </g>
  <g stroke="#d6c9a8" stroke-width="1">
    <path d="M124,70 L149,72"/>
    <path d="M124,142 L146,130"/>
    <path d="M196,70 L188,126"/>
    <path d="M196,94 L136,130"/>
  </g>
  <!-- la règle des deux mains -->
  <rect x="20" y="266" width="280" height="84" rx="6" fill="#fbf8f0" stroke="#8a2233" stroke-dasharray="4 3"/>
  <text x="28" y="284" font-size="11" font-weight="600" fill="#25201a">L'objet déclare lui-même ce qu'il occupe</text>
  <text x="28" y="300" font-family="Consolas, monospace" font-size="10" fill="#25201a">epee-a-deux-mains : "two-handed"</text>
  <text x="28" y="316" font-size="11" fill="#25201a">→ occupe main principale + main secondaire</text>
  <text x="28" y="332" font-size="11" fill="#8a2233">→ bouclier impossible, sans règle par arme</text>
  <text x="28" y="346" font-size="10" fill="#6a6152">armure → torse ; bouclier → main secondaire</text>
  <g font-size="10" fill="#6a6152">
    <text x="20" y="370">core::EquipmentSlot, seize noms de la donnée :</text>
    <text x="20" y="383" font-family="Consolas, monospace">head, neck, cloak, torso, belt, hands,</text>
    <text x="20" y="396" font-family="Consolas, monospace">ring-left, ring-right, main-hand, off-hand,</text>
    <text x="20" y="409" font-family="Consolas, monospace">ranged, ammunition, feet, bracers,</text>
    <text x="20" y="422" font-family="Consolas, monospace">pouch, trinket.</text>
  </g>

  <!-- Inventaire : une liste d'identifiants -->
  <text x="320" y="48" font-size="12" font-weight="600" fill="#25201a">L'inventaire, une liste (EX-INV-001)</text>
  <rect x="320" y="58" width="240" height="20" fill="#ece4d1" stroke="#d6c9a8"/>
  <g font-size="10" fill="#25201a">
    <text x="326" y="72">identifiant (catalogue)</text>
    <text x="454" y="72">quantité</text>
    <text x="512" y="72">état</text>
  </g>
  <rect x="320" y="78" width="240" height="110" fill="#fbf8f0" stroke="#d6c9a8"/>
  <g stroke="#d6c9a8"><path d="M320,100h240M320,122h240M320,144h240M320,166h240"/></g>
  <g font-family="Consolas, monospace" font-size="10" fill="#25201a">
    <text x="326" y="93">epee-longue</text>
    <text x="326" y="115">bouclier</text>
    <text x="326" y="137">cotte-de-mailles</text>
    <text x="326" y="159">potion-de-guerison</text>
    <text x="326" y="181">torche</text>
  </g>
  <g font-size="10" fill="#25201a" text-anchor="middle">
    <text x="474" y="93">1</text><text x="474" y="115">1</text><text x="474" y="137">1</text>
    <text x="474" y="159">3</text><text x="474" y="181">5</text>
  </g>
  <g font-size="10" fill="#6a6152">
    <text x="512" y="93">porté</text><text x="512" y="115">porté</text><text x="512" y="137">porté</text>
    <text x="512" y="159">sac</text><text x="512" y="181">sac</text>
  </g>
  <text x="320" y="212" font-size="11" font-weight="600" fill="#25201a">Jamais une copie des propriétés :</text>
  <rect x="320" y="220" width="240" height="70" rx="6" fill="#fbf8f0" stroke="#9a7420" stroke-width="1.5"/>
  <g font-family="Consolas, monospace" font-size="10" fill="#25201a">
    <text x="330" y="238">weapons/epee-longue.json</text>
    <text x="330" y="254">price : 1500 → <tspan fill="#8a2233" font-weight="600">1200</tspan></text>
    <text x="330" y="270">damage : 1d8 slashing</text>
  </g>
  <text x="330" y="284" font-size="9" fill="#6a6152">une seule source de vérité par objet</text>
  <path d="M326,86 L310,86 L310,236 L318,236" stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <g font-size="11" fill="#25201a">
    <text x="320" y="310">Corriger le prix ici corrige toutes les</text>
    <text x="320" y="324">épées du monde, y compris celles déjà</text>
    <text x="320" y="338">ramassées et sauvegardées.</text>
  </g>
  <g font-size="10" fill="#6a6152">
    <text x="320" y="362">le sac : (itemId, quantity) ; l'équipement :</text>
    <text x="320" y="375">un identifiant par emplacement (Inventory).</text>
  </g>

  <!-- Classe d'armure dérivée -->
  <text x="580" y="48" font-size="12" font-weight="600" fill="#25201a">Classe d'armure dérivée (EX-INV-011)</text>
  <rect x="580" y="58" width="280" height="24" rx="4" fill="#25201a"/>
  <text x="588" y="74" font-size="11" fill="#fbf8f0">CA = base + Dex plafonnée + bouclier</text>
  <g font-size="10" fill="#6a6152">
    <text x="580" y="98">armure</text><text x="680" y="98">base</text><text x="708" y="98">Dex</text>
    <text x="760" y="98">Force</text><text x="800" y="98">discrétion</text>
  </g>
  <g stroke="#d6c9a8"><path d="M580,102h280"/></g>
  <g font-size="10" fill="#25201a">
    <text x="580" y="116">cuir</text><text x="680" y="116">11</text><text x="708" y="116">+ Dex</text><text x="760" y="116">—</text><text x="800" y="116">—</text>
    <text x="580" y="132">demi-plate</text><text x="680" y="132">15</text><text x="708" y="132">max +2</text><text x="760" y="132">—</text><text x="800" y="132" fill="#8a2233">désavantage</text>
    <text x="580" y="148">cotte de mailles</text><text x="680" y="148">16</text><text x="708" y="148">non</text><text x="760" y="148">13</text><text x="800" y="148" fill="#8a2233">désavantage</text>
    <text x="580" y="164">bouclier</text><text x="680" y="164">+2</text><text x="708" y="164">—</text><text x="760" y="164">—</text><text x="800" y="164">—</text>
  </g>
  <text x="580" y="184" font-size="11" fill="#25201a">recalculée à chaque changement (EX-RPG-002),</text>
  <text x="580" y="198" font-size="11" fill="#25201a">jamais ± 2 à l'équipement et au retrait.</text>
  <text x="580" y="212" font-size="10" fill="#6a6152">sans armure : base lue dans la donnée (10) + Dex</text>

  <!-- Encombrement dérivé -->
  <text x="580" y="236" font-size="12" font-weight="600" fill="#25201a">Encombrement dérivé (EX-INV-020)</text>
  <text x="689" y="252" text-anchor="middle" font-size="10" fill="#25201a">porté : 41 kg (Force 14) → encombré</text>
  <polygon points="684,256 694,256 689,264" fill="#25201a"/>
  <rect x="580" y="266" width="280" height="16" fill="#fbf8f0" stroke="#d6c9a8"/>
  <rect x="580" y="266" width="93" height="16" fill="#3f6b34" fill-opacity="0.3"/>
  <rect x="673" y="266" width="94" height="16" fill="#9a7420" fill-opacity="0.3"/>
  <rect x="767" y="266" width="93" height="16" fill="#8a2233" fill-opacity="0.3"/>
  <g stroke="#6a6152"><path d="M673,262v24M767,262v24"/></g>
  <g font-size="10" fill="#25201a">
    <text x="580" y="298">0</text>
    <text x="673" y="298" text-anchor="middle">encombré : −3 m</text>
    <text x="770" y="298">fortement : −6 m</text>
    <text x="673" y="310" text-anchor="middle">2,5 kg × Force</text>
    <text x="770" y="310">5 kg × Force</text>
  </g>
  <text x="860" y="324" text-anchor="end" font-size="10" fill="#6a6152">capacité : 7,5 kg × Force (rules/encumbrance.json)</text>
  <text x="580" y="344" font-size="11" fill="#25201a">Force 14 : encombré à 35 kg, fortement à 70 kg,</text>
  <text x="580" y="358" font-size="11" fill="#25201a">capacité 105 kg. Montré avant de contraindre.</text>
  <text x="580" y="374" font-size="10" fill="#6a6152">fortement encombré : désavantage aux jets aussi.</text>
  <text x="580" y="388" font-size="10" fill="#6a6152">niveaux : Unencumbered, Encumbered,</text>
  <text x="580" y="401" font-size="10" fill="#6a6152">HeavilyEncumbered, OverCapacity.</text>

  <!-- Légende -->
  <g fill="#6a6152" font-size="12">
    <text x="20" y="456">Le personnage ne porte que des identifiants de catalogue, dans des emplacements que l'objet déclare ; tout ce qui a une valeur</text>
    <text x="20" y="470">— prix, classe d'armure, poids — est relu ou recalculé à la demande. Une valeur qu'on ne stocke pas ne peut ni dériver ni se</text>
    <text x="20" y="484">désynchroniser du catalogue, et l'encombrement se lit sur une jauge avant de ralentir : la règle ne surprend jamais le joueur.</text>
  </g>
</svg>
