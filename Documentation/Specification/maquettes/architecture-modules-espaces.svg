<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Georgia, serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/></marker></defs>
  <rect width="880" height="600" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Schéma — modules, exécutables et les trois espaces de coordonnées (EX-ARCH-001, 020, 021, 022)</text>

  <g fill="#25201a">
    <rect x="40" y="50" width="250" height="44" fill="#ece4d1" stroke="#25201a"/>
    <text x="48" y="67" font-size="12" font-weight="600">JustAnotherRpgGame — Qt Quick</text>
    <text x="48" y="83" font-size="10">Main.cpp · Jadg.App · sans Qt6::Widgets</text>
    <rect x="330" y="50" width="220" height="44" fill="#ece4d1" stroke="#25201a"/>
    <text x="338" y="67" font-size="12" font-weight="600">LevelEditor — Qt Widgets</text>
    <text x="338" y="83" font-size="10">App/Editor/Main.cpp · Qt6::Widgets</text>
    <rect x="590" y="50" width="270" height="44" fill="#ece4d1" stroke="#25201a"/>
    <text x="598" y="67" font-size="12" font-weight="600">UnitTests, IntegrationTests…</text>
    <text x="598" y="83" font-size="10">Source/Test · lient Core, HmiLib, EditorLogic</text>

    <rect x="40" y="140" width="170" height="44" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="48" y="157" font-size="12" font-weight="600">JadgUi — Jadg.Ui</text>
    <text x="48" y="173" font-size="10">QML seul, aucun C++ (STATIC)</text>
    <rect x="230" y="140" width="190" height="44" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="238" y="157" font-size="12" font-weight="600">JadgRuntime — Jadg.Runtime</text>
    <text x="238" y="173" font-size="10">types C++ vus du QML (LOT-87)</text>
    <rect x="440" y="140" width="180" height="44" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="448" y="157" font-size="12" font-weight="600">EditorLogic</text>
    <text x="448" y="173" font-size="10">logique pure de l'éditeur</text>

    <rect x="230" y="230" width="190" height="44" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="238" y="247" font-size="12" font-weight="600">HmiLib — présentation</text>
    <text x="238" y="263" font-size="10">sans Qt Widgets, sans GPU</text>
    <rect x="440" y="230" width="180" height="44" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="448" y="247" font-size="12" font-weight="600">SceneComposition</text>
    <text x="448" y="263" font-size="10">composition sans GPU, partagée</text>

    <rect x="230" y="320" width="190" height="44" fill="#9a7420" fill-opacity="0.2" stroke="#9a7420" stroke-width="2"/>
    <text x="238" y="337" font-size="12" font-weight="600">Core — STATIC</text>
    <text x="238" y="353" font-size="10">testable sans fenêtre ni GPU</text>
    <rect x="590" y="320" width="270" height="44" fill="#fbf8f0" stroke="#3f6b34" stroke-dasharray="5 3"/>
    <text x="598" y="337" font-size="12" font-weight="600">Elements — données, pas du code</text>
    <text x="598" y="353" font-size="10">Rpg/, Assets/, Localization/ (à l'exécution)</text>
  </g>
  <g stroke="#9a7420" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M125,94 L125,138"/>
    <path d="M250,94 L300,138"/>
    <path d="M480,94 L520,138"/>
    <path d="M640,94 L590,138"/>
    <path d="M325,184 L325,228"/>
    <path d="M470,184 L400,228"/>
    <path d="M530,184 L530,228"/>
    <path d="M420,252 L438,252"/>
    <path d="M325,274 L325,318"/>
    <path d="M530,274 L530,300 L400,300 L400,318"/>
  </g>
  <path d="M420,342 L588,342" stroke="#3f6b34" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="440" y="336" font-size="10" fill="#3f6b34">lit (Core, puis HMI)</text>
  <g font-size="10" fill="#25201a">
    <text x="40" y="212" fill="#8a2233">EX-ARCH-001 — le sens des dépendances</text>
    <text x="40" y="226" fill="#8a2233">est HMI → Core, jamais l'inverse.</text>
    <text x="40" y="246">EX-IHM-102 — le jeu ne lie pas</text>
    <text x="40" y="260">Qt6::Widgets : un widget y ferait</text>
    <text x="40" y="274">échouer l'édition de liens.</text>
    <text x="40" y="292" fill="#6a6152">flèche : « lie » (target_link_…) ;</text>
    <text x="40" y="306" fill="#6a6152">les liaisons transitives (PUBLIC)</text>
    <text x="40" y="318" fill="#6a6152">ne sont pas redessinées.</text>
  </g>

  <text x="20" y="392" font-weight="600" fill="#25201a">Les trois espaces qu'une position traverse, et les seules fonctions qui convertissent</text>
  <g fill="#25201a">
    <rect x="20" y="404" width="260" height="126" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="28" y="421" font-size="12" font-weight="600">Art — pixel natif de l'asset</text>
    <text x="28" y="437" font-size="10">losange 256 × 159 px</text>
    <text x="28" y="451" font-size="10">cellule de figurine 192 × 256,</text>
    <text x="28" y="465" font-size="10">figurine 170 px, ligne de sol 252</text>
    <text x="28" y="479" font-size="10">posé à l'échelle de la case :</text>
    <text x="28" y="493" font-size="10" font-family="Consolas, monospace">standingPieceQuad, figureQuad</text>
    <text x="28" y="507" font-size="10" font-family="Consolas, monospace">tileWidth() / artTileWidth</text>
    <text x="272" y="523" font-size="10" text-anchor="end" fill="#8a2233">EX-ARCH-022, EX-REN-011</text>

    <rect x="310" y="404" width="260" height="126" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="318" y="421" font-size="12" font-weight="600">Monde — unité = 1 case, float</text>
    <text x="318" y="437" font-size="10">origine haut-gauche, Y vers le bas</text>
    <text x="318" y="451" font-size="10">grille (c, r) → monde :</text>
    <text x="318" y="465" font-size="10" font-family="Consolas, monospace">core::IsoProjection::gridToWorld</text>
    <text x="318" y="479" font-size="10" font-family="Consolas, monospace">worldToGrid · tileBounds · depth</text>
    <text x="318" y="493" font-size="10">losange L × 0,62 L en unités monde</text>
    <text x="318" y="507" font-size="10">(ARENA_DIAMOND_RATIO)</text>
    <text x="562" y="523" font-size="10" text-anchor="end" fill="#8a2233">EX-ARCH-020</text>

    <rect x="600" y="404" width="260" height="126" fill="#ece4d1" stroke="#d6c9a8"/>
    <text x="608" y="421" font-size="12" font-weight="600">Écran — pixels d'affichage</text>
    <text x="608" y="437" font-size="10" font-family="Consolas, monospace">hmi::Camera2D::worldToScreen</text>
    <text x="608" y="451" font-size="10" font-family="Consolas, monospace">screenToWorld · setZoom · zoom</text>
    <text x="608" y="465" font-size="10">PIXELS_PER_UNIT = 16 × zoom libre</text>
    <text x="608" y="479" font-size="10">(plus d'entier depuis LOT-103) ;</text>
    <text x="608" y="493" font-size="10">une case = hauteur de scène / 10,8</text>
    <text x="608" y="507" font-size="10">(WORLD_VIEW_HEIGHT_IN_TILES)</text>
    <text x="852" y="523" font-size="10" text-anchor="end" fill="#8a2233">EX-ARCH-021, EX-REN-013</text>
  </g>
  <path d="M280,467 L308,467" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570,467 L598,467" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="11" fill="#6a6152">
    <text x="20" y="554">Ce que montre le dessin : en haut, qui a le droit de lier qui — une flèche va de la cible qui lie vers celle qu'elle lie, et rien ne</text>
    <text x="20" y="570">remonte de Core vers HMI. En bas, les trois espaces qu'une position traverse et les seules fonctions qui convertissent, pour qu'aucune</text>
    <text x="20" y="586">constante ne s'éparpille (EX-ARCH-021). Pourquoi : Core se teste sans fenêtre ni GPU, et le jeu ne peut pas réintroduire un widget.</text>
  </g>
</svg>
