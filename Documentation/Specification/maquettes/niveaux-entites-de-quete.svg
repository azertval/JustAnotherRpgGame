<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="600" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — les entités de quête : décor conditionnel, portail condamné, zone déclencheuse (LOT-126)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/></marker>
  </defs>

  <text x="20" y="54" font-weight="600" fill="#25201a">Carte « arenarea » (20 × 10, vue à plat) : le parvis et la porte de l'arène</text>
  <g transform="translate(20,64)">
    <rect x="0" y="0" width="400" height="200" fill="#ece4d1" stroke="#d6c9a8"/>
    <g fill="#fbf8f0"><rect x="20" y="20" width="220" height="160"/><rect x="240" y="140" width="140" height="40"/><rect x="260" y="40" width="120" height="80"/></g>
    <g stroke="#d6c9a8" fill="none"><path d="M0,20h400M0,40h400M0,60h400M0,80h400M0,100h400M0,120h400M0,140h400M0,160h400M0,180h400"/><path d="M20,0v200M40,0v200M60,0v200M80,0v200M100,0v200M120,0v200M140,0v200M160,0v200M180,0v200M200,0v200M220,0v200M240,0v200M260,0v200M280,0v200M300,0v200M320,0v200M340,0v200M360,0v200M380,0v200"/></g>
    <g fill="#6a6152"><rect x="240" y="20" width="160" height="20"/><rect x="240" y="40" width="20" height="100"/><rect x="380" y="40" width="20" height="100"/><rect x="260" y="120" width="40" height="20"/><rect x="340" y="120" width="40" height="20"/></g>
    <text x="284" y="84" font-size="10" fill="#6a6152">arène (bâti : wall)</text>
    <rect x="300" y="120" width="40" height="20" fill="#8a2233" fill-opacity="0.25" stroke="#8a2233" stroke-width="1.5"/>
    <path d="M300,130 L310,120 M300,140 L320,120 M310,140 L330,120 M320,140 L340,120 M330,140 L340,130" stroke="#8a2233"/>
    <text x="262" y="102" font-size="10" fill="#8a2233" font-weight="600">(a) prop « porte »</text>
    <text x="262" y="113" font-size="9" fill="#8a2233">emprise 2 × 1, hachurée</text>
    <rect x="20" y="80" width="20" height="20" fill="none" stroke="#9a7420" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="44" y="94" font-size="10" fill="#9a7420" font-weight="600">(b) portail condamné</text>
    <text x="44" y="106" font-size="9" fill="#9a7420">sealed : true, sans cible</text>
    <g fill="#2f7f86" fill-opacity="0.25"><rect x="300" y="140" width="40" height="20"/><rect x="280" y="160" width="60" height="20"/></g>
    <path d="M300,140 h40 v40 h-60 v-20 h20 z" fill="none" stroke="#2f7f86" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="344" y="154" font-size="9" fill="#2f7f86" font-weight="600">(c) zone (cells)</text>
    <circle cx="230" cy="170" r="8" fill="#3f6b34"/><text x="226" y="174" font-size="8" fill="#fbf8f0">H</text>
    <path d="M240,170 L290,170" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
    <text x="120" y="196" font-size="9" fill="#9a7420">le héros y entre : déclenché à l'entrée, pas à l'arrivée</text>
    <circle cx="110" cy="110" r="8" fill="#9a7420"/><text x="106" y="114" font-size="8" fill="#25201a">M</text>
    <text x="124" y="108" font-size="9" fill="#25201a">npc « enfant » : même</text><text x="124" y="118" font-size="9" fill="#25201a">condition de présence</text>
  </g>
  <g font-size="10" fill="#25201a">
    <text x="20" y="290">Sous <tspan font-family="Consolas, monospace">quete.pommes = condamne</tspan>, la porte est là et arrête le pas ;</text>
    <text x="20" y="304">sous toute autre valeur elle n'existe pas, et l'on passe.</text>
    <text x="20" y="320">La zone devant la porte pose le drapeau au premier pas dedans,</text>
    <text x="20" y="334">puis ouvre le dialogue du garde.</text>
  </g>

  <rect x="450" y="64" width="410" height="122" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="458" y="80" font-size="11" font-weight="600" fill="#8a2233">(a) Entité « prop » : une pièce du lieu, posée comme entité</text>
  <g font-size="10" fill="#25201a" font-family="Consolas, monospace">
    <text x="458" y="98">"type": "prop", "piece": "porte-arene", "width": 2, "height": 1</text>
    <text x="458" y="114">"presenceFlag": "quete.pommes", "presenceTest": "equals",</text>
    <text x="458" y="130">"presenceValue": "condamne", "blocks": true</text>
  </g>
  <g font-size="10" fill="#25201a">
    <text x="458" y="150"><tspan font-family="Consolas, monospace">blocks</tspan> : arrête le pas tant qu'elle est présente ; absente, on passe.</text>
    <text x="458" y="166">L'emprise vient du manifeste de la pièce ; le dessin la hachure.</text>
    <text x="458" y="180" fill="#6a6152">Réf. : <tspan font-family="Consolas, monospace">core::PROP_BLOCKS_PROPERTY</tspan>, vrai par défaut.</text>
  </g>

  <rect x="450" y="196" width="410" height="90" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="458" y="212" font-size="11" font-weight="600" fill="#9a7420">(b) Portail condamné : <tspan font-family="Consolas, monospace">"sealed": true</tspan></text>
  <g font-size="10" fill="#25201a">
    <text x="458" y="230">Légal <tspan font-weight="600">sans</tspan> <tspan font-family="Consolas, monospace">targetMap</tspan> ni <tspan font-family="Consolas, monospace">arrival</tspan> : la cible n'est plus requise.</text>
    <text x="458" y="246">Graphe des cartes : pointillé discret (<tspan font-family="Consolas, monospace">Qt::DotLine</tspan>), pas une erreur.</text>
    <text x="458" y="262">En jeu : <tspan font-family="Consolas, monospace">core::ExplorationEventKind::PortalSealed</tspan>, on reste là.</text>
    <text x="458" y="278" fill="#6a6152">Une porte close par le récit ; l'auteur retire <tspan font-family="Consolas, monospace">sealed</tspan> pour l'ouvrir.</text>
  </g>

  <rect x="450" y="296" width="410" height="146" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="458" y="312" font-size="11" font-weight="600" fill="#2f7f86">(c) Zone déclencheuse : cases peintes (<tspan font-family="Consolas, monospace">cells</tspan>), jusqu'à trois effets</text>
  <g font-size="10" fill="#25201a">
    <text x="458" y="332">1. <tspan font-family="Consolas, monospace">triggerFlag</tspan> + <tspan font-family="Consolas, monospace">triggerValue</tspan> → pose un drapeau (valeur déclarée)</text>
    <text x="458" y="348">2. <tspan font-family="Consolas, monospace">triggerDialogue</tspan> → ouvre un dialogue</text>
    <text x="458" y="364">3. <tspan font-family="Consolas, monospace">triggerMap</tspan> + <tspan font-family="Consolas, monospace">triggerArrival</tspan> → transfert vers une autre carte</text>
    <text x="458" y="380"><tspan font-family="Consolas, monospace">triggerOnce</tspan> → une seule fois ; aucun effet n'est requis</text>
    <text x="458" y="400" font-weight="600">Ordre fixe : drapeau → dialogue → transfert (<tspan font-family="Consolas, monospace">enterZones</tspan>).</text>
    <text x="458" y="416">À l'<tspan font-weight="600">entrée</tspan>, pas à l'arrivée : un transfert qui dépose dans une zone</text>
    <text x="458" y="432">ne la déclenche pas, sans quoi il bouclerait (<tspan font-family="Consolas, monospace">resetZones</tspan>).</text>
  </g>

  <rect x="20" y="454" width="840" height="50" fill="#fbf8f0" stroke="#9a7420"/>
  <text x="30" y="472" font-size="11" fill="#25201a"><tspan font-weight="600">La condition de présence vaut pour toute famille</tspan> (<tspan font-family="Consolas, monospace">core::commonEntityProperties</tspan>) : <tspan font-family="Consolas, monospace">presenceFlag</tspan>, <tspan font-family="Consolas, monospace">presenceTest</tspan> (set, unset, equals,</text>
  <text x="30" y="490" font-size="11" fill="#25201a">notEquals), <tspan font-family="Consolas, monospace">presenceValue</tspan> — PNJ, portail, décor, zone. L'inspecteur propose les valeurs que la quête déclare (<tspan font-family="Consolas, monospace">FlagValues</tspan>).</text>

  <g fill="#6a6152" font-size="12">
    <text x="20" y="532">Trois entités écrivent une quête sur la carte sans script : le décor qui paraît ou disparaît selon un drapeau, le portail que</text>
    <text x="20" y="548">le récit condamne, la zone qui pose un drapeau, parle ou transporte quand le héros y entre. Toutes lisent le même ensemble de</text>
    <text x="20" y="564">drapeaux de la partie ; l'éditeur vérifie les références (<tspan font-family="Consolas, monospace">--check</tspan>) et montre la carte sous un état choisi (« état de partie »).</text>
  </g>
</svg>
