  <text x="240" y="300" font-size="10" fill="#3f6b34">cases atteignables (EX-CBT-020)</text>
  <text x="440" y="250" font-size="10" fill="#2f7f86">ligne de vue</text>

  <rect x="222" y="46" width="300" height="34" fill="#25201a" stroke="#9a7420"/>
  <g stroke="#9a7420"><circle cx="248" cy="63" r="12" fill="#3f6b34"/><circle cx="284" cy="63" r="12" fill="#8a2233"/><circle cx="320" cy="63" r="12" fill="#8a2233"/><circle cx="356" cy="63" r="12" fill="#3f6b34"/><circle cx="392" cy="63" r="12" fill="#25201a"/><circle cx="428" cy="63" r="12" fill="#25201a"/></g>
  <circle cx="248" cy="63" r="15" fill="none" stroke="#fbf8f0" stroke-width="2"/>
  <text x="456" y="60" font-size="9" fill="#d6c9a8">round 2</text>
  <text x="456" y="72" font-size="9" fill="#d6c9a8">tour : Grom</text>

  <circle cx="62" cy="80" r="26" fill="#25201a" stroke="#9a7420" stroke-width="2"/>
  <rect x="96" y="70" width="110" height="8" fill="#25201a" stroke="#9a7420"/><rect x="97" y="71" width="70" height="6" fill="#8a2233"/>
  <text x="96" y="94" font-size="10" fill="#25201a">PV 21/32 · États : —</text>

  <rect x="560" y="290" width="150" height="80" fill="#25201a" stroke="#9a7420"/>
  <text x="568" y="306" font-size="11" fill="#9a7420" font-weight="600">Loup · FP 1/4</text>
  <text x="568" y="322" font-size="10" fill="#fbf8f0">CA 13 · ensanglanté</text>
  <text x="568" y="338" font-size="10" fill="#fbf8f0">Vitesse 8 cases</text>
  <text x="568" y="354" font-size="10" fill="#fbf8f0">Toucher : d20 + 5 ≥ 13</text>

  <rect x="222" y="380" width="300" height="44" fill="#25201a" stroke="#9a7420"/>
  <g font-size="9" fill="#fbf8f0">
    <rect x="230" y="386" width="60" height="14" fill="#8a2233"/><text x="236" y="396">Action ●</text>
    <rect x="296" y="386" width="60" height="14" fill="#6a6152"/><text x="302" y="396">Bonus ○</text>
    <rect x="362" y="386" width="60" height="14" fill="#8a2233"/><text x="368" y="396">Réaction ●</text>
    <rect x="428" y="386" width="86" height="14" fill="#3f6b34"/><text x="434" y="396">Déplacement 3/6</text>
  </g>
  <g stroke="#9a7420" fill="#25201a"><rect x="230" y="404" width="18" height="16"/><rect x="252" y="404" width="18" height="16"/><rect x="274" y="404" width="18" height="16"/><rect x="296" y="404" width="18" height="16"/><rect x="318" y="404" width="18" height="16"/><rect x="340" y="404" width="18" height="16"/></g>
  <text x="366" y="416" font-size="9" fill="#d6c9a8">1 attaque · 2 sort · 3 objet · … · Entrée : fin du tour</text>

  <rect x="36" y="330" width="176" height="94" fill="#25201a" stroke="#9a7420"/>
  <text x="42" y="346" font-size="9" fill="#9a7420" font-weight="600">Journal (EX-REG-003)</text>
  <text x="42" y="362" font-size="9" fill="#fbf8f0">Grom → Loup : d20 (14)</text>
  <text x="42" y="374" font-size="9" fill="#fbf8f0">+2 For +2 maîtrise = 18</text>
  <text x="42" y="386" font-size="9" fill="#fbf8f0">contre CA 13 (+2 abri) : touché</text>
  <text x="42" y="398" font-size="9" fill="#fbf8f0">1d8 (5) + 2 = 7 tranchant</text>
  <text x="42" y="410" font-size="9" fill="#d6c9a8">Loup : 3 PV, ensanglanté</text>

  <rect x="560" y="402" width="150" height="16" fill="#25201a" stroke="#9a7420"/>
  <text x="572" y="414" font-size="10" fill="#6a6152">Exploration ·</text><text x="640" y="414" font-size="10" fill="#9a7420" font-weight="600">TACTIQUE</text>

  <g fill="#25201a" font-size="12">
    <text x="740" y="60" font-weight="600">Ce qui s'ajoute au HUD</text>
    <text x="740" y="82">Piste d'initiative : l'ordre</text>
    <text x="740" y="98">stable du combat (EX-CBT-010),</text>
    <text x="740" y="114">le tour courant cerclé.</text>
    <text x="740" y="142">Barre d'action : action, bonus,</text>
    <text x="740" y="158">réaction, déplacement, chacun</text>
    <text x="740" y="174">consommé une fois (EX-CBT-011) ;</text>
    <text x="740" y="190">fin de tour explicite (EX-CBT-012).</text>
    <text x="740" y="218">Cible : ce que le joueur sait</text>
    <text x="740" y="234">d'elle, jamais ses PV exacts.</text>
    <text x="740" y="262">Journal : chaque jet restitué</text>
    <text x="740" y="278">avec ses modificateurs.</text>
    <text x="740" y="306">Sur la grille : cases</text>
    <text x="740" y="322">atteignables, chemin, curseur,</text>
    <text x="740" y="338">ligne de vue et abri (EX-CBT-021).</text>
  </g>
  <g fill="#6a6152" font-size="11">
    <text x="740" y="372">Curseur clavier et manette</text>
    <text x="740" y="388">(LOT-24) ; la souris pointe</text>
    <text x="740" y="404">la même case (un seul cadrage).</text>
  </g>

  <g fill="#6a6152" font-size="11">
    <text x="20" y="456">Comparer à la capture réelle (jeu-combathud.jpg) : les huit plaques, la piste et la fiche de la cible existent en habillage, sans</text>
    <text x="20" y="472">données. Le LOT-24 a livré cette interface sur le Colisée (jeu-arena.jpg) ; le LOT-118 la branche sur la carte d'exploration, ce que</text>
    <text x="20" y="488">cette maquette montre. La scène est un dessin d'intention : sur une carte maquette (LOT-128), les figurines sont des jetons.</text>
  </g>
</svg>
