<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="560" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — l'arborescence des lieux : d'où viennent les pièces d'une carte, et qui gagne (LOT-124)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/></marker>
  </defs>

  <text x="20" y="52" font-weight="600" fill="#25201a">Les dossiers (<tspan font-family="Consolas, monospace">Source/Elements/Assets/</tspan>)</text>
  <rect x="20" y="60" width="230" height="340" fill="#ece4d1" stroke="#d6c9a8"/>
  <g font-family="Consolas, monospace" font-size="10" fill="#25201a">
    <text x="28" y="76">Assets/</text>
    <text x="28" y="90">├─ Common/</text>
    <text x="28" y="104">│  ├─ Terrain/</text>
    <text x="28" y="118">│  ├─ Nature/</text>
    <text x="28" y="132">│  ├─ Props/</text>
    <text x="28" y="146">│  └─ Characters/</text>
    <text x="28" y="160">└─ Regions/</text>
    <text x="28" y="174">   └─ central-empire/</text>
    <text x="28" y="188">      ├─ Common/Scene/</text>
    <text x="28" y="202">      ├─ Common/Characters/</text>
    <text x="28" y="216">      └─ capital/</text>
    <text x="28" y="230">         ├─ Common/Scene/</text>
    <text x="28" y="244">         ├─ Common/Characters/</text>
    <text x="28" y="258">         ├─ martpart/</text>
    <text x="28" y="272">         └─ arenarea/</text>
    <text x="28" y="286">            ├─ Scene/</text>
    <text x="28" y="300">            ├─ Characters/</text>
    <text x="28" y="314">            ├─ Map/</text>
    <text x="28" y="328">            └─ arena-of-fate/</text>
    <text x="28" y="342">               ├─ Scene/</text>
    <text x="28" y="356">               └─ Characters/</text>
  </g>
  <g font-size="10" font-weight="600">
    <text x="176" y="118" fill="#6a6152">World</text>
    <text x="176" y="188" fill="#3f6b34">Central Empire</text>
    <text x="176" y="230" fill="#2f7f86">Capital</text>
    <text x="176" y="286" fill="#8a2233">Arenarea</text>
    <text x="176" y="342" fill="#9a7420">Arena of Fate</text>
  </g>
  <text x="28" y="378" font-size="9" fill="#6a6152">niveau = dossier ; le monde en a trois (Terrain,</text>
  <text x="28" y="390" font-size="9" fill="#6a6152">Nature, Props), rangés sous un seul titre.</text>

  <text x="264" y="52" font-weight="600" fill="#25201a">La carte nomme son lieu ; les candidats, dans l'ordre</text>
  <rect x="264" y="60" width="336" height="66" fill="#ece4d1" stroke="#d6c9a8"/>
  <g font-family="Consolas, monospace" font-size="9" fill="#25201a">
    <text x="272" y="76">"layers": [ { "name": "sol", "kind": "ground",</text>
    <text x="272" y="90">    "scene": "central-empire/capital/arenarea",</text>
    <text x="272" y="104">    "tiles": [ … ] }, … ]</text>
  </g>
  <text x="272" y="119" font-size="9" fill="#6a6152">une couche de sol porte le lieu ; les décors le partagent</text>
  <path d="M432,126 L432,142" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="158" font-size="10" fill="#25201a"><tspan font-family="Consolas, monospace">core::sceneLevelCandidates("central-empire/capital/arenarea")</tspan></text>
  <rect x="264" y="166" width="336" height="192" fill="#fbf8f0" stroke="#d6c9a8"/>
  <g font-size="9">
    <text x="270" y="182" fill="#8a2233" font-weight="600">1 Arenarea</text><text x="340" y="182" font-family="Consolas, monospace" fill="#25201a">Regions/central-empire/capital/arenarea/Scene</text>
    <text x="270" y="198" fill="#8a2233" font-weight="600">2 Arenarea</text><text x="340" y="198" font-family="Consolas, monospace" fill="#6a6152">…/capital/arenarea/Common/Scene  (absent : passé)</text>
    <text x="270" y="214" fill="#2f7f86" font-weight="600">3 Capital</text><text x="340" y="214" font-family="Consolas, monospace" fill="#6a6152">…/central-empire/capital/Scene  (absent : passé)</text>
    <text x="270" y="230" fill="#2f7f86" font-weight="600">4 Capital</text><text x="340" y="230" font-family="Consolas, monospace" fill="#25201a">Regions/central-empire/capital/Common/Scene</text>
    <text x="270" y="246" fill="#3f6b34" font-weight="600">5 Central Empire</text><text x="350" y="246" font-family="Consolas, monospace" fill="#25201a">Regions/central-empire/Common/Scene</text>
    <text x="270" y="262" fill="#6a6152" font-weight="600">6 World</text><text x="340" y="262" font-family="Consolas, monospace" fill="#25201a">Common/Terrain</text>
    <text x="270" y="278" fill="#6a6152" font-weight="600">7 World</text><text x="340" y="278" font-family="Consolas, monospace" fill="#25201a">Common/Nature</text>
    <text x="270" y="294" fill="#6a6152" font-weight="600">8 World</text><text x="340" y="294" font-family="Consolas, monospace" fill="#25201a">Common/Props</text>
  </g>
  <g font-size="9" fill="#25201a">
    <text x="270" y="314">zone → ville → région → monde ; une région n'a qu'un commun,</text>
    <text x="270" y="326">ses zones hors ville ont leur dossier propre. Un lieu à plat (<tspan font-family="Consolas, monospace">bourg</tspan>)</text>
    <text x="270" y="338">lit <tspan font-family="Consolas, monospace">Scene/bourg</tspan>, puis le monde. Un niveau sans manifeste est passé ;</text>
    <text x="270" y="350" fill="#6a6152">un manifeste illisible fait échouer la lecture, dossier nommé.</text>
  </g>
  <text x="264" y="372" font-size="10" fill="#25201a">Même ordre pour les figurines : <tspan font-family="Consolas, monospace">core::characterLevelCandidates</tspan></text>
  <text x="264" y="386" font-size="10" fill="#25201a">(<tspan font-family="Consolas, monospace">Characters/</tspan> puis <tspan font-family="Consolas, monospace">Common/Characters/</tspan> à chaque niveau, puis ceux</text>
  <text x="264" y="400" font-size="10" fill="#25201a">du monde) : un PNJ nommé n'est proposé qu'aux cartes de sa zone.</text>

  <text x="614" y="52" font-weight="600" fill="#25201a">Les manifestes empilés</text>
  <g stroke="#d6c9a8">
    <rect x="614" y="60" width="246" height="44" fill="#8a2233" fill-opacity="0.12"/>
    <rect x="614" y="110" width="246" height="44" fill="#2f7f86" fill-opacity="0.12"/>
    <rect x="614" y="160" width="246" height="44" fill="#6a6152" fill-opacity="0.12"/>
  </g>
  <g font-size="9">
    <text x="620" y="74" fill="#8a2233" font-weight="600">Arenarea · arenarea/Scene/manifest.json</text>
    <text x="620" y="88" fill="#25201a" font-family="Consolas, monospace">mur-pierre · fontaine</text>
    <text x="620" y="98" fill="#6a6152">la pièce la plus propre</text>
    <text x="620" y="124" fill="#2f7f86" font-weight="600">Capital · capital/Common/Scene/manifest.json</text>
    <text x="620" y="138" fill="#25201a" font-family="Consolas, monospace">mur-pierre · porte-bois · tile 256×159</text>
    <text x="620" y="148" fill="#6a6152">commun à toute la ville (storey 224)</text>
    <text x="620" y="174" fill="#6a6152" font-weight="600">World · Common/Terrain, Nature, Props</text>
    <text x="620" y="188" fill="#25201a" font-family="Consolas, monospace">herbe · chêne</text>
    <text x="620" y="198" fill="#6a6152">ce qu'on voit partout</text>
  </g>
  <path d="M737,204 L737,222" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
  <text x="614" y="238" font-size="10" fill="#25201a"><tspan font-family="Consolas, monospace">core::ScenePieceManifest::resolve</tspan> →</text>
  <rect x="614" y="244" width="246" height="112" fill="#fbf8f0" stroke="#9a7420"/>
  <g font-size="9">
    <text x="620" y="258" fill="#25201a" font-weight="600">un seul catalogue, une question : <tspan font-family="Consolas, monospace">find(nom)</tspan></text>
    <text x="620" y="274" font-family="Consolas, monospace" fill="#25201a">mur-pierre</text><text x="690" y="274" fill="#8a2233">Arenarea — la zone gagne</text>
    <text x="620" y="288" font-family="Consolas, monospace" fill="#25201a">fontaine</text><text x="690" y="288" fill="#8a2233">Arenarea (seulement là)</text>
    <text x="620" y="302" font-family="Consolas, monospace" fill="#25201a">porte-bois</text><text x="690" y="302" fill="#2f7f86">Capital</text>
    <text x="620" y="316" font-family="Consolas, monospace" fill="#25201a">herbe</text><text x="690" y="316" fill="#6a6152">World (seulement là)</text>
    <text x="620" y="332" font-family="Consolas, monospace" fill="#6a6152">mur-pierre</text><text x="690" y="332" fill="#6a6152">Capital — masquée (<tspan font-family="Consolas, monospace">masked</tspan>)</text>
    <text x="620" y="348" fill="#9a7420" font-weight="600">palette : « ⚠ masks Capital », commune éteinte</text>
  </g>
  <text x="614" y="372" font-size="9" fill="#25201a">Lisent ce catalogue : collision déduite, brouillon,</text>
  <text x="614" y="384" font-size="9" fill="#25201a">palette, <tspan font-family="Consolas, monospace">--check</tspan>. Le losange (<tspan font-family="Consolas, monospace">tile</tspan>) : celui du</text>
  <text x="614" y="396" font-size="9" fill="#25201a">niveau le plus propre qui en déclare un.</text>

  <rect x="20" y="410" width="840" height="50" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="30" y="428" font-size="11" fill="#25201a"><tspan font-weight="600">Même règle partout.</tspan> <tspan font-family="Consolas, monospace">appearance.json</tspan> (rangé à côté de chaque manifeste) : la table la plus propre gagne, <tspan font-weight="600">par type</tspan> de case</text>
  <text x="30" y="446" font-size="11" fill="#25201a">(<tspan font-family="Consolas, monospace">hmi::PlaceAppearance</tspan>). <tspan font-family="Consolas, monospace">Characters/</tspan> : la figurine la plus propre gagne par slug (<tspan font-family="Consolas, monospace">core::resolveFigures</tspan>) ; un PNJ nommé n'est proposé qu'à sa zone.</text>

  <g fill="#6a6152" font-size="12">
    <text x="20" y="490">Un lieu ne redit pas ce que sa ville et sa région fournissent déjà : les pièces communes descendent d'elles-mêmes, et une zone qui</text>
    <text x="20" y="506">veut sa propre version d'un mur la déclare sous le même nom — elle gagne, et l'éditeur montre ce qu'elle masque pour que le</text>
    <text x="20" y="522">remplacement soit voulu, non subi. La carte ne connaît que le nom court de la pièce ; l'ordre des candidats fait le reste.</text>
  </g>
</svg>
