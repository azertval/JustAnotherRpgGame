<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, serif" font-size="13">
  <rect width="880" height="560" fill="#fbf8f0"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#25201a">Maquette — l'arborescence des lieux : d'où viennent les pièces d'une carte, et qui gagne (LOT-124)</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a7420"/></marker>
  </defs>

  <text x="20" y="52" font-weight="600" fill="#25201a">Les dossiers d'<tspan font-family="Consolas, monospace">Assets/</tspan></text>
  <rect x="20" y="60" width="270" height="350" fill="#ece4d1" stroke="#d6c9a8"/>
  <g font-family="Consolas, monospace" font-size="10" fill="#25201a">
    <text x="28" y="76">Assets/</text>
    <text x="28" y="89">├─ Common/</text>
    <text x="28" y="102">│  ├─ Terrain/</text>
    <text x="28" y="115">│  ├─ Nature/</text>
    <text x="28" y="128">│  ├─ Props/</text>
    <text x="28" y="141">│  └─ Characters/</text>
    <text x="28" y="154">└─ Regions/</text>
    <text x="28" y="167">   └─ central-empire/</text>
    <text x="28" y="180">      ├─ Common/Scene/</text>
    <text x="28" y="193">      ├─ Common/Characters/</text>
    <text x="28" y="206">      └─ capital/</text>
    <text x="28" y="219">         ├─ Common/Scene/</text>
    <text x="28" y="232">         ├─ Common/Characters/</text>
    <text x="28" y="245">         ├─ martpart/</text>
    <text x="28" y="258">         └─ arenarea/</text>
    <text x="28" y="271">            ├─ Scene/</text>
    <text x="28" y="284">            ├─ Characters/</text>
    <text x="28" y="297">            ├─ Map/</text>
    <text x="28" y="310">            └─ arena-of-fate/</text>
    <text x="28" y="323">               ├─ Scene/</text>
    <text x="28" y="336">               └─ Characters/</text>
  </g>
  <g font-size="10" font-weight="600">
    <text x="214" y="115" fill="#6a6152">World</text>
    <text x="214" y="180" fill="#3f6b34">Central Empire</text>
    <text x="214" y="219" fill="#2f7f86">Capital</text>
    <text x="214" y="271" fill="#8a2233">Arenarea</text>
    <text x="214" y="323" fill="#9a7420">Arena of Fate</text>
  </g>
  <text x="28" y="360" font-size="9" fill="#6a6152">niveau = dossier ; le monde en a trois (Terrain,</text>
  <text x="28" y="372" font-size="9" fill="#6a6152">Nature, Props), rangés sous un seul titre « World ».</text>
  <text x="28" y="390" font-size="9" fill="#6a6152">Une zone hors ville a son dossier, sans « Common ».</text>

  <text x="300" y="52" font-weight="600" fill="#25201a">La carte nomme son lieu ; les candidats</text>
  <rect x="300" y="60" width="310" height="66" fill="#ece4d1" stroke="#d6c9a8"/>
  <g font-family="Consolas, monospace" font-size="9" fill="#25201a">
    <text x="308" y="76">"layers": [ { "name": "sol", "kind": "ground",</text>
    <text x="308" y="90">    "scene": "central-empire/capital/arenarea",</text>
    <text x="308" y="104">    "tiles": [ … ] }, … ]</text>
  </g>
  <text x="308" y="119" font-size="9" fill="#6a6152">une couche de sol porte le lieu ; les décors le partagent</text>
  <path d="M455,126 L455,142" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="158" font-size="9" fill="#25201a"><tspan font-family="Consolas, monospace">core::sceneLevelCandidates(lieu)</tspan>, sous <tspan font-family="Consolas, monospace">Regions/</tspan> :</text>
  <rect x="300" y="166" width="310" height="204" fill="#fbf8f0" stroke="#d6c9a8"/>
  <g font-size="9">
    <text x="306" y="182" fill="#8a2233" font-weight="600">1 Arenarea</text><text x="376" y="182" font-family="Consolas, monospace" fill="#25201a">central-empire/capital/arenarea/Scene</text>
    <text x="306" y="196" fill="#8a2233" font-weight="600">2 Arenarea</text><text x="376" y="196" font-family="Consolas, monospace" fill="#6a6152">…/capital/arenarea/Common/Scene  (absent)</text>
    <text x="306" y="210" fill="#2f7f86" font-weight="600">3 Capital</text><text x="376" y="210" font-family="Consolas, monospace" fill="#6a6152">…/central-empire/capital/Scene  (absent)</text>
    <text x="306" y="224" fill="#2f7f86" font-weight="600">4 Capital</text><text x="376" y="224" font-family="Consolas, monospace" fill="#25201a">central-empire/capital/Common/Scene</text>
    <text x="306" y="238" fill="#3f6b34" font-weight="600">5 Central Empire</text><text x="390" y="238" font-family="Consolas, monospace" fill="#25201a">central-empire/Common/Scene</text>
    <text x="306" y="252" fill="#6a6152" font-weight="600">6 World</text><text x="376" y="252" font-family="Consolas, monospace" fill="#25201a">Common/Terrain  (hors Regions/)</text>
    <text x="306" y="266" fill="#6a6152" font-weight="600">7 World</text><text x="376" y="266" font-family="Consolas, monospace" fill="#25201a">Common/Nature</text>
    <text x="306" y="280" fill="#6a6152" font-weight="600">8 World</text><text x="376" y="280" font-family="Consolas, monospace" fill="#25201a">Common/Props</text>
  </g>
  <g font-size="9" fill="#25201a">
    <text x="306" y="302">zone → ville → région → monde. Une région n'a qu'un</text>
    <text x="306" y="314">commun ; ses zones hors ville ont leur dossier propre.</text>
    <text x="306" y="326">Un lieu à plat (<tspan font-family="Consolas, monospace">bourg</tspan>) lit <tspan font-family="Consolas, monospace">Scene/bourg</tspan>, puis le monde.</text>
    <text x="306" y="340" fill="#6a6152">Un niveau sans manifeste est passé ; un manifeste illisible</text>
    <text x="306" y="352" fill="#6a6152">fait échouer la lecture, dossier nommé.</text>
  </g>
  <text x="300" y="382" font-size="9" fill="#25201a">Figurines : même ordre, <tspan font-family="Consolas, monospace">core::characterLevelCandidates</tspan></text>
  <text x="300" y="394" font-size="9" fill="#25201a">(<tspan font-family="Consolas, monospace">Characters/</tspan> puis <tspan font-family="Consolas, monospace">Common/Characters/</tspan> à chaque niveau,</text>
  <text x="300" y="406" font-size="9" fill="#25201a">puis le monde) : un PNJ nommé n'est proposé qu'à sa zone.</text>

  <text x="620" y="52" font-weight="600" fill="#25201a">Les manifestes empilés</text>
  <g stroke="#d6c9a8">
    <rect x="620" y="60" width="240" height="44" fill="#8a2233" fill-opacity="0.12"/>
    <rect x="620" y="110" width="240" height="44" fill="#2f7f86" fill-opacity="0.12"/>
    <rect x="620" y="160" width="240" height="44" fill="#6a6152" fill-opacity="0.12"/>
  </g>
  <g font-size="9">
    <text x="626" y="74" fill="#8a2233" font-weight="600">Arenarea · arenarea/Scene/manifest</text>
    <text x="626" y="88" fill="#25201a" font-family="Consolas, monospace">mur-pierre · fontaine</text>
    <text x="626" y="98" fill="#6a6152">le niveau le plus propre</text>
    <text x="626" y="124" fill="#2f7f86" font-weight="600">Capital · capital/Common/Scene/manifest</text>
    <text x="626" y="138" fill="#25201a" font-family="Consolas, monospace">mur-pierre · porte-bois · tile 256×159</text>
    <text x="626" y="148" fill="#6a6152">commun à toute la ville (storey 224)</text>
    <text x="626" y="174" fill="#6a6152" font-weight="600">World · Common/Terrain, Nature, Props</text>
    <text x="626" y="188" fill="#25201a" font-family="Consolas, monospace">herbe · chêne</text>
    <text x="626" y="198" fill="#6a6152">ce qu'on voit partout</text>
  </g>
  <path d="M740,204 L740,222" stroke="#9a7420" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="238" font-size="10" fill="#25201a"><tspan font-family="Consolas, monospace">core::ScenePieceManifest::resolve</tspan> →</text>
  <rect x="620" y="244" width="240" height="112" fill="#fbf8f0" stroke="#9a7420"/>
  <g font-size="9">
    <text x="626" y="258" fill="#25201a" font-weight="600">un seul catalogue, une question : <tspan font-family="Consolas, monospace">find(nom)</tspan></text>
    <text x="626" y="274" font-family="Consolas, monospace" fill="#25201a">mur-pierre</text><text x="696" y="274" fill="#8a2233">Arenarea — la zone gagne</text>
    <text x="626" y="288" font-family="Consolas, monospace" fill="#25201a">fontaine</text><text x="696" y="288" fill="#8a2233">Arenarea (seulement là)</text>
    <text x="626" y="302" font-family="Consolas, monospace" fill="#25201a">porte-bois</text><text x="696" y="302" fill="#2f7f86">Capital</text>
    <text x="626" y="316" font-family="Consolas, monospace" fill="#25201a">herbe</text><text x="696" y="316" fill="#6a6152">World (seulement là)</text>
    <text x="626" y="332" font-family="Consolas, monospace" fill="#6a6152">mur-pierre</text><text x="696" y="332" fill="#6a6152">Capital — masquée (<tspan font-family="Consolas, monospace">masked</tspan>)</text>
    <text x="626" y="348" fill="#9a7420" font-weight="600">palette : ⚠ masks Capital ; commune éteinte</text>
  </g>
  <text x="620" y="374" font-size="9" fill="#25201a">Le lisent : collision déduite, brouillon,</text>
  <text x="620" y="386" font-size="9" fill="#25201a">palette, <tspan font-family="Consolas, monospace">--check</tspan>. Le losange (<tspan font-family="Consolas, monospace">tile</tspan>) : celui</text>
  <text x="620" y="398" font-size="9" fill="#25201a">du niveau le plus propre qui en déclare un.</text>

  <rect x="20" y="420" width="840" height="50" fill="#ece4d1" stroke="#d6c9a8"/>
  <text x="30" y="438" font-size="11" fill="#25201a"><tspan font-weight="600">Même règle partout.</tspan> <tspan font-family="Consolas, monospace">appearance.json</tspan> (à côté de chaque manifeste) : la table la plus propre gagne, <tspan font-weight="600">par type</tspan> de case</text>
  <text x="30" y="456" font-size="11" fill="#25201a">(<tspan font-family="Consolas, monospace">hmi::PlaceAppearance</tspan>) ; <tspan font-family="Consolas, monospace">Characters/</tspan> : la figurine la plus propre gagne par slug (<tspan font-family="Consolas, monospace">core::resolveFigures</tspan>).</text>

  <g fill="#6a6152" font-size="12">
    <text x="20" y="500">Un lieu ne redit pas ce que sa ville et sa région fournissent déjà : les pièces communes descendent d'elles-mêmes, et une zone qui</text>
    <text x="20" y="516">veut sa propre version d'un mur la déclare sous le même nom — elle gagne, et l'éditeur montre ce qu'elle masque pour que le</text>
    <text x="20" y="532">remplacement soit voulu, non subi. La carte ne connaît que le nom court de la pièce ; l'ordre des candidats fait le reste.</text>
  </g>
</svg>
