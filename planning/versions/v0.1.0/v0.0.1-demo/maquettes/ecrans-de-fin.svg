<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="Segoe UI, sans-serif">
  <title>Maquette — écran de mort et écran de fin de démo</title>
  <style>
    .screen { fill: #0b1113; stroke: #2f4247; }
    .plate { fill: #16232a; stroke: #c9a45c; stroke-width: 1.2; }
    .title { fill: #efe6d2; font: 600 24px Georgia, serif; letter-spacing: 2px; }
    .red { fill: #d0566b; }
    .gold { fill: #d2ac62; }
    .body { fill: #a39a84; font-size: 13px; }
    .btn rect { fill: #1c2d33; stroke: #c9a45c; }
    .btn.primary rect { fill: #8e2335; }
    .btn text { fill: #efe6d2; font-size: 13px; letter-spacing: 1px; }
    .cap { fill: #a39a84; font-size: 12px; letter-spacing: 2px; }
    .rule { stroke: #c9a45c; stroke-width: 1; }
  </style>
  <rect width="1180" height="400" fill="#10191b"/>

  <text x="40" y="34" class="cap">ÉCRAN DE MORT</text>
  <rect class="screen" x="40" y="48" width="530" height="320" rx="6"/>
  <rect x="40" y="48" width="530" height="320" rx="6" fill="#2d1a20" opacity=".45"/>
  <text x="305" y="150" text-anchor="middle" class="title red">VOUS ÊTES MORT</text>
  <line class="rule" x1="225" y1="168" x2="385" y2="168"/>
  <text x="305" y="196" text-anchor="middle" class="body">Le sable de l'Arena of Fate a bu votre sang.</text>
  <text x="305" y="216" text-anchor="middle" class="body">L'enfant attend toujours dans sa cellule.</text>
  <g class="btn primary"><rect x="175" y="258" width="120" height="36" rx="4"/><text x="235" y="281" text-anchor="middle">RECOMMENCER</text></g>
  <g class="btn"><rect x="315" y="258" width="120" height="36" rx="4"/><text x="375" y="281" text-anchor="middle">MENU</text></g>
  <text x="305" y="340" text-anchor="middle" class="body">Fond : la scène du combat, figée et assombrie</text>

  <text x="610" y="34" class="cap">ÉCRAN DE FIN DE DÉMO</text>
  <rect class="screen" x="610" y="48" width="530" height="320" rx="6"/>
  <rect class="plate" x="650" y="74" width="450" height="268" rx="6"/>
  <text x="875" y="116" text-anchor="middle" class="title gold">FIN DE LA DÉMO</text>
  <line class="rule" x1="795" y1="132" x2="955" y2="132"/>
  <text x="875" y="160" text-anchor="middle" class="body">Vous avez rendu son fils à sa mère</text>
  <text x="875" y="182" text-anchor="middle" fill="#efe6d2" font-size="14">par la voie de l'arène · par la parole</text>
  <text x="875" y="220" text-anchor="middle" class="body">À venir : quatre classes, le combat de groupe,</text>
  <text x="875" y="238" text-anchor="middle" class="body">puis toute la Capitale impériale.</text>
  <g class="btn primary"><rect x="745" y="278" width="120" height="36" rx="4"/><text x="805" y="301" text-anchor="middle">CRÉDITS</text></g>
  <g class="btn"><rect x="885" y="278" width="120" height="36" rx="4"/><text x="945" y="301" text-anchor="middle">MENU</text></g>
</svg>
