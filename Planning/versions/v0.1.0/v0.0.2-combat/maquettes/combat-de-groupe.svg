<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 664" font-family="Segoe UI, sans-serif">
  <title>Maquette — interface de combat de groupe</title>
  <style>
    .panel { fill: #16232a; stroke: #c9a45c; stroke-width: 1; }
    .sub { fill: #1c2d33; stroke: #2f4247; }
    .h { fill: #d2ac62; font: 600 12px Georgia, serif; letter-spacing: 2px; }
    .t { fill: #efe6d2; font-size: 13px; }
    .s { fill: #a39a84; font-size: 11.5px; }
    .note { fill: #6dc0c4; font-size: 11.5px; }
    .ally { fill: #1c2d33; stroke: #6dc0c4; stroke-width: 2; }
    .foe { fill: #2d1a20; stroke: #d0566b; stroke-width: 2; }
    .active { stroke: #d2ac62; stroke-width: 3; }
    .hp { fill: #86b56f; } .hpbg { fill: #0b1113; }
    .tile { fill: #e3b66a; stroke: #10191b; stroke-width: .6; }
    .reach { fill: #6dc0c4; opacity: .35; }
    .path { fill: #d2ac62; opacity: .55; }
    .target { fill: #d0566b; opacity: .5; }
  </style>
  <rect width="1180" height="664" fill="#0b1113"/>

  <!-- Piste d'initiative -->
  <rect class="panel" x="290" y="16" width="600" height="64" rx="6"/>
  <text x="306" y="36" class="h">INITIATIVE · ROUND 2</text>
  <g>
    <circle class="ally active" cx="330" cy="58" r="17"/><text x="330" y="62" text-anchor="middle" class="t">Sc</text>
    <circle class="foe" cx="378" cy="58" r="15"/><text x="378" y="62" text-anchor="middle" class="t">G1</text>
    <circle class="ally" cx="424" cy="58" r="15"/><text x="424" y="62" text-anchor="middle" class="t">Br</text>
    <circle class="foe" cx="470" cy="58" r="15"/><text x="470" y="62" text-anchor="middle" class="t">G2</text>
    <circle class="ally" cx="516" cy="58" r="15"/><text x="516" y="62" text-anchor="middle" class="t">Pr</text>
    <circle class="ally" cx="562" cy="58" r="15"/><text x="562" y="62" text-anchor="middle" class="t">Ma</text>
    <circle class="foe" cx="608" cy="58" r="15"/><text x="608" y="62" text-anchor="middle" class="t">Ar</text>
  </g>
  <text x="650" y="62" class="note">① l'actif est cerclé d'or</text>

  <!-- Le groupe -->
  <rect class="panel" x="16" y="16" width="258" height="330" rx="6"/>
  <text x="32" y="40" class="h">LE GROUPE</text>
  <g>
    <rect class="sub" x="28" y="52" width="234" height="64" rx="4"/><circle class="ally" cx="58" cy="84" r="20"/>
    <text x="88" y="76" class="t">Brawler · niv. 1</text><rect class="hpbg" x="88" y="84" width="160" height="8" rx="4"/><rect class="hp" x="88" y="84" width="118" height="8" rx="4"/><text x="88" y="108" class="s">11 / 15 PV · CA 14 · résistance</text>
    <rect class="sub" x="28" y="122" width="234" height="64" rx="4"/><circle class="ally" cx="58" cy="154" r="20"/>
    <text x="88" y="146" class="t">Mage · niv. 1</text><rect class="hpbg" x="88" y="154" width="160" height="8" rx="4"/><rect class="hp" x="88" y="154" width="160" height="8" rx="4"/><text x="88" y="178" class="s">8 / 8 PV · CA 12</text>
    <rect class="sub" x="28" y="192" width="234" height="64" rx="4"/><circle class="ally" cx="58" cy="224" r="20"/>
    <text x="88" y="216" class="t">Priest · niv. 1</text><rect class="hpbg" x="88" y="224" width="160" height="8" rx="4"/><rect class="hp" x="88" y="224" width="80" height="8" rx="4"/><text x="88" y="248" class="s">6 / 12 PV · CA 17 · béni</text>
    <rect class="sub active" x="28" y="262" width="234" height="64" rx="4"/><circle class="ally active" cx="58" cy="294" r="20"/>
    <text x="88" y="286" class="t">Scoundrel · niv. 1</text><rect class="hpbg" x="88" y="294" width="160" height="8" rx="4"/><rect class="hp" x="88" y="294" width="144" height="8" rx="4"/><text x="88" y="318" class="s">9 / 10 PV · CA 14 · 40 ft</text>
  </g>
  <text x="32" y="368" class="note">② les quatre profils, toujours visibles</text>

  <!-- La scène -->
  <g transform="translate(590 250)">
    <g id="grid"></g>
  </g>
  <g>
    <!-- grille 9 x 7 en isométrie, rapport 0,62 -->
    <g transform="translate(580 170)">
      <polygon class="tile" points="0,0 288,178.6 64,317.4 -224,138.9"/>
      <g stroke="#10191b" stroke-width=".6" opacity=".55">
        <path d="M32,19.8 L-192,158.7 M64,39.7 L-160,178.6 M96,59.5 L-128,198.4 M128,79.4 L-96,218.2 M160,99.2 L-64,238.1 M192,119 L-32,257.9 M224,138.9 L0,277.8 M256,158.7 L32,297.6"/>
        <path d="M-32,19.8 L256,198.4 M-64,39.7 L224,218.2 M-96,59.5 L192,238.1 M-128,79.4 L160,257.9 M-160,99.2 L128,277.8 M-192,119 L96,297.6"/>
      </g>
      <polygon class="reach" points="-64,79.4 64,158.7 -32,218.2 -160,138.9"/>
      <polygon class="path" points="-32,99.2 0,119 -32,138.9 -64,119"/>
      <polygon class="path" points="0,119 32,138.9 0,158.7 -32,138.9"/>
      <polygon class="target" points="64,119 96,138.9 64,158.7 32,138.9"/>
      <circle class="ally active" cx="-64" cy="108" r="13"/><text x="-64" y="112" text-anchor="middle" class="t">Sc</text>
      <circle class="ally" cx="96" cy="108" r="13"/><text x="96" y="112" text-anchor="middle" class="t">Br</text>
      <circle class="foe" cx="64" cy="128" r="13"/><text x="64" y="132" text-anchor="middle" class="t">G1</text>
      <circle class="foe" cx="128" cy="188" r="13"/><text x="128" y="192" text-anchor="middle" class="t">G2</text>
      <circle class="ally" cx="-96" cy="168" r="13"/><text x="-96" y="172" text-anchor="middle" class="t">Pr</text>
      <circle class="ally" cx="-128" cy="128" r="13"/><text x="-128" y="132" text-anchor="middle" class="t">Ma</text>
      <circle class="foe" cx="160" cy="128" r="13"/><text x="160" y="132" text-anchor="middle" class="t">Ar</text>
    </g>
    <text x="392" y="132" class="note">③ cases atteignables, chemin, cible : les gestes du curseur déjà livrés</text>
  </g>

  <!-- Prévisualisation -->
  <rect class="panel" x="906" y="16" width="258" height="250" rx="6"/>
  <text x="922" y="40" class="h">PRÉVISUALISATION</text>
  <text x="922" y="68" class="t">Rapière → Gladiateur 1</text>
  <text x="922" y="92" class="s">Toucher  d20 + 5 contre CA 15  ·  55 %</text>
  <text x="922" y="112" class="s">Dégâts  1d8 + 3 perforant</text>
  <rect class="sub" x="918" y="126" width="234" height="58" rx="4"/>
  <text x="930" y="148" class="t" fill="#d2ac62">+ Attaque sournoise  1d8</text>
  <text x="930" y="168" class="s">la cible est adjacente au Brawler</text>
  <text x="922" y="208" class="s">Attendu  6,1 dégâts · cible à 18 / 22 PV</text>
  <text x="922" y="244" class="note">④ la prévisualisation est le jet —</text>
  <text x="922" y="258" class="note">elle nomme la capacité qui joue</text>

  <rect class="panel" x="906" y="282" width="258" height="146" rx="6"/>
  <text x="922" y="306" class="h">CIBLE</text>
  <circle class="foe" cx="946" cy="346" r="20"/>
  <text x="978" y="338" class="t">Gladiateur 1</text>
  <rect class="hpbg" x="978" y="346" width="160" height="8" rx="4"/><rect class="hp" x="978" y="346" width="130" height="8" rx="4" fill="#d0566b"/>
  <text x="978" y="370" class="s">ensanglanté : non · CA 15 (vue)</text>
  <text x="922" y="408" class="note">⑤ rien que ce que la table voit</text>

  <!-- Barre d'actions -->
  <rect class="panel" x="16" y="548" width="1148" height="100" rx="6"/>
  <circle class="ally active" cx="66" cy="598" r="32"/><text x="66" y="603" text-anchor="middle" class="t">Sc</text>
  <text x="116" y="580" class="t">Scoundrel — à vous</text>
  <text x="116" y="600" class="s">Action ● · Bonus ● · Déplacement 40 / 40 ft</text>
  <text x="116" y="632" class="note">⑥ ce qu'il reste à faire ce tour</text>
  <g>
    <rect class="sub active" x="360" y="566" width="92" height="64" rx="4"/><text x="406" y="594" text-anchor="middle" class="t">Rapière</text><text x="406" y="614" text-anchor="middle" class="s">+5 · 1d8+3</text>
    <rect class="sub" x="460" y="566" width="92" height="64" rx="4"/><text x="506" y="594" text-anchor="middle" class="t">Arc court</text><text x="506" y="614" text-anchor="middle" class="s">80 / 320 ft</text>
    <rect class="sub" x="560" y="566" width="92" height="64" rx="4"/><text x="606" y="594" text-anchor="middle" class="t">Dague</text><text x="606" y="614" text-anchor="middle" class="s">lancer 20 / 60</text>
    <rect class="sub" x="660" y="566" width="92" height="64" rx="4"/><text x="706" y="594" text-anchor="middle" class="t">Se cacher</text><text x="706" y="614" text-anchor="middle" class="s">Discrétion</text>
    <rect class="sub" x="760" y="566" width="92" height="64" rx="4"/><text x="806" y="594" text-anchor="middle" class="t">Esquiver</text>
    <rect class="sub" x="860" y="566" width="92" height="64" rx="4"/><text x="906" y="594" text-anchor="middle" class="t">Attendre</text>
    <rect x="1020" y="566" width="128" height="64" rx="4" fill="#8e2335" stroke="#c9a45c"/><text x="1084" y="603" text-anchor="middle" class="t">FIN DU TOUR</text>
  </g>

  <!-- Journal -->
  <rect class="panel" x="16" y="384" width="258" height="150" rx="6"/>
  <text x="32" y="408" class="h">JOURNAL</text>
  <text x="32" y="432" class="s">Priest lance Bless : Brawler, Scoundrel, Priest.</text>
  <text x="32" y="452" class="s">Gladiateur 2 touche Priest : 6 contondant.</text>
  <text x="32" y="472" class="s">Brawler : Tough as Nails, 8 → 4 tranchant.</text>
  <text x="32" y="492" class="s">Mage : Magic Missile (1 / 2 restant).</text>
  <text x="32" y="520" class="note">⑦ chaque capacité qui joue a sa ligne</text>
</svg>
