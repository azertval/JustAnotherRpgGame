# Catalogue des versions, dans l'ordre où elles se livrent. C'est ce fichier que lisent le lint
# (`outils/lint_planning.py`) et le site (`outils/build_planning_site.py`).
#
#   nature = "detaillee"       la version a ses lots, ses livrables, ses maquettes
#   nature = "previsionnelle"  la version a un périmètre, pas encore de lots : elle se détaille
#                              quand la précédente approche de sa fin — pas avant
#
# `referentiel` regroupe les versions sous le jalon majeur qu'elles servent.

# ------------------------------------------------------------------------------------------------
# Référentiel 0.1.0 — l'Empire central
# ------------------------------------------------------------------------------------------------

[[version]]
id = "0.0.1"
titre = "Démo basique"
nature = "detaillee"
referentiel = "0.1.0"
dossier = "v0.1.0/v0.0.1-demo"
resume = "Deux quartiers de la Capitale et un donjon en 2D HD, et une quête qui les traverse : du marché de Martpart au sable de l'Arena of Fate."
objectifs = [
  "Le **standard 2D HD** : un style écrit, une arborescence d'assets durable, et plus un seul asset pixel art dans le dépôt.",
  "**Martpart** et **Arenarea**, et dans Arenarea le donjon de l'**Arena of Fate** : assets HD, carte jouable et carte de l'onglet « Carte » pour chacun.",
  "Les PNJ des trois cartes : nommés, neutres, et les combattants de l'arène.",
  "La quête **« Des pommes pour l'arène »**, jouable de bout en bout : dialogue, jet de Persuasion, combat seul contre un, deux fins.",
]
criteres_de_sortie = [
  "Un joueur qui ne connaît pas le projet termine la démo par chacune de ses **trois issues** (persuasion réussie, victoire, mort) sans aide.",
  "Aucun asset pixel art ne reste dans `Source/Elements/Assets/` (les cartes peintes et le HUD, déjà au standard, sont gardés) ; la galerie de débug montre tous les assets HD.",
  "Toutes les cartes de la démo — l'Arena of Fate en compte deux, un niveau étant une carte — passent le contrôle de l'éditeur (`--check`) et se parcourent sans case inatteignable.",
  "La CI est verte, l'installeur se lance sur un poste vierge, le tag `v0.0.1` est posé.",
]
sources = [
  "Tanares Sourcebook — la Capitale et ses quartiers (chapitre Central Empire)",
  "Character Compendium — PNJ de l'Empire central (index p. 166)",
]

