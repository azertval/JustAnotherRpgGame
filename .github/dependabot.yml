# Mises à jour automatiques des dépendances que Dependabot sait lire.
#
# Les actions GitHub sont épinglées par SHA de commit (le tag en commentaire) : un tag se réécrit, un
# commit non. Le prix de cet épinglage est qu'il ne bouge plus jamais seul — ce fichier le fait
# bouger, par PR, pour qu'une montée de version reste une décision relue et passée par la CI.
#
# Hors de portée de Dependabot :
# - les `GIT_TAG` de FetchContent (External/CMakeLists.txt) — Dependabot ne lit pas CMake ; suivis par
#   Renovate (renovate.json, phase 4), qui ne suit QUE cela ;
# - les versions d'outils écrites dans `env:` de ci.yml (LLVM, Doxygen, OpenCppCoverage, AQT_SOURCE,
#   SCCACHE_VERSION, PRE_COMMIT_VERSION, UV_VERSION, PSSCRIPTANALYZER_VERSION) — seulement du texte,
#   suivi à la main ;
# - les hooks de .pre-commit-config.yaml — `pre-commit autoupdate --freeze`, puis
#   `scripts/ci/check_tool_pins.py` pour clang-format.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" couvre .github/workflows ; l'action composite setup-qt se déclare à part.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    # Une version d'action publiée depuis moins d'une semaine n'est pas proposée : le temps qu'une
    # publication compromise soit repérée et retirée en amont, avant qu'elle n'atteigne le runner.
    cooldown:
      default-days: 7
    # Une PR par semaine pour toutes les actions, plutôt qu'une par action : chacune coûte un run
    # complet de la CI Windows.
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ci

  # Dépendances Python des scripts (phase 4) : pyproject.toml et uv.lock. jsonschema, pytest et Pillow
  # sont épinglés à la version exacte ; Dependabot met à jour les deux fichiers dans la même PR.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: [ "*" ]
    commit-message:
      prefix: build
