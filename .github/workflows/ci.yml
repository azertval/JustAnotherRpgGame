name: CI

# Vérifications exécutées sur chaque Pull Request vers main.
# Ce job est le contrôle requis pour merger (protection de branche).
on:
  pull_request:
    branches: [ main ]
  # Relance manuelle (onglet Actions) sans pousser de commit vide.
  workflow_dispatch:

# Un nouveau push sur la branche d'une PR rend le run précédent sans objet : on l'annule au lieu de
# laisser trois runs de la même branche occuper les runners Windows en parallèle.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Aucun job de ce workflow n'écrit dans le dépôt : jeton en lecture seule, explicitement, plutôt que
# de dépendre du réglage par défaut du dépôt.
permissions:
  contents: read

env:
  # Version de Qt épinglée (EX-BUILD-010), identique à `QT_VERSION_MINIMUM` dans
  # `Source/HMI/CMakeLists.txt` — vérifié automatiquement par
  # `scripts/ci/check_qt_version_pin.py` (job lint-exigences) pour que les deux ne divergent jamais
  # silencieusement.
  QT_VERSION: '6.11.2'
  # aqtinstall publie sur PyPI (3.3.0) ne sait PAS installer Qt >= 6.11 : Qt a change la
  # disposition de son depot (`qt6_6112/qt6_6112_msvc2022_64/`, un sous-dossier par architecture,
  # au lieu de `qt6_6103/qt6_6103/`), et 3.3.0 code en dur l'ancienne. Le correctif amont est
  # merge (miurahr/aqtinstall PR #1000, issues #959/#1007) mais pas encore publie. `aqtsource`
  # (entree de install-qt-action, prioritaire sur `aqtversion`) permet de pointer le depot git ;
  # le SHA est EPINGLE et non `@master`, sinon le provisionnement deriverait silencieusement, ce
  # que `EX-BUILD-010` / `EX-NFR-031` interdisent. A REMPLACER par `aqtversion: '==3.3.1'` des
  # qu'aqtinstall 3.3.1 parait sur PyPI -- cette URL git n'a pas vocation a rester.
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
  # Version de Doxygen épinglée (EX-NFR-031, même esprit que EX-BUILD-010 pour Qt).
  # `apt-get install doxygen` livre la version de la distribution (1.9.x sur
  # ubuntu-latest), dont les règles de résolution de liens diffèrent de celles des
  # versions récentes : une documentation générée sans avertissement en local
  # échouait en CI. Poste de développement et CI doivent exécuter la MÊME version,
  # sinon la vérification locale ne prédit rien.
  DOXYGEN_VERSION: 1.16.1
  # Version de LLVM (clang-tidy, clang-format) épinglée pour la même raison que Doxygen : deux
  # versions majeures ne signalent/ne formatent pas identiquement, et un contrôle qui ne prédit
  # pas le résultat local ne sert qu'à agacer. Installer la même version en local pour que
  # `clang-tidy`/`clang-format` prédisent le verdict de la CI.
  # Relevée de 18.1.8 a 20.1.8 (branche fix/clang-tidy-triage) : l'image `windows-2022` du runner
  # a progresse vers un toolset MSVC dont le STL refuse desormais de se laisser analyser par un
  # clang-cl plus ancien que Clang 19 (`static_assert ... STL1000 : Unexpected compiler version,
  # expected Clang 19.0.0 or newer` dans `yvals_core.h`, sur CHAQUE fichier) -- 18.1.8 echouait a
  # se compiler lui-meme, pas un defaut du code analyse. 20.1.8 choisie car disponible identique
  # sur Chocolatey (clang-tidy) et PyPI (clang-format), une marge au-dessus du minimum strict.
  LLVM_VERSION: 20.1.8
  # Version d'OpenCppCoverage épinglée, même raison que Doxygen/LLVM ci-dessus : le workflow
  # l'installait jusqu'ici sans version fixée.
  OPENCPPCOVERAGE_VERSION: 0.9.9.0
  # Gestionnaire de l'environnement Python des scripts (phase 4). Les dépendances elles-mêmes
  # (jsonschema, épinglé ici depuis le LOT-32, pytest, Pillow) sont dans pyproject.toml et figées
  # par uv.lock : `uv sync --locked` installe sur le runner exactement ce que le poste installe.
  UV_VERSION: 0.12.15
  # Lint des scripts PowerShell (phase 4), même version sur le poste (`scripts/setup_dev.ps1`).
  PSSCRIPTANALYZER_VERSION: 1.25.0
  # Cache de compilation des jobs Ninja (phase 2) : le CMakeLists racine l'utilise dès qu'il est
  # dans le PATH, et `scripts/setup_dev.ps1` installe cette même version sur le poste.
  SCCACHE_VERSION: 0.18.0
  # Moteur des hooks de .pre-commit-config.yaml (phase 2), même version sur le poste
  # (`scripts/setup_dev.ps1`). Les versions des hooks eux-mêmes sont épinglées dans ce fichier-là.
  PRE_COMMIT_VERSION: 4.6.2
  # Seuil de couverture : cliquet anti-régression, pas un objectif. Mesuré
  # localement le 2026-08-10 (build Ninja Debug, UnitTests+IntegrationTests+SystemTests fusionnés) :
  # 93.66 % (8602/9184 lignes). Seuil calé avec une marge explicite de ~8.5 points, pour
  # absorber l'écart possible avec la mesure en CI (preset `vs`, image `windows-2022`, non reproduite ici).
  COVERAGE_THRESHOLD_PERCENT: 85

jobs:
  build-test-coverage:
    # Épinglé : windows-latest (image 2025) ne fournit pas le générateur VS 2022.
    runs-on: windows-2022
    # Borne haute : un job bloqué (test qui ne termine pas, runner figé) échoue au lieu d'occuper le
    # runner six heures, la valeur par défaut de GitHub. Large marge sur la durée observée.
    timeout-minutes: 60
    permissions:
      contents: read
      # Codecov authentifie l'envoi par OIDC : aucun jeton à stocker en secret.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Avertissements MSVC et assertions GoogleTest en annotations sur la ligne du diff (phase 1) :
      # /WX bloquait déjà, mais le message était enfoui dans le log. Actif pour toutes les étapes
      # suivantes du job ; définition unique dans .github/problem-matchers/msvc.json.
      - name: Annotations du compilateur et des tests
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      # Nécessaire pour construire l'application Qt (JustAnotherRpgGame). Définition unique
      # des modules et de l'action : .github/actions/setup-qt/action.yml.
      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (CMake)
        # install-qt-action exporte QT_ROOT_DIR ; on le passe en CMAKE_PREFIX_PATH pour que
        # find_package(Qt6) résolve dans le preset vs.
        run: cmake --preset vs
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset vs

      - name: Test (CTest)
        # Rapport JUnit : un cas par test GoogleTest (gtest_discover_tests), publié dans la PR par le
        # job test-report. Chemin absolu : --output-junit est sinon relatif au dossier de build.
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ctest --preset vs --output-junit "$env:GITHUB_WORKSPACE/test-results/junit-debug.xml"

      - name: Conserver le rapport de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-debug
          path: test-results/
          if-no-files-found: ignore

      # QmlTests (phase 4) écrit la capture et l'image des différences de chaque écran qui s'écarte
      # de sa référence : c'est ce qu'il faut regarder pour trancher régression ou changement voulu.
      - name: Conserver les captures d'ecran en ecart
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-captures-debug
          path: build/vs/qml-captures/
          if-no-files-found: ignore

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        # Si Qt n'est pas résolu, la cible JustAnotherRpgGame est ignorée et le build « réussit » sans
        # produire d'application : une panne muette que seul ce contrôle rend visible.
        run: |
          $exe = 'build/vs/bin/Debug/JustAnotherRpgGame.exe'
          if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
          Write-Host "OK : $exe"

      - name: Verifier que le module audio est deploye
        shell: pwsh
        # windeployqt ne depose Qt6Multimediad.dll que s'il detecte l'usage reel de la bibliotheque
        # ('d' : suffixe des DLL Qt de configuration Debug) : un build local peut compiler sans
        # jamais prouver que le zip de release sera sonore. C'est le seul controle qui valide
        # reellement le deploiement du module.
        run: |
          $dll = 'build/vs/bin/Debug/Qt6Multimediad.dll'
          if (-not (Test-Path $dll)) { throw "Bibliotheque audio non deployee : $dll" }
          Write-Host "OK : $dll"

      - name: Install OpenCppCoverage ${{ env.OPENCPPCOVERAGE_VERSION }}
        run: choco install opencppcoverage --version=${{ env.OPENCPPCOVERAGE_VERSION }} -y --no-progress --allow-downgrade

      - name: Coverage (UnitTests + IntegrationTests + SystemTests, fusionnes)
        shell: pwsh
        # Les trois suites, fusionnées -- le rapport ne mesurait que UnitTests.exe. Même
        # script que le site qualité (docs.yml) et que le poste (phase 4) : coverage.xml et
        # coverage-html/ à la racine du workspace.
        run: ./scripts/coverage.ps1 -BinDir build/vs/bin/Debug

      - name: Seuil de couverture
        shell: pwsh
        # Le seuil est un cliquet anti-régression, pas un objectif :
        # une chute EN DESSOUS fait échouer la CI, il n'est pas destiné à forcer une hausse.
        run: |
          [xml]$report = Get-Content coverage.xml
          $percent = [math]::Round([double]$report.coverage.'line-rate' * 100, 2)
          Write-Host "Couverture agregee (UnitTests+IntegrationTests+SystemTests) : $percent %"
          $threshold = ${{ env.COVERAGE_THRESHOLD_PERCENT }}
          if ($percent -lt $threshold) {
            Write-Error "Couverture $percent % sous le seuil $threshold % (EX-NFR-022)."
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-html/

      # Couverture des lignes AJOUTÉES par la PR, commentée dans la PR (phase 1). Le cliquet global
      # ci-dessus laisse passer 300 lignes non testées tant que la moyenne tient ; Codecov les
      # montre. Informatif (codecov.yml) : le seul seuil bloquant reste celui de ce fichier.
      # Pas de Dependabot ici : ses PR n'ont pas de jeton OIDC et ne touchent pas au C++.
      - name: Envoyer la couverture a Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          # Un service tiers indisponible ne doit pas rendre la PR rouge.
          fail_ci_if_error: false

      - name: Resume du job
        if: ${{ !cancelled() }}
        run: >-
          python scripts/ci/ci_summary.py --title "Debug (preset vs)"
          --junit test-results/junit-debug.xml
          --coverage coverage.xml --threshold ${{ env.COVERAGE_THRESHOLD_PERCENT }}
          --file build/vs/bin/Debug/JustAnotherRpgGame.exe

  build-test-release:
    # Les deux jobs ci-dessus (et l'historique de la CI avant ce job) ne construisent et ne testent
    # qu'en Debug. Le premier build Release avait lieu dans release.yml, DÉCLENCHÉ PAR LE TAG : une
    # casse Release-only (variable lue uniquement par une assertion, donc inutilisée sous NDEBUG,
    # cf. 90f85254) n'était découverte qu'après un tag public. Ce job la découvre en PR.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Annotations du compilateur et des tests
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (CMake)
        run: cmake --preset vs
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Release)
        run: cmake --build --preset vs-release

      - name: Test (CTest, Release)
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ctest --preset vs-release --output-junit "$env:GITHUB_WORKSPACE/test-results/junit-release.xml"

      - name: Conserver le rapport de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release
          path: test-results/
          if-no-files-found: ignore

      - name: Conserver les captures d'ecran en ecart
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-captures-release
          path: build/vs/qml-captures/
          if-no-files-found: ignore

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        run: |
          $exe = 'build/vs/bin/Release/JustAnotherRpgGame.exe'
          if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
          Write-Host "OK : $exe"

      - name: Resume du job
        if: ${{ !cancelled() }}
        run: >-
          python scripts/ci/ci_summary.py --title "Release (preset vs-release)"
          --junit test-results/junit-release.xml
          --file build/vs/bin/Release/JustAnotherRpgGame.exe

  build-ninja:
    # Le preset `vs` s'appuie sur MSBuild, qui établit lui-même l'environnement MSVC ; le preset
    # `ninja` hérite au contraire de celui du terminal. N'étant couvert par aucun job, il avait
    # silencieusement cessé de fonctionner. Ce job garantit que les deux générateurs restent
    # utilisables — et vérifie au passage la détection automatique de Qt (via QT_ROOT_DIR).
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Deux commits : le commit de fusion de la PR et son premier parent, la base -- ce qui
          # dit quelles cartes la PR change (etape --render, LOT-EDITOR-13).
          fetch-depth: 2

      # Cache de compilation (phase 2), stocké dans le cache GitHub Actions. Le CMakeLists racine
      # l'active dès que `sccache` est dans le PATH. Le cache d'une PR ne sert qu'à cette PR (la CI
      # ne tourne pas sur main) : le gain vient au deuxième push. Statistiques en fin de job.
      - name: Cache de compilation (sccache ${{ env.SCCACHE_VERSION }})
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v${{ env.SCCACHE_VERSION }}

      - name: Annotations du compilateur et des tests
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure, build et test (Ninja, environnement x64)
        shell: cmd  # zizmor: ignore[misfeature] -- vcvars64.bat et CMake doivent partager un processus
        # vcvars64.bat doit être appelé dans le MÊME processus que CMake : son effet est
        # l'environnement du shell, que `run` ne conserve pas d'une étape à l'autre. vswhere
        # localise l'installation sans coder en dur l'édition de Visual Studio de l'image.
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake --preset ninja || exit /b 1
          cmake --build --preset ninja || exit /b 1
          if not exist test-results mkdir test-results
          ctest --preset ninja --output-junit "%GITHUB_WORKSPACE%\test-results\junit-ninja.xml" || exit /b 1
          rem Controle statique des .qml (LOT-86, EX-IHM-100). La cible est ENGENDREE par
          rem qt_add_qml_module : elle connait les chemins d'import de chaque module, qu'il
          rem faudrait sinon recomposer a la main -- et qui divergeraient au premier ecran ajoute.
          rem `all_qmllint` couvre les trois modules du jeu (Jadg.Ui, Jadg.App, Jadg.Runtime).
          cmake --build --preset ninja --target all_qmllint || exit /b 1
          rem Catalogue de traduction a jour du code (phase 4) : lupdate relit le QML et le C++, une
          rem chaine ajoutee sans traduction y apparait inachevee et le controle la refuse. Le .ts
          rem reecrit ici n'est pas pousse : c'est au poste de le mettre a jour et de le traduire.
          cmake --build --preset ninja --target update_translations || exit /b 1
          python scripts\checks\check_translations.py || exit /b 1

      - name: Verifier que l'executable est bien produit
        shell: pwsh
        # Sans Qt, la cible JustAnotherRpgGame est ignorée et le build « réussit » sans exécutable :
        # c'est exactement la panne que ce lot corrige, donc on l'érige en contrôle.
        run: |
          foreach ($exe in @('build/ninja/bin/JustAnotherRpgGame.exe', 'build/ninja/bin/LevelEditor.exe')) {
            if (-not (Test-Path $exe)) { throw "Executable absent : $exe" }
            Write-Host "OK : $exe"
          }

      - name: Controler les cartes (LevelEditor --check)
        shell: pwsh
        # LOT-EDITOR-12 (constat A12) : la seule garde des cartes etait le `--check` des scripts
        # qui les posent, et il ne tournait pas en CI. Celui de l'editeur relit toutes les cartes de
        # Source/Elements/Levels -- version 4, ecriture canonique (octet pour octet), references,
        # pieces presentes au manifeste, collision egale a la deduction hors des cases forcees --
        # sans fenetre, et echoue a la premiere erreur.
        run: build/ninja/bin/LevelEditor.exe --data Source/Elements --check

      - name: Rendre les cartes que la PR change (LevelEditor --render)
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        # LOT-EDITOR-13 : une carte se relit en diff, mais une image dit d'un coup d'oeil ce que la
        # PR a change. Chaque carte modifiee ou ajoutee sous Source/Elements/Levels est rendue en
        # isometrie, sans fenetre, par le peintre du canevas, et publiee en artefact. Demi-echelle :
        # la carte vue a 540p, une case a 50 pixels -- lisible, et une carte de 48 x 40 tient dans
        # 2 200 pixels de large (LOT-125 ; l'image ne depasse jamais 8 192 pixels de cote).
        run: |
          $maps = @(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'Source/Elements/Levels/' |
            Where-Object { $_ -like '*.json' -and $_ -notlike '*.editor.json' -and (Split-Path $_ -Leaf) -notlike 'sequence-*' })
          if ($maps.Count -eq 0) {
            Write-Host 'Aucune carte changee par cette PR.'
            exit 0
          }
          build/ninja/bin/LevelEditor.exe --data Source/Elements --render @maps --scale 0.5 --output map-renders
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Cartes rendues (artefact ``map-renders``)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($map in $maps) { "- ``$map``" >> $env:GITHUB_STEP_SUMMARY }

      - name: Publier le rendu des cartes changees
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-renders
          path: map-renders/
          if-no-files-found: ignore

      - name: Conserver le rapport de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-ninja
          path: test-results/
          if-no-files-found: ignore

      - name: Conserver les captures d'ecran en ecart
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-captures-ninja
          path: build/ninja/qml-captures/
          if-no-files-found: ignore

      - name: Resume du job
        if: ${{ !cancelled() }}
        run: >-
          python scripts/ci/ci_summary.py --title "Ninja (preset ninja) et qmllint"
          --junit test-results/junit-ninja.xml
          --file build/ninja/bin/JustAnotherRpgGame.exe
          --file build/ninja/bin/LevelEditor.exe

  sanitize:
    # ENABLE_ASAN n'etait cable dans aucun workflow : EX-NFR-003
    # (empreinte memoire, verifiable via AddressSanitizer) etait orpheline. Ce job instrumente les
    # trois executables de test (jamais l'application Qt/D3D11, injouable sans affichage) et les
    # execute -- meme etablissement de l'environnement MSVC que build-ninja.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache de compilation (phase 2), stocké dans le cache GitHub Actions. Le CMakeLists racine
      # l'active dès que `sccache` est dans le PATH. Le cache d'une PR ne sert qu'à cette PR (la CI
      # ne tourne pas sur main) : le gain vient au deuxième push. Statistiques en fin de job.
      - name: Cache de compilation (sccache ${{ env.SCCACHE_VERSION }})
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v${{ env.SCCACHE_VERSION }}

      - name: Annotations du compilateur et des tests
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure, build et execution sous AddressSanitizer
        id: asan
        shell: cmd  # zizmor: ignore[misfeature] -- vcvars64.bat et CMake doivent partager un processus
        # Tout dans UN SEUL step : chaque step GitHub Actions demarre un cmd.exe neuf, et
        # l'effet de vcvars64.bat (PATH, dont le dossier de la DLL runtime ASan) ne survit pas
        # d'un step a l'autre. Executer les .exe dans un step separe les fait echouer avant meme
        # d'afficher un rapport ASan (clang_rt.asan_dynamic-x86_64.dll introuvable, exit code 1
        # sans message).
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake -S . -B build/ninja-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_EDITOR_QT=OFF || exit /b 1
          cmake --build build/ninja-asan || exit /b 1
          build\ninja-asan\bin\UnitTests.exe || exit /b 1
          build\ninja-asan\bin\IntegrationTests.exe || exit /b 1
          build\ninja-asan\bin\SystemTests.exe || exit /b 1

      - name: Resume du job
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OUTCOME: ${{ steps.asan.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            verdict="UnitTests, IntegrationTests et SystemTests exécutés sous ASan **sans rapport**."
          else
            verdict="**Échec** (\`$OUTCOME\`) : compilation, ou rapport ASan dans le log de l'étape."
          fi
          printf '### AddressSanitizer\n\n%s\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"

  clang-tidy:
    # .clang-tidy est complet depuis le debut du projet et n'etait execute nulle part :
    # conventions.md le presentait comme de l'outillage « en place », a tort. Analyse ciblee sur le
    # DIFF de la PR (pas tout le depot) : la dette existante (jamais passee au crible) ne bloque
    # personne, et le cout de ce job ne croit pas avec la taille du depot. Seule bugprone-* est
    # bloquante (WarningsAsErrors dans .clang-tidy, apres triage) ; les autres
    # familles (cppcoreguidelines-*, modernize-*, performance-*, readability-*) restent visibles
    # dans les logs sans faire echouer le job : un triage complet est hors budget.
    # windows-2022 (pas Linux) : le code inclut Direct3D 11/Windows.h, indisponibles sous Linux.
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      # Envoi du SARIF à Code scanning (annotations sur le diff, phase 1).
      security-events: write
    env:
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Cache de compilation (phase 2), stocké dans le cache GitHub Actions. Le CMakeLists racine
      # l'active dès que `sccache` est dans le PATH. Le cache d'une PR ne sert qu'à cette PR (la CI
      # ne tourne pas sur main) : le gain vient au deuxième push. Statistiques en fin de job.
      - name: Cache de compilation (sccache ${{ env.SCCACHE_VERSION }})
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v${{ env.SCCACHE_VERSION }}

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Install LLVM (clang-tidy) ${{ env.LLVM_VERSION }}
        run: choco install llvm --version=${{ env.LLVM_VERSION }} -y --no-progress --allow-downgrade

      - name: Configure (Ninja, compile_commands.json, sans PCH)
        # ENABLE_PCH=OFF : le fichier .pch genere par MSVC n'est pas un format que clang-tidy sait
        # lire, l'analyse echouerait sur chaque fichier avec un message qui ne parle pas de PCH.
        shell: cmd  # zizmor: ignore[misfeature] -- vcvars64.bat et CMake doivent partager un processus
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake -S . -B build/ninja-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_PCH=OFF || exit /b 1
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (genere les en-tetes AUTOUIC/AUTOMOC, ui_*.h/moc_*.cpp)
        # clang-tidy lit compile_commands.json mais n'execute jamais AUTOUIC/AUTOMOC lui-meme : sans
        # ce build, tout fichier incluant "ui_*.h" (widgets avec un formulaire .ui) echoue a l'analyse
        # avec "file not found", une erreur de configuration CI, pas un defaut du code (confirme en
        # premiere execution reelle).
        shell: cmd  # zizmor: ignore[misfeature] -- vcvars64.bat et CMake doivent partager un processus
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          )
          cmake --build build/ninja-tidy || exit /b 1

      - name: clang-tidy sur les fichiers modifies par la PR
        id: tidy
        shell: pwsh
        # Diff contre la base de la PR : seuls les fichiers Source/*.cpp reellement touches sont
        # analyses -- hors Source/Test, et hors Source/Fuzz et Source/Benchmark, que cette
        # configuration ne compile pas (options BUILD_FUZZERS / BUILD_BENCHMARKS) : sans ligne de
        # commande dans compile_commands.json, clang-tidy echouerait sur leurs inclusions. --diff-filter=ACMR exclut les fichiers supprimes (sinon clang-tidy
        # echouerait a les trouver).
        # Relance manuelle (workflow_dispatch) : pas de base de PR, on compare a la branche par defaut.
        # Passees par l'environnement et non interpolees dans le script : un nom de branche n'est
        # jamais du code PowerShell.
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "$env:BASE_REF" --depth=1
          $files = git diff --name-only --diff-filter=ACMR "origin/$env:BASE_REF...HEAD" -- 'Source/*.cpp' |
            Where-Object { $_ -notmatch '^Source/(Test|Fuzz|Benchmark)/' }

          if (-not $files) {
            Write-Host "Aucun fichier Source/*.cpp modifie par cette PR : rien a analyser."
            "analysed=0" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "Fichiers analyses :`n$($files -join "`n")"
          "analysed=$(@($files).Count)" >> $env:GITHUB_OUTPUT
          # Créé d'emblée : un run sans aucun diagnostic produit un SARIF vide, pas une étape sautée.
          New-Item -ItemType File -Force clang-tidy.log | Out-Null
          $clangTidy = "C:\Program Files\LLVM\bin\clang-tidy.exe"
          $failed = $false
          foreach ($f in $files) {
            # La sortie standard (les diagnostics) est aussi copiée dans clang-tidy.log, que l'étape
            # suivante convertit en SARIF. $LASTEXITCODE reste celui de clang-tidy, pas du Tee.
            & $clangTidy -p build\ninja-tidy --extra-arg=-Wno-unused-command-line-argument $f |
              Tee-Object -FilePath clang-tidy.log -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) {
            Write-Error "clang-tidy : au moins une violation bloquante (bugprone-*)."
            exit 1
          }

      # Même sortie, rendue lisible (phase 1) : chaque diagnostic, bloquant ou non, devient une
      # annotation sur sa ligne dans la PR, et le tableau par famille s'affiche en tête du run.
      # Aucun contrôle ajouté -- le verdict reste celui de l'étape précédente.
      - name: Diagnostics clang-tidy en SARIF
        if: ${{ !cancelled() && hashFiles('clang-tidy.log') != '' }}
        env:
          ANALYSED: ${{ steps.tidy.outputs.analysed }}
        run: >-
          python scripts/ci/clang_tidy_sarif.py clang-tidy.log -o clang-tidy.sarif
          --root "$env:GITHUB_WORKSPACE" --analysed "$env:ANALYSED"
          --clang-tidy-version "$env:LLVM_VERSION" --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Envoyer le SARIF a Code scanning
        if: ${{ !cancelled() && hashFiles('clang-tidy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

      - name: Resume du job (aucun fichier analyse)
        if: ${{ !cancelled() && steps.tidy.outputs.analysed == '0' }}
        run: |
          "### clang-tidy`n`nAucun fichier ``Source/*.cpp`` modifié par cette PR : rien à analyser." >> $env:GITHUB_STEP_SUMMARY

  format:
    # CONTRIBUTING.md exige un code formate (clang-format) avant tout commit depuis le debut du
    # projet ; rien ne le verifiait. Controle, jamais reecriture : le job signale, il ne
    # pousse pas de commit de reformatage. Sur Linux (contrairement a clang-tidy) : clang-format
    # n'a pas besoin des en-tetes Direct3D/Windows, seulement du texte source.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format ${{ env.LLVM_VERSION }}
        # Le paquet PyPI redistribue les binaires officiels LLVM : meme mecanisme et memes
        # garanties de version que le job clang-tidy, sans installer tout LLVM.
        run: pip install "clang-format==${{ env.LLVM_VERSION }}"

      # Chaque écart de formatage en annotation sur sa ligne (phase 1).
      - name: Annotations clang-format
        run: echo "::add-matcher::.github/problem-matchers/clang-format.json"

      - name: Verifier le formatage (Source/, hors External/)
        # bash de GitHub tourne en -o pipefail : l'échec de xargs traverse le tee.
        run: |
          clang-format --version
          git ls-files 'Source/*.cpp' 'Source/*.h' > checked-files.txt
          xargs clang-format --dry-run --Werror --style=file < checked-files.txt 2>&1 | tee clang-format.log

      - name: Resume du job
        if: ${{ !cancelled() }}
        run: |
          checked=$(wc -l < checked-files.txt 2>/dev/null || echo 0)
          bad=$(grep -o '^[^:]*:[0-9]*:[0-9]*: error: .*\[-Wclang-format-violations\]' clang-format.log 2>/dev/null |
            cut -d: -f1 | sort -u || true)
          {
            echo '### clang-format'
            echo
            if [ -z "$bad" ]; then
              echo "$checked fichier(s) vérifié(s), aucun écart."
            else
              echo "$checked fichier(s) vérifié(s), **$(echo "$bad" | wc -l) mal formaté(s)** :"
              # shellcheck disable=SC2016 # backticks Markdown littéraux, pas une substitution
              echo "$bad" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint-exigences:
    # Contrôle du référentiel d'exigences (EX-...) : unicité des déclarations et
    # absence de référence orpheline. Léger et portable (Python), donc sur Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Environnement Python des scripts (phase 4) : les versions de uv.lock, celles du poste. Le
      # dossier .venv/bin passe en tête du PATH, donc chaque `python3 scripts/…` ci-dessous s'exécute
      # avec ces dépendances — et scripts/check.py lit toujours ces lignes telles quelles.
      - name: Installer uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Environnement Python des scripts (uv.lock)
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint des identifiants d'exigences
        id: exigences
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/lint_exigences.py

      # La planification (Planning/) est la source de TOUS les lots : ceux a venir, et, depuis la
      # refonte de la documentation, les lots livres (version 0.0.0) ; les deux anciennes feuilles de
      # route sont archivees sous Planning/vision/archives/. Ce lint refuse une fiche de lot
      # illisible, un prerequis inconnu ou cyclique, un lot qui attend une version ulterieure, un lot
      # livre avant ses prerequis, une maquette ou un lien qui ne mene nulle part.
      - name: Lint de la planification
        id: planning
        if: ${{ !cancelled() }}
        run: python3 Planning/outils/lint_planning.py

      - name: Version de Qt coherente CMake / CI (EX-BUILD-010)
        id: qt_pin
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_qt_version_pin.py

      # Garde-fou de la separation conception / code (LOT-86). Le depot a deja paye deux fois le
      # prix d'une regle non verifiee : le plancher de taille des ecrans, corrige TROIS fois, et
      # la palette d'identite ecrite DEUX fois sans que rien ne relie les copies. Une regle qui
      # n'est pas verifiee n'est pas une regle, c'est une intention.
      - name: Separation conception / code (EX-IHM-100 a EX-IHM-105)
        id: ui_layers
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_ui_layers.py

      - name: Contrat des formulaires avec Qt Design Studio (LOT-87)
        # Ce qu'un formulaire nomme doit se resoudre SANS le jeu, et chaque type C++ a sa doublure
        # pour l'atelier. Textuel, sans Qt.
        id: designer
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_qml_designer_compat.py

      # Les pages (guide, specifications, cahier de test) sont du Markdown nu que rend
      # Documentation/outils/build_docs_site.py. Ce lint refuse une commande Doxygen restee dans une
      # page, un lien ou une ancre qui ne mene nulle part, une page qu'aucun sommaire ne cite, un
      # lot cite qui n'existe pas.
      - name: Lint de la documentation
        id: docs_pages
        if: ${{ !cancelled() }}
        run: python3 Documentation/outils/lint_docs.py

      - name: Cahier de test a jour
        id: cahier
        if: ${{ !cancelled() }}
        run: python3 scripts/docs/generate_cahier_test.py --check

      # Table d'autorite des termes de regle (LOT-30). Le lexique est une donnee VERSIONNEE ; les
      # PDF dont il sort ne le sont pas (EX-CNT-023), donc le runner n'a rien a extraire. Le
      # script s'auto-teste avant de se prononcer : aucune cle de regle n'existe encore, et un
      # controle vert par vacuite ne prouve rien -- c'est la panne du LOT-78.
      - name: Lexique de regles respecte par les catalogues de traduction
        id: glossary
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_glossary.py

      # Manifeste du corpus (LOT-30, etendu aux ressources VTT au LOT-38). Les PDF ne sont pas sur
      # le runner et ne le seront pas (EX-CNT-023) : ce controle ne verifie donc PAS les empreintes
      # -- c'est la charge de `python scripts/sourcebook verifier`, sur un poste qui a le corpus.
      # Il verifie ce qui EST versionne : que le manifeste se charge, que ses champs sont admis, et
      # que la logique d'empreinte fonctionne, eprouvee sur un corpus fictif ecrit en temporaire.
      - name: Manifeste du corpus bien forme (EX-CNT-020)
        id: corpus
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_corpus_manifest.py

      # Illustrations d'interface (LOT-87, LOT-94) : toutes PRODUITES depuis le cahier des assets ;
      # une provenance extraite du corpus est refusee. Le controle porte sur ce qui est versionne --
      # les images, leur manifeste, et le lien entre les deux et le code qui les nomme. Sans
      # dependance : hashlib et une lecture d'en-tete d'image.
      - name: Illustrations produites et conformes a leur manifeste (EX-IHM-076)
        id: ui_assets
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_ui_assets.py

      # Cartes de l'ecran « Carte » (LOT-94, LOT-95) : peintes par l'auteur, jamais extraites du
      # corpus. Le controle recoupe les images, leur manifeste, world-maps.json et l'atlas : une
      # region sans carte, une position qui designe un lieu inconnu, une carte retouchee sans
      # repasser par le manifeste. Sans dependance.
      - name: Cartes conformes a leur manifeste et a l'atlas (EX-IHM-076, EX-IHM-107)
        id: map_assets
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_map_assets.py

      # Assets HD installés (LOT-104) : sous Common/ et Regions/, tout fichier cité par un manifeste
      # existe, toute image est citée (EX-CNT-042), chaque pièce tient dans les bornes du standard
      # 2D HD, et chaque zone sous son budget de 40 Mio -- dont le poids s'écrit dans le résumé du
      # job. Les sources ne sont pas sur le runner : c'est l'installé qu'on contrôle. Sans dépendance.
      - name: Assets HD conformes a leur manifeste et au budget par zone (EX-CNT-042)
        id: hd_assets
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_hd_assets.py

      # Les cles d'assets d'ENTITE (LOT-39). Ce controle echoue sur une cle orpheline -- une
      # derogation malformee, ou qui nomme une famille inconnue (EX-CNT-040) -- mais se contente de
      # LISTER les cles encore servies par un marqueur genere (EX-CNT-041) : c'est un etat
      # d'avancement, pas un defaut. Le faire echouer la-dessus rendrait le depot rouge jusqu'a la
      # derniere illustration livree, et plus personne ne lirait sa sortie.
      - name: Cles d'assets d'entite (EX-CNT-040, EX-CNT-041)
        id: asset_keys
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_asset_keys.py

      # Contrats des catalogues RPG (LOT-32). jsonschema est la seule dependance externe de la
      # filiere contenu ; elle est EPINGLEE (uv.lock), meme raison que Qt, Doxygen et LLVM ailleurs
      # dans ce fichier : un validateur qui change de version sans qu'on le decide ne predit plus le
      # resultat local. Le script s'auto-teste sur scripts/fixtures/rpg/ avant de se prononcer --
      # aucun catalogue n'existe encore, et un validateur qui n'a rien valide ne prouve rien.
      - name: Catalogues RPG valides contre leurs schemas (EX-CNT-010)
        id: rpg_data
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_rpg_data.py

      # Cahier des assets de la charte v2 (LOT-87, T2.4). Dans ce job parce qu'il lui faut le meme
      # jsonschema epingle. Au-dela du schema : chaque jeton que ses prompts imposent existe dans
      # Tokens.qml, chaque zone tient dans sa maquette, chaque ecran consomme une piece, et la page
      # de documentation est a jour du JSON dont elle est engendree.
      - name: Cahier des assets conforme (EX-IHM-075, EX-IHM-053)
        id: assets_brief
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_assets_brief.py

      # Catalogue de traduction versionné (phase 4) : aucune traduction inachevée ou disparue,
      # marqueurs %1 identiques. Le job build-ninja rejoue ce contrôle après lupdate, qui seul sait
      # si le catalogue est à jour du code.
      - name: Traductions achevees et coherentes
        id: translations
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_translations.py

      # Lint des scripts PowerShell (phase 4). pwsh est sur l'image ; le module s'installe à la
      # version de ce fichier, et le script refuse toute autre version.
      - name: Installer PSScriptAnalyzer ${{ env.PSSCRIPTANALYZER_VERSION }}
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force

      - name: Scripts PowerShell (PSScriptAnalyzer)
        id: powershell
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_powershell.py

      # Parité du poste (phase 2). Un outil épinglé à deux endroits l'est à la même version :
      # clang-format dans ce fichier et dans .pre-commit-config.yaml, Doxygen ici et dans docs.yml.
      - name: Versions d'outils coherentes CI / hooks / docs
        id: tool_pins
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_tool_pins.py

      # Mêmes scripts que les hooks du poste, mais sur TOUT le dépôt : un commit passé avec
      # --no-verify, ou d'avant les hooks, est rattrapé ici.
      - name: Garde-fou binaires (taille, familles declarees dans .gitattributes)
        id: binaries
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_binary_files.py --all

      - name: JSON valides, sans cle en double ni BOM
        id: json_files
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_json_files.py --all

      # Les tests des scripts (phase 4), dont les auto-tests qui étaient ici une étape chacun : le
      # convertisseur clang-tidy et la fusion des SARIF (qui ne tournent que sur une PR C++ ou la
      # nuit, et casseraient en silence), les hooks du poste (message de commit, binaires, JSON), la
      # lecture de ce job par scripts/check.py, et chaque fixture des catalogues RPG. Le rapport
      # JUnit rejoint ceux des builds dans le job test-report.
      - name: Tests des scripts (pytest)
        id: pytest
        if: ${{ !cancelled() }}
        run: python3 -m pytest --junitxml=test-results/junit-scripts.xml

      - name: Conserver le rapport de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-scripts
          path: test-results/
          if-no-files-found: ignore

      # Un tableau des contrôles en tête du run (phase 1). Chaque contrôle ci-dessus s'exécute même
      # si un précédent a échoué : une PR voit d'un coup tout ce qu'elle casse, au lieu de le
      # découvrir un push à la fois.
      - name: Resume du job
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: |
            Identifiants d'exigences=${{ steps.exigences.outcome }}
            Planification=${{ steps.planning.outcome }}
            Version de Qt CMake / CI=${{ steps.qt_pin.outcome }}
            Séparation conception / code=${{ steps.ui_layers.outcome }}
            Contrat Qt Design Studio=${{ steps.designer.outcome }}
            Pages de documentation=${{ steps.docs_pages.outcome }}
            Cahier de test à jour=${{ steps.cahier.outcome }}
            Lexique de règles=${{ steps.glossary.outcome }}
            Manifeste du corpus=${{ steps.corpus.outcome }}
            Illustrations et manifeste=${{ steps.ui_assets.outcome }}
            Cartes, manifeste et atlas=${{ steps.map_assets.outcome }}
            Assets HD et budget par zone=${{ steps.hd_assets.outcome }}
            Clés d'assets d'entité=${{ steps.asset_keys.outcome }}
            Catalogues RPG=${{ steps.rpg_data.outcome }}
            Cahier des assets=${{ steps.assets_brief.outcome }}
            Traductions=${{ steps.translations.outcome }}
            Scripts PowerShell=${{ steps.powershell.outcome }}
            Versions d'outils CI / hooks / docs=${{ steps.tool_pins.outcome }}
            Garde-fou binaires=${{ steps.binaries.outcome }}
            JSON valides=${{ steps.json_files.outcome }}
            Tests des scripts (pytest)=${{ steps.pytest.outcome }}
        run: |
          {
            echo '### Contrôles du référentiel'
            echo
            echo '| Contrôle | Verdict |'
            echo '|---|---|'
            while IFS='=' read -r label outcome; do
              [ -z "$label" ] && continue
              case "$outcome" in
                success) verdict='✅ vert' ;;
                failure) verdict='❌ **rouge**' ;;
                *) verdict="⏭️ $outcome" ;;
              esac
              echo "| $label | $verdict |"
            done <<< "$OUTCOMES"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-commit:
    # Les hooks du poste (.pre-commit-config.yaml), rejoués sur tout le dépôt (phase 2) : ruff,
    # actionlint, zizmor, conflits de fusion et de casse, YAML, JSON, binaires. Le poste qui a
    # installé les hooks les a déjà passés ; ce job rattrape celui qui ne l'a pas fait, et prouve que
    # la configuration fonctionne ailleurs que sur Windows.
    # Sautés ici : `clang-format`, que le job `format` vérifie déjà avec ses annotations ;
    # `gitleaks`, qui ne lit que les fichiers indexés et n'aurait rien à lire.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer pre-commit ${{ env.PRE_COMMIT_VERSION }}
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"

      # Les environnements des hooks : leurs versions sont dans .pre-commit-config.yaml, d'où la clé.
      - name: Cache des environnements de hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Hooks sur tout le depot
        id: hooks
        env:
          SKIP: clang-format,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: Resume du job
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.hooks.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            verdict="tous verts sur l'ensemble du dépôt."
          else
            verdict="**échec** (\`$OUTCOME\`) : le hook fautif et son diff sont dans le log de l'étape. Rejouer sur le poste : \`pre-commit run --all-files\`."
          fi
          printf '### Hooks pre-commit\n\n%s\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"

  docs:
    # Génère la documentation Doxygen (garde-fou WARN_AS_ERROR) pour valider la
    # doc dès la PR, avec la même version de Doxygen que le déploiement (docs.yml).
    # Évite qu'une doc cassée n'atteigne main où seul docs.yml la construisait.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          set -euo pipefail
          tag="Release_${DOXYGEN_VERSION//./_}"
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          # Extrait hors du dépôt (RUNNER_TEMP) : le workspace reste propre.
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/${tag}/${archive}"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Doxygen version
        run: doxygen --version

      - name: Generate documentation
        id: doxygen
        run: python3 scripts/docs/build_docs.py

      # Les pages : le meme generateur que la publication, pour qu'une page qui ne se rend pas
      # casse la PR et non le site.
      - name: Generate the pages
        id: pages
        run: python3 Documentation/outils/build_docs_site.py --out "$RUNNER_TEMP/site"

      - name: Resume du job
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.doxygen.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            verdict="générée sans avertissement (WARN_AS_ERROR)."
          else
            verdict="**échec** (\`$OUTCOME\`) : les avertissements sont dans le log de l'étape."
          fi
          printf '### Documentation\n\nDoxygen %s : %s\n' "$DOXYGEN_VERSION" "$verdict" >> "$GITHUB_STEP_SUMMARY"

  test-report:
    # Les 1 146 tests n'étaient visibles qu'en ouvrant le log (phase 1). Ce job publie les rapports
    # JUnit des trois builds (et, depuis la phase 4, des tests des scripts) en check run et en
    # commentaire de PR : échecs avec leur message, tests
    # ajoutés ou retirés, écart de durée. Un même test lancé par Debug, Release et Ninja compte pour
    # un test et trois exécutions.
    #
    # Un job à part, sur Linux, plutôt qu'une étape des builds : les droits d'écriture ne sont
    # accordés qu'ici, à un job qui ne compile ni n'exécute rien du dépôt. Pas de workflow_run (le
    # montage recommandé pour les forks) : il exécuterait avec des droits d'écriture des artefacts
    # produits par la PR, et ce dépôt n'a pas de contributeur externe.
    needs: [ build-test-coverage, build-test-release, build-ninja, lint-exigences ]
    # Même en cas d'échec des builds : c'est justement là que le rapport sert. Les PR de Dependabot
    # reçoivent un jeton en lecture seule, la publication y échouerait.
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Recuperer les rapports JUnit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-*
          path: test-results

      - name: Publier les resultats de tests
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test-results/**/*.xml
          check_name: Tests (Debug, Release, Ninja, scripts)
          # Le commentaire est mis à jour à chaque push, pas dupliqué.
          comment_mode: always
          # Le verdict des tests appartient aux jobs de build ; ce job ne fait que le montrer.
          action_fail: false
