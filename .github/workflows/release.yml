name: Release

# Deux déclencheurs distincts, deux jobs indépendants :
# - push sur main  -> reconstruit la release "roulante" debug-latest (préversion Debug autonome,
#   toujours à jour avec le dernier commit intégré).
# - tag "vX.Y.Z"   -> publie une release versionnée (non préversion), avec les exécutables Debug
#   ET Release, chacun autonome -- seulement si le tag est sur main et que les tests passent sur
#   ce commit (job test-tag).
# Chaque release porte, à côté des zips du jeu, un zip de symboles (.pdb) par configuration et un
# fichier SHA256SUMS (scripts/release/package_release.ps1, scripts/release/write_sha256sums.ps1).
#
# L'unique application `JustAnotherRpgGame` est une app **Qt** : le job installe Qt
# (comme la CI), construit avec le **runtime MSVC dynamique** (les DLL Qt officielles sont en /MD ;
# un CRT statique provoquerait des incohérences d'allocation), et empaquette **tout le dossier de
# l'exécutable** — `windeployqt` (POST_BUILD, Source/HMI/CMakeLists.txt) y a déposé les DLL Qt, le
# plugin de plateforme (`platforms/`) et le runtime du compilateur, à côté des dossiers d'assets
# `Levels/` et `Localization/`. Aucune installation (Qt, VC++ redist) requise côté utilisateur.
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  # Relance manuelle sans commit vide : depuis main, reconstruit debug-latest ; depuis un tag, la
  # release versionnée (qui échoue si elle existe déjà : une version publiée ne se remplace pas).
  workflow_dispatch:

# Deux runs du même ref ne publient jamais en même temps. Sur main, le plus récent rend le précédent
# sans objet : annulé. Sur un tag, jamais : une release versionnée à moitié publiée est pire qu'une
# release en retard.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

# Lecture seule par défaut ; seuls les jobs qui publient demandent l'écriture.
permissions:
  contents: read

env:
  # Version de Qt épinglée (EX-BUILD-010), identique à `QT_VERSION_MINIMUM` dans
  # `Source/HMI/CMakeLists.txt` et à `env.QT_VERSION` de `ci.yml` — vérifié automatiquement par
  # `scripts/ci/check_qt_version_pin.py` (job lint-exigences de ci.yml) pour que les trois écritures
  # ne divergent jamais silencieusement.
  QT_VERSION: '6.11.2'
  # aqtinstall publie sur PyPI (3.3.0) ne sait PAS installer Qt >= 6.11 : Qt a change la
  # disposition de son depot (`qt6_6112/qt6_6112_msvc2022_64/`, un sous-dossier par architecture,
  # au lieu de `qt6_6103/qt6_6103/`), et 3.3.0 code en dur l'ancienne. Le correctif amont est
  # merge (miurahr/aqtinstall PR #1000, issues #959/#1007) mais pas encore publie. `aqtsource`
  # (entree de install-qt-action, prioritaire sur `aqtversion`) permet de pointer le depot git ;
  # le SHA est EPINGLE et non `@master`, sinon le provisionnement deriverait silencieusement, ce
  # que `EX-BUILD-010` / `EX-NFR-031` interdisent. A REMPLACER par `aqtversion: '==3.3.1'` des
  # qu'aqtinstall 3.3.1 parait sur PyPI -- cette URL git n'a pas vocation a rester.
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

jobs:
  rolling-debug:
    # Uniquement main : une relance manuelle depuis une autre branche ne doit pas publier
    # debug-latest. Pas de job de test ici : le commit est arrive sur main par une PR dont la CI est
    # un controle requis.
    if: github.ref == 'refs/heads/main'
    # Épinglé : windows-latest (image 2025) ne fournit pas le générateur VS 2022.
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      # Attestation de provenance (phase 3) : le jeton OIDC signe, le dépôt conserve l'attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Qt est nécessaire pour construire l'application (cf. ci.yml).
      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (Debug autonome, sans tests)
        run: >
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build-release --config Debug

      - name: Package (jeu, symboles, empreintes)
        shell: pwsh
        # Tout le dossier de l'exécutable (exe, DLL Qt + platforms/ par windeployqt, runtime, assets),
        # les .pdb dans une archive à part : voir scripts/release/package_release.ps1.
        run: |
          ./scripts/release/package_release.ps1 -BinDir build-release/bin/Debug -Name JustAnotherRpgGame-debug -OutDir dist
          Push-Location dist
          ../scripts/release/write_sha256sums.ps1 -Path JustAnotherRpgGame-debug.zip, JustAnotherRpgGame-debug-symbols.zip
          Pop-Location

      # L'archive, décompressée ailleurs, doit lancer le jeu et rendre une image (phase 3) : sinon
      # debug-latest garde la version précédente, qui elle fonctionnait.
      - name: Test de fumee de l'archive
        shell: pwsh
        run: ./scripts/release/smoke_test_release.ps1 -Zip dist/JustAnotherRpgGame-debug.zip

      # Prouve que chaque fichier publié sort de CE workflow sur CE commit :
      # `gh attestation verify JustAnotherRpgGame-debug.zip --repo <propriétaire>/JustAnotherRpgGame`.
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent : la release n'est jamais supprimée. L'ancienne séquence « delete puis create »
        # laissait le dépôt SANS debug-latest dès que la création échouait (réseau, quota). Ici le
        # tag est déplacé sur le commit, puis les fichiers sont remplacés un à un (--clobber) : au
        # pire, un échec laisse la version précédente en place.
        run: |
          $tag = 'debug-latest'
          $files = @('dist/JustAnotherRpgGame-debug.zip', 'dist/JustAnotherRpgGame-debug-symbols.zip', 'dist/SHA256SUMS')
          $notes = "Build Debug automatique du dernier commit sur main ($env:GITHUB_SHA). " +
                   "Décompresser JustAnotherRpgGame-debug.zip et lancer JustAnotherRpgGame.exe. " +
                   "Les symboles (.pdb) sont dans l'archive -symbols, les empreintes dans SHA256SUMS."

          # Le tag est déplacé par l'API, pas par `git push` : le checkout ne garde aucun jeton
          # (persist-credentials: false), seul le GH_TOKEN de cette étape peut écrire.
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true
          } else {
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha=$env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "Impossible de placer le tag $tag sur $env:GITHUB_SHA." }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Échec de l'envoi des fichiers sur $tag." }
            gh release edit $tag --notes $notes --prerelease
          } else {
            gh release create $tag @files --verify-tag --prerelease `
              --title "JustAnotherRpgGame — Debug (dernier main)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Échec de la publication de $tag." }

  test-tag:
    # Le build de release est BUILD_TESTING=OFF, et un tag peut être posé sur n'importe quel commit :
    # rien ne garantissait qu'une archive versionnée sorte d'un code testé. Ce job l'exige, sur le
    # commit EXACT du tag, dans les deux configurations livrées.
    if: github.ref_type == 'tag'
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # CONTRIBUTING : le tag se pose sur le commit de merge. Un tag sur une branche de travail
      # publierait un code qui n'est jamais passé par la CI d'une PR.
      - name: Le tag désigne un commit de main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Le tag $env:GITHUB_REF_NAME ($env:GITHUB_SHA) n'est pas sur main." }
          Write-Host "OK : $env:GITHUB_SHA est sur main."

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (CMake)
        run: cmake --preset vs
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Debug)
        run: cmake --build --preset vs

      - name: Test (Debug)
        run: ctest --preset vs

      - name: Build (Release)
        run: cmake --build --preset vs-release

      - name: Test (Release)
        run: ctest --preset vs-release

  versioned-release:
    if: github.ref_type == 'tag'
    needs: test-tag
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          version: ${{ env.QT_VERSION }}
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure (Debug autonome, sans tests)
        run: >
          cmake -S . -B build-debug -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Debug)
        run: cmake --build build-debug --config Debug

      # Release AVEC symboles. Les drapeaux par défaut de CMake pour MSVC en Release (`/O2 /Ob2
      # /DNDEBUG`, lien `/INCREMENTAL:NO`) ne produisent aucun .pdb : un plantage de la version
      # livrée serait illisible. `/Zi` n'écrit que le .pdb, sans changer le code généré ; `/DEBUG`
      # désactiverait par défaut `/OPT:REF` et `/OPT:ICF`, remis explicitement pour que l'exécutable
      # reste celui qu'aurait produit un Release sans symboles.
      - name: Configure (Release autonome avec symboles, sans tests)
        run: >
          cmake -S . -B build-prod -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF
          "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi"
          "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO /DEBUG /OPT:REF /OPT:ICF"
          "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO /DEBUG /OPT:REF /OPT:ICF"
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: Build (Release)
        run: cmake --build build-prod --config Release

      - name: Package (jeu, symboles, empreintes)
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/release/package_release.ps1 -BinDir build-debug/bin/Debug -Name "JustAnotherRpgGame-$env:VERSION-debug" -OutDir dist
          ./scripts/release/package_release.ps1 -BinDir build-prod/bin/Release -Name "JustAnotherRpgGame-$env:VERSION-release" -OutDir dist
          Push-Location dist
          ../scripts/release/write_sha256sums.ps1 -Path (Get-ChildItem -Filter *.zip | Sort-Object Name).Name
          Pop-Location

      # Les deux archives jouables, avant la publication : une version publiée ne se remplace pas.
      - name: Test de fumee des archives
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/release/smoke_test_release.ps1 -Zip "dist/JustAnotherRpgGame-$env:VERSION-debug.zip"
          ./scripts/release/smoke_test_release.ps1 -Zip "dist/JustAnotherRpgGame-$env:VERSION-release.zip"

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Les notes viennent du CHANGELOG plutôt que de `--generate-notes`, qui ne produit qu'une
      # liste brute de messages de commit — illisible pour le non-développeur à qui la release
      # versionnée est destinée. Le script échoue si la section de la version manque : mieux vaut
      # interrompre le workflow qu'ouvrir une release aux notes vides, qui ne se corrige pas
      # proprement. Cette étape est donc volontairement AVANT la publication.
      - name: Notes de release depuis le CHANGELOG
        env:
          VERSION: ${{ github.ref_name }}
        run: python scripts/release/extract_release_notes.py "$env:VERSION" -o release-notes.md

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -Path dist -File | ForEach-Object FullName)
          gh release create "$env:VERSION" @files --verify-tag `
            --title "$env:VERSION" `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Échec de la publication de $env:VERSION." }
