     En-tête HTML de la référence de code (Doxygen 1.16.1).

     C'est le gabarit livré par `doxygen -w html`, à une addition près : la barre commune du site,
     insérée en premier enfant de `#top`. Elle y est, et pas avant, parce que Doxygen mesure la
     hauteur de `#top` pour poser l'arbre de navigation et le contenu (`navtree.js`) : une barre
     posée hors de ce bloc décalerait les deux de sa propre hauteur.

     `Doxyfile` le charge par `HTML_HEADER`, et `DISABLE_INDEX = YES` remplace les onglets de
     Doxygen par cette barre-ci — sinon le site aurait deux rangées de navigation qui se
     répondent mal. La version de Doxygen est épinglée (ci.yml, docs.yml) : à sa prochaine montée,
     regénérer ce gabarit et y réinsérer la barre, plutôt que de le rafistoler.
-->

<script type="text/javascript">
/* La section courante, marquée à l'affichage : le gabarit est le même pour toutes les pages, et
   seul le navigateur sait laquelle il montre. Une page de classe ou de fichier n'allume rien. */
(function() {
  var here = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.topbar nav a').forEach(function(link) {
    var href = link.getAttribute('href');
    if (href.indexOf('../') < 0 && href.split('/').pop() === here) { link.className = 'active'; }
  });
})();
</script>
