# Manifeste du corpus source de JustAnotherRpgGame (LOT-30).
#
# Ce fichier est VERSIONNÉ ; les PDF qu'il décrit ne le sont pas — `Documentation/SourceBook/`
# est exclu en entier par le `.gitignore` (280 Mo de binaires, dont un fichier de 83 Mo). Le
# manifeste vit donc ici, avec l'outil qui le lit, et non à côté des documents qu'il décrit.
#
# Il porte quatre informations par document, et chacune répond à une panne observée :
#
#   `sha256`     — l'extraction refuse de tourner sur un document qui n'est plus celui-ci
#                  (EX-CNT-020). Sans cette empreinte, remplacer un PDF par une autre édition
#                  décale toutes les pages sans qu'aucun message ne le dise.
#   `pages`      — le nombre de pages PDF, second garde-fou, lisible par un humain.
#   `pagination` / `decalage`
#                — la correspondance « page imprimée → page PDF ». Les deux livres Tanares sont
#                  paginés en DOUBLE PAGE : une page PDF en porte deux côte à côte, et un
#                  sommaire qui annonce « p. 100 » désigne la page PDF 50. Ignorer ce facteur 2
#                  vise systématiquement le mauvais chapitre.
#   `type`       — `pdf` (par défaut), `image` (une planche seule) ou `collection` (un dossier de
#                  fichiers de même nature). Les ressources de table virtuelle (VTT) ajoutées au
#                  `LOT-38` ne sont pas toutes des PDF, et l'empreinte doit les couvrir aussi.
#   `provenance` — reportée telle quelle dans le champ `source` de chaque donnée produite
#                  (EX-CNT-001) : `srd`, `tanares`, `phb-fr`. Le jour d'une publication, la
#                  question « qu'est-ce qui doit sauter ? » se répond par une requête.
#
# Les empreintes ont été relevées les 2026-09-05 (les huit premiers documents) et 2026-09-07 (les
# neuf ressources VTT). Régénérer ce bloc :
#     python scripts/sourcebook verifier --regenerer

version = 1

