# ---------------------------------------------------------------------------------------------
# Ressources de table virtuelle (VTT) — ajoutées le 2026-09-07, avant le `LOT-38`.
#
# Elles ne viennent pas d'un autre livre : ce sont les fichiers de jeu distribués avec Tanares
# pour jouer sur table virtuelle. Leur intérêt tient à ce que les PDF de règles n'ont pas — des
# **cartes tactiques vues de dessus**, des **jetons ronds détourés**, une carte du monde à
# 9 933 x 7 016, et une feuille de personnage **vierge**, c'est-à-dire une maquette et non un
# exemple rempli.
#
# Ce qu'elles alimentent est écrit ici plutôt que découvert au lot suivant : c'est la seule façon
# qu'un lot les trouve sans les redécouvrir, et la raison pour laquelle elles sont déclarées
# AVANT d'être consommées.
# ---------------------------------------------------------------------------------------------

